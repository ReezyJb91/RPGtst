  /* ============================================================================
   * OLD LOGIC — SUPERSEDED, KEPT FOR REFERENCE ONLY. Do not call.
   * ============================================================================
   * Ranked domains by hidden value (HV) and distributed up to 3 stat points on
   * level-up: 3+ eligible domains (HV > 0) -> top 3 get 1 each. 2 eligible -> 2/1.
   * 1 eligible -> all 3. Tie-break randomized each call. Replaced 2026-09-07 by the
   * Stat Increase Formula Replacement — every domain now increases on every level-up
   * (StatIncrease[domain] = round(domainHV[domain] / playerLevel)), not just the
   * top-ranked 1-3 domains. See processLevelUp below for the new formula in place.
  function allocateStatPoints(hvMap) {
    const eligible = DOMAINS.filter((d) => (hvMap[d.key] || 0) > 0);
    const ranked = [...eligible]
      .sort(() => Math.random() - 0.5)
      .sort((a, b) => (hvMap[b.key] || 0) - (hvMap[a.key] || 0));

    const allocation = {};
    if (ranked.length >= 3) {
      ranked.slice(0, 3).forEach((d) => (allocation[d.key] = 1));
    } else if (ranked.length === 2) {
      allocation[ranked[0].key] = 2;
      allocation[ranked[1].key] = 1;
    } else if (ranked.length === 1) {
      allocation[ranked[0].key] = 3;
    }
    return allocation;
  }
  * ============================================================================ */

  // Applies stat increases for every level gained in one jump (usually 1, but a big
  // XP Booster-doubled or Emergency Quest grant could cross more than one),
  // accumulates the total gain per domain across however many levels were crossed,
  // applies it once, and queues the popup.
  // STAT INCREASE FORMULA REPLACEMENT (locked 2026-09-07) — replaces the old ranked
  // top-3 allocation entirely. Every domain now increases on EVERY level-up, driven by
  // that domain's own accumulated HV: StatIncrease[domain] = round(domainHV[domain] /
  // playerLevel), where playerLevel is the level JUST reached (post-increment) on that
  // iteration, not the overall final toLevel — matters for a multi-level jump, where
  // each level in the span uses its own newly-reached level number. Each domain's HV
  // resets to 0 immediately after its increase is applied (confirmed via simulation:
  // reset-each-cycle outperforms cumulative/no-reset on both zero-gain rate and
  // long-run growth) — this is why a multi-level jump's 2nd+ iteration always computes
  // 0 gain for every domain, same as the old ranked system's HV-reset behavior.
  // NOTE: the spec's provided reference implementation (applyLevelUpStatIncreases,
  // single-level, no return value) is inlined directly into this existing per-level
  // loop rather than kept as a separate standalone function — this loop already owns
  // multi-level jump handling, the before/after notification payload, and the neglect
  // checkpoint pass below, none of which the standalone snippet was written to cover.
  function processLevelUp(fromLevel, toLevel) {
    const beforeStats = { ...domainStats };
    const totalGain = {};
    let hvSnapshot = { ...domainHV };
    for (let i = 0; i < toLevel - fromLevel; i++) {
      const newLevel = fromLevel + i + 1; // the level JUST reached on this iteration
      DOMAINS.forEach((d) => {
        const hv = hvSnapshot[d.key] || 0;
        let increase = Math.round(hv / newLevel);
        // Stat Gain Floor (v40) — a domain that earned ANY HV this cycle is guaranteed
        // at least +1 on level-up, closing the "false blank" case where round() drops
        // a genuinely-earned small HV amount all the way to 0 at higher levels. A
        // domain that earned ZERO HV (real neglect) is untouched — still correctly 0,
        // preserving the existing Neglect design intent.
        if (increase === 0 && hv > 0) increase = 1;
        if (increase) totalGain[d.key] = (totalGain[d.key] || 0) + increase;
      });
      hvSnapshot = Object.fromEntries(DOMAINS.map((d) => [d.key, 0])); // reset after applying
    }
    setDomainStats((prev) => {
      const next = { ...prev };
      Object.keys(totalGain).forEach((key) => {
        next[key] = (next[key] || 0) + totalGain[key];
      });
      return next;
    });
    setDomainHV(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));

    const gains = {};
    DOMAINS.forEach((d) => {
      if (totalGain[d.key]) {
        const before = beforeStats[d.key] || 0;
        gains[d.key] = { before, after: before + totalGain[d.key] };
      }
    });
    setLevelUpNotification({ fromLevel, toLevel, gains });
    const gainLines = DOMAINS.filter((d) => gains[d.key])
      .map((d) => `${d.label} ${gains[d.key].before} -> ${gains[d.key].after}`)
      .join(", ");
    pushLog([
      `[System]: Level ${fromLevel} -> ${toLevel}.`,
      gainLines ? `[System]: ${gainLines}` : "[System]: No eligible domain for stat gain.",
    ]);

    // Neglect checkpoint: a domain that received a stat point at any point since the last
    // level-up resets to 0; everything else advances by one checkpoint. Stagnation
    // (Main Quest imbalance) needs no checkpoint step — it's read live from current state.
    // Neglect checkpoint: a domain that received a stat point resets to 0; everything else
    // advances by one checkpoint. "Received a point" means EITHER a manual spend/Urgent
    // Quest resolve flagged before this level-up (domainReceivedPointSinceCycle) OR the
    // ranked HV allocation that just ran above in this same level-up (totalGain) — a domain
    // that just won the allocation clearly isn't neglected, even though nothing had flagged
    // it yet. Missing this second source was the bug: a domain could visibly grow every
    // level-up via the ranked split and still show climbing neglect, because only the other
    // two point sources were ever checked.
    const nextPointsMissed = { ...domainPointsMissedStreak };
    DOMAINS.forEach((d) => {
      const receivedPoint = domainReceivedPointSinceCycle[d.key] || !!totalGain[d.key];
      nextPointsMissed[d.key] = receivedPoint ? 0 : (nextPointsMissed[d.key] || 0) + 1;
    });
    setDomainPointsMissedStreak(nextPointsMissed);
    setDomainReceivedPointSinceCycle(Object.fromEntries(DOMAINS.map((d) => [d.key, false])));

    // Emergency rolls FIRST every level-up check, against the neglect numbers just
    // computed above (not possibly-stale committed state). If it fires, Urgent does NOT
    // roll this same cycle — evaluateEmergencyTriggers returns whether it actually added
    // a quest. If Emergency doesn't fire (no eligible domain, or the chance roll fails),
    // Urgent still gets its own independent roll this same cycle, against live Main
    // Quest counts for stagnation. Function declarations are hoisted, so this can
    // reference both even though they're defined later in the file.
    const emergencyFired = evaluateEmergencyTriggers(nextPointsMissed);
    if (!emergencyFired) {
      evaluateUrgentTriggers(domainMainQuestsSinceReset);
    }
  }

  // BUG FIX (reported twice — Manual Quest completing but XP not landing): grantXp's
  // level-up math used to read the render-scoped `level` variable directly inside its
  // setXp functional updater. That's fine for a single call, but completeManualQuest
  // calls grantXp(25) AND grantHV (which itself calls grantXp again) synchronously in
  // the same handler, both still closed over the SAME pre-render `level`. If either
  // call crossed a level boundary, the second call's level-up detection could read a
  // now-stale `level` and misfire (or, in the worst case, race against React's state
  // batching in a way that dropped a queued update). This ref makes grantXp read/write
  // a single running "current best known" xp+level pair that's updated synchronously
  // with every call, so N calls in the same tick correctly chain off each other's
  // pending result instead of all reading the same stale snapshot. Kept in sync with
  // real state on every render so it self-corrects after loads/Quick Start/debug reset.
  const xpLevelRef = useRef({ xp: 0, level: 1 });
  useEffect(() => {
    xpLevelRef.current = { xp, level };
  }, [xp, level]);

  // Returns the ACTUAL amount granted (after XP Booster multiplier + equipment xpGain
  // enchant), so callers can display the real number instead of hardcoding their base
  // pre-boost figure — see the XP-Booster-appears-broken investigation (v41): the
  // booster's math here was always correct, but every caller's log/popup text was a
  // hardcoded base number that never reflected it, so the boost was invisible even
  // when it was working. Every call site updated to use this return value instead.
  function grantXp(amount) {
    // v39 rework: activeXpBoost is a time-window buff (up to 12hrs), applying its
    // multiplier to every grant during the window, not a single-grant doubler. Expiry
    // is checked here as a safety net (also auto-cleared ambiently — see the
    // expiry-check effect near activeXpBoost) so a grant that lands exactly as the
    // window closes never uses a stale multiplier.
    const boostLive = activeXpBoost && activeXpBoost.expiresAt > Date.now();
    let finalAmount = boostLive ? Math.round(amount * activeXpBoost.multiplier) : amount;
    const xpMult = 1 + equipmentEnchantBonus("xpGain");
    finalAmount = Math.round(finalAmount * xpMult);
    const { xp: curXp, level: curLevel } = xpLevelRef.current;
    let total = curXp + finalAmount;
    let lvl = curLevel;
    let cap = lvl * 100;
    while (total >= cap) {
      total -= cap;
      lvl += 1;
      cap = lvl * 100;
    }
    xpLevelRef.current = { xp: total, level: lvl }; // commit immediately so a second
    // grantXp call later in this SAME synchronous handler sees this result, not the
    // stale pre-handler snapshot.
    setXp(total);
    if (lvl !== curLevel) {
      setLevel(lvl);
      // processLevelUp must NOT run here — this executes synchronously inside whatever
      // handler called grantXp, before that handler's OTHER setState calls (e.g.,
      // flagging a domain as touched/received-a-point) have actually committed. Queuing
      // it for a useEffect guarantees it only runs after everything from this action has
      // landed, so it reads fresh state instead of stale pre-action closures.
      setPendingLevelUps((prev) => [...prev, { fromLevel: curLevel, toLevel: lvl }]);
    }
    return finalAmount;
  }

  // Every HV grant also counts toward leveling — 1 HV = 1 XP, applied through the same
  // grantXp path (including XP Booster doubling). This is the single place HV is ever
  // added, so every source (daily tasks, quests, HV Catalyst) stays consistent.
  // FIX (Emergency Quest System batch, 2026-09-07): grantHV used to also call grantXp
  // with the boosted HV amount — meaning every "+1 HV" or "+3 HV" quietly added that
  // many bonus XP on top of the quest's stated flat XP number, undocumented anywhere
  // in the UI. Removed so each quest type's XP total is EXACTLY its stated flat number
  // (Manual 30, Main 150, Urgent 75, Emergency 150) — nothing added on top. This also
  // has to land before Emergency Quest's HV=playerLevel scaling, since that reward
  // would otherwise silently also grant playerLevel bonus XP via this same path.
  function grantHV(domainKey, amount) {
    const hvMult = 1 + equipmentEnchantBonus("hvGain");
    const boosted = Math.round(amount * hvMult);
    setDomainHV((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + boosted }));
  }

  const XP_BOOSTER_DURATION_MS = 12 * 60 * 60 * 1000; // 12hr window, both tiers
  const XP_BOOSTER_MULTIPLIERS = { small: 1.5, large: 2 };

  // Hard-blocked from stacking, overwriting, or extending — must wait for the active
  // window to fully expire before a new booster (either tier) can be activated. No
  // amount-selector needed here (unlike item #16's other items) since only 1 can ever
  // be in flight regardless of how many are owned.
  function activateXpBooster(tier) {
    if (activeXpBoost) return;
    const field = tier === "small" ? "xpBoosterSmall" : "xpBoosterLarge";
    if (inventory[field] <= 0) return;
    const multiplier = XP_BOOSTER_MULTIPLIERS[tier];
    setInventory((prev) => ({ ...prev, [field]: prev[field] - 1 }));
    setActiveXpBoost({ tier, multiplier, expiresAt: Date.now() + XP_BOOSTER_DURATION_MS });
    pushLog([
      `[System]: XP Booster (${tier === "small" ? "Small" : "Large"}) activated — ${multiplier}x XP for 12 hours.`,
    ]);
  }

  // Spends `qty` HV Catalysts as `qty` SEPARATE +2 HV grants to the chosen domain
  // (not a single +2*qty application) — matches the "N separate applications" rule.
  function spendHvCatalystBatch(qty) {
    const actualQty = Math.min(qty, inventory.hvCatalysts);
    if (actualQty <= 0) return;
    const domain = DOMAINS.find((d) => d.key === spendCatalystDomain);
    setInventory((prev) => ({ ...prev, hvCatalysts: prev.hvCatalysts - actualQty }));
    for (let i = 0; i < actualQty; i++) grantHV(spendCatalystDomain, 2);
    pushLog([`[System]: HV Catalyst spent × ${actualQty} — ${domain.label}.`]);
  }

  // Avatar creation is one-and-done — this is the only way to change hairstyle afterward.
  // Consumes on use, temporarily re-enables just the hairstyle picker; re-locks automatically
  // the moment a new style is chosen.
  function useHairstyleChange() {
    if (inventory.hairstyleChanges <= 0 || hairstyleEditUnlocked) return;
    setInventory((prev) => ({ ...prev, hairstyleChanges: prev.hairstyleChanges - 1 }));
    setHairstyleEditUnlocked(true);
    pushLog(["[System]: Hairstyle Change used — pick a new style."]);
  }

  // Shop: purely cosmetic. Head/Upper/Lower are buy-once-equip-freely; Accessory/Aura are
  // sequential ladders (must own tier N-1 before buying tier N). Every purchase here is the
  // only source of goldSpentTotal, which is what the "Big Spender" emblem tracks.
  function buyCosmeticItem(slot, catalog, item) {
    const owned = shopOwned[slot];
    if (owned.includes(item.id) || inventory.gold < item.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - item.cost }));
    setGoldSpentTotal((prev) => prev + item.cost);
    setShopOwned((prev) => ({ ...prev, [slot]: [...prev[slot], item.id] }));
    pushLog([`[System]: Purchased ${item.label} — ${item.cost} Gold.`]);
  }

  function equipCosmeticItem(slot, itemId) {
    if (itemId !== null && !shopOwned[slot].includes(itemId)) return;
    setShopEquipped((prev) => ({ ...prev, [slot]: itemId }));
  }

  function buyAccessoryTier() {
    const nextIdx = accessoryTier; // tier N is index N-1; buying rung `accessoryTier + 1`
    if (nextIdx >= ACCESSORY_TIERS.length) return;
    const tier = ACCESSORY_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAccessoryTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  function buyAuraTier() {
    const nextIdx = auraTier;
    if (nextIdx >= AURA_TIERS.length) return;
    const tier = AURA_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAuraTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  // Universal Dungeon Key — static Shop line, always available (not part of the daily
  // rotating gear reroll). 250g each, capped 3/day; the cap resets alongside the Shop
  // gear reroll in the dailyQuestDeadline rollover effect. Purchase now goes through a
  // quantity selector + Confirm/Complete flow (same pattern as Gear purchase) instead
  // of an instant single-key buy — see openUniversalKeyPurchaseConfirm below.
  function openUniversalKeyPurchaseConfirm() {
    const remaining = KEY_DAILY_PURCHASE_CAP - keyPurchasesToday.universal;
    const qty = Math.min(universalKeyQty, remaining);
    if (qty <= 0) return;
    const totalCost = UNIVERSAL_KEY_SHOP_COST * qty;
    if (inventory.gold < totalCost) return;
    setKeyPurchaseConfirm({
      type: "universal",
      label: "Universal Key",
      qty,
      unitCost: UNIVERSAL_KEY_SHOP_COST,
      totalCost,
      remainingAfter: remaining - qty,
    });
  }

  // Domain-specific key — Shop-exclusive, no other source. 110g each, capped 3/day per
  // key type. Only spendable as entry payment for that domain's matching dungeon (see
  // DUNGEON_LOCATIONS) — spend priority (domain-specific first, universal as fallback)
  // is handled in startDungeonRun. Only whichever domain is rotating today (
  // shopDomainKeyToday) is purchasable — see rollShopDomainKey.
  function openDomainKeyPurchaseConfirm() {
    if (!shopDomainKeyToday) return;
    const domainKey = shopDomainKeyToday;
    const purchasedToday = keyPurchasesToday[domainKey] || 0;
    const remaining = KEY_DAILY_PURCHASE_CAP - purchasedToday;
    const qty = Math.min(domainKeyQty, remaining);
    if (qty <= 0) return;
    const totalCost = DOMAIN_KEY_SHOP_COST * qty;
    if (inventory.gold < totalCost) return;
    setKeyPurchaseConfirm({
      type: "domain",
      domainKey,
      label: `${DUNGEON_LOCATIONS[domainKey]} Key`,
      qty,
      unitCost: DOMAIN_KEY_SHOP_COST,
      totalCost,
      remainingAfter: remaining - qty,
    });
  }

  // Key Purchase flow, Cancel path: returns to the shop with zero changes, quantity
  // selector left as the player set it (same convention as Gear's cancelGearPurchase).
  function cancelKeyPurchase() {
    setKeyPurchaseConfirm(null);
  }

  // Key Purchase flow, step 2 of 3: Confirm actually executes the purchase (gold
  // deducted, keys added, daily cap counter bumped), same shape as confirmGearPurchase.
  // Then opens step 3, the completion acknowledgment, and resets that line's quantity
  // selector back to 1.
  function confirmKeyPurchase() {
    if (!keyPurchaseConfirm) return;
    const { type, domainKey, qty, totalCost, label } = keyPurchaseConfirm;
    if (type === "universal") {
      setInventory((prev) => ({ ...prev, gold: prev.gold - totalCost, dungeonKeys: prev.dungeonKeys + qty }));
      setKeyPurchasesToday((prev) => ({ ...prev, universal: prev.universal + qty }));
      setUniversalKeyQty(1);
    } else {
      setInventory((prev) => ({
        ...prev,
        gold: prev.gold - totalCost,
        domainKeys: { ...prev.domainKeys, [domainKey]: (prev.domainKeys[domainKey] || 0) + qty },
      }));
      setKeyPurchasesToday((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + qty }));
      setDomainKeyQty(1);
    }
    setGoldSpentTotal((prev) => prev + totalCost);
    pushLog([`[System]: Purchased ${label} × ${qty} — ${totalCost} Gold.`]);
    setKeyPurchaseConfirm(null);
    setKeyPurchaseComplete({ label, qty, totalCost });
  }

  // Key Purchase flow, step 3 of 3: dismissing the completion screen returns to the shop.
  function closeKeyPurchaseComplete() {
    setKeyPurchaseComplete(null);
  }

  // Reusable Shop slot picker — "None" plus each catalog item, showing owned/equipped/
  // purchasable state. Click an unowned item to buy it, an owned one to equip it.
  function renderShopSlot(slotKey, catalog, slotLabel) {
    const owned = shopOwned[slotKey];
    const equipped = shopEquipped[slotKey];
    return (
      <div className="mb-3">
        <div className="mono text-[10px] text-[#8B94A3] mb-1.5">{slotLabel}</div>
        <div className="flex gap-2 flex-wrap">
          <button
            onClick={() => equipCosmeticItem(slotKey, null)}
            className={`mono text-[9px] px-2 py-1.5 rounded border transition ${
              equipped === null
                ? "border-[#3DDBD9] text-[#3DDBD9]"
                : "border-[#2A3140] text-[#8B94A3] hover:border-[#3A4150]"
            }`}
          >
            None
          </button>
          {catalog.map((item) => {
            const isOwned = owned.includes(item.id);
            const isEquipped = equipped === item.id;
            return (
              <button
                key={item.id}
                onClick={() =>
                  isOwned
                    ? equipCosmeticItem(slotKey, item.id)
                    : buyCosmeticItem(slotKey, catalog, item)
                }
                className={`flex items-center gap-1.5 mono text-[9px] px-2 py-1.5 rounded border transition ${
                  isEquipped
                    ? "border-[#3DDBD9]"
                    : isOwned
                    ? "border-[#2A3140] hover:border-[#3A4150]"
                    : "border-dashed border-[#2A3140] opacity-70 hover:opacity-100"
                }`}
              >
                <span
                  className="w-3 h-3 rounded-full inline-block shrink-0"
                  style={{ backgroundColor: item.color }}
                />
                <span className={isEquipped ? "text-[#3DDBD9]" : "text-[#D6DCE5]"}>
                  {item.label}
                </span>
                {!isOwned && <span className="text-[#F2C94C]">{item.cost}g</span>}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  // Reusable tier-ladder picker for Accessories/Aura — same visual language as the Emblem
  // ladder bars, but purchased with gold instead of earned.
  function renderShopLadder(label, tiers, currentTier, buyFn) {
    const nextTier = currentTier < tiers.length ? tiers[currentTier] : null;
    return (
      <div className="mb-3">
        <div className="flex items-center justify-between mb-1.5">
          <span className="mono text-[10px] text-[#8B94A3]">{label}</span>
          {currentTier > 0 && (
            <span className="mono text-[10px]" style={{ color: tiers[currentTier - 1].color }}>
              {tiers[currentTier - 1].label}
            </span>
          )}
        </div>
        <div className="flex gap-1 mb-1.5">
          {tiers.map((t, i) => (
            <div
              key={i}
              className="h-1.5 flex-1 rounded-full"
              style={{ backgroundColor: i < currentTier ? t.color : "#1E2430" }}
            />
          ))}
        </div>
        {nextTier ? (
          <button
            onClick={buyFn}
            disabled={inventory.gold < nextTier.cost}
            className="mono text-[10px] px-3 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5] disabled:opacity-40 disabled:cursor-not-allowed"
          >
            Buy {nextTier.label} — {nextTier.cost}g
          </button>
        ) : (
          <span className="mono text-[9px] text-[#5A6272]">Max tier owned</span>
        )}
      </div>
    );
  }
  // Shows today's single pre-rolled listing for this slot (name, tier, exact bonus %,
  // cost) with one BUY button — no more per-name/per-tier button grid. Listing stays
  // buyable multiple times until the next daily reroll (see rollShopGearStock).
  function renderGearShopSlot(slot, slotLabel) {
    const item = shopGearStock[slot];
    if (!item) return null; // init effect hasn't filled stock in yet on this render
    const cost = EQUIPMENT_SHOP_COST[item.tier];
    return (
      <div className="mb-3">
        <div className="mono text-[10px] text-[#8B94A3] mb-1.5">{slotLabel}</div>
        <button
          onClick={() => openGearPurchaseConfirm(slot)}
          disabled={inventory.gold < cost}
          className="mono text-[9px] px-2 py-1.5 rounded border border-dashed border-[#2A3140] text-[#D6DCE5] opacity-80 hover:opacity-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
        >
          {equipmentItemLabel(item)} <span className="text-[#F2C94C]">{cost}g</span>
        </button>
      </div>
    );
  }

  // Static Shop line for a dungeon key (universal or domain-specific) — shows remaining
  // daily purchases left out of KEY_DAILY_PURCHASE_CAP, a quantity stepper capped at
  // that remaining allowance, and a BUY button that opens the Confirm step (see
  // openUniversalKeyPurchaseConfirm/openDomainKeyPurchaseConfirm) rather than buying
  // instantly.
  function renderKeyShopLine(label, scopeLabel, cost, purchasedToday, qty, setQty, openConfirmFn) {
    const remaining = KEY_DAILY_PURCHASE_CAP - purchasedToday;
    const clampedQty = Math.max(1, Math.min(qty, Math.max(remaining, 1)));
    const disabled = remaining <= 0 || inventory.gold < cost * clampedQty;
    return (
      <div className="flex items-center justify-between gap-2 mb-2">
        <div>
          <div className="mono text-[9px]" style={{ color: "#D6DCE5" }}>
            {label} <span className="text-[#F2C94C]">{cost}g</span>
          </div>
          <div className="mono text-[9px]" style={{ color: "#5A6272" }}>
            {scopeLabel} · {remaining}/{KEY_DAILY_PURCHASE_CAP} left today
          </div>
        </div>
        <div className="flex items-center gap-1.5 shrink-0">
          <button
            onClick={() => setQty((q) => Math.max(1, q - 1))}
            disabled={remaining <= 0}
            className="mono text-[9px] w-5 h-5 rounded border border-[#2A3140] text-[#8B94A3] disabled:opacity-30 disabled:cursor-not-allowed transition"
          >
            −
          </button>
          <span className="mono text-[9px] w-4 text-center" style={{ color: "#D6DCE5" }}>
            {clampedQty}
          </span>
          <button
            onClick={() => setQty((q) => Math.min(Math.max(remaining, 1), q + 1))}
            disabled={remaining <= 0}
            className="mono text-[9px] w-5 h-5 rounded border border-[#2A3140] text-[#8B94A3] disabled:opacity-30 disabled:cursor-not-allowed transition"
          >
            +
          </button>
          <button
            onClick={openConfirmFn}
            disabled={disabled}
            className="mono text-[9px] px-3 py-1.5 rounded border border-dashed border-[#2A3140] text-[#D6DCE5] opacity-80 hover:opacity-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
          >
            BUY
          </button>
        </div>
      </div>
    );
  }

  // Equip panel — one card per owned item, per slot. Each card shows the item name/
  // header plus its full Primary/Secondary/Enchant breakdown (equipmentCardLines —
  // Gear Card redo), an explicit EQUIP/UNEQUIP button (never a bare click-to-toggle),
  // and a SELL button (only shown when NOT equipped — must unequip first per spec).
  // Shows every owned item regardless of source (bought, quest-dropped, Equipment
  // Lootbox, or Dungeon Lootbox), since all feed the same gearInventory.
  // VIEW/EQUIP/SELL ONLY — no purchasing here anymore; buying happens in the Shop.
  // Level-gated at EQUIP time — an owned item below the player's level shows a
  // "Lv X" badge instead of an EQUIP button (SELL still works regardless of level).
  function renderGearEquipPanel() {
    return (
      <div className="border border-[#1E2430] bg-[#12151C] rounded-md p-4 mb-4">
        <div className="mono text-xs tracking-widest text-[#8B94A3] mb-3">EQUIPMENT</div>
        {EQUIPMENT_SLOTS.map((slot) => {
          const owned = gearInventory.filter((i) => i.slot === slot);
          const equippedId = equipment[slot] ? equipment[slot].id : null;
          return (
            <div key={slot} className="mb-3">
              <div className="mono text-[10px] text-[#8B94A3] mb-1.5">
                {slot.toUpperCase()}
                {equippedId && <span className="text-[#3DDBD9]"> — equipped</span>}
              </div>
              {owned.length === 0 ? (
                <span className="mono text-[9px] text-[#5A6272]">
                  Nothing owned yet — visit the Shop.
                </span>
              ) : (
                <div className="space-y-2">
                  {owned.map((item) => {
                    const isEquipped = equippedId === item.id;
                    const levelReq = EQUIPMENT_EQUIP_LEVEL_REQ[item.tier];
                    const tooLow = level < levelReq;
                    return (
                      <div
                        key={item.id}
                        className="rounded border px-2 py-1.5"
                        style={{ borderColor: isEquipped ? "#3DDBD9" : "#2A3140" }}
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <div
                              className="mono text-[9px] mb-1"
                              style={{ color: isEquipped ? "#3DDBD9" : tooLow ? "#5A6272" : "#D6DCE5" }}
                            >
                              {item.tier === "named" ? `${item.name} (Named)` : item.name}
                            </div>
                            {equipmentCardLines(item).map((line, i) => (
                              <div key={i} className="mono text-[9px]" style={{ color: "#8B94A3" }}>
                                {line}
                              </div>
                            ))}
                          </div>
                          <div className="flex flex-col gap-1 shrink-0">
                            {tooLow ? (
                              <span className="mono text-[9px] px-2 py-1 rounded border text-center border-[#2A3140] text-[#5A6272]">
                                Lv{levelReq}
                              </span>
                            ) : (
                              <button
                                onClick={() => equipGearItem(slot, isEquipped ? null : item.id)}
                                className="mono text-[9px] px-2 py-1 rounded border transition"
                                style={{
                                  borderColor: isEquipped ? "#3DDBD9" : "#2A3140",
                                  color: isEquipped ? "#3DDBD9" : "#8B94A3",
                                }}
                              >
                                {isEquipped ? "UNEQUIP" : "EQUIP"}
                              </button>
                            )}
                            {!isEquipped && (
                              <button
                                onClick={() => openGearSellConfirm(item)}
                                className="mono text-[9px] px-2 py-1 rounded border transition border-[#2A3140] text-[#8B94A3]"
                              >
                                SELL
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        <div className="mono text-[9px] text-[#5A6272] mt-1">
          Equipment effects apply in every Dungeon, regardless of domain. T3 is never
          sold — quest/Lootbox drops only. Level requirement applies to EQUIPPING, not
          owning — you can hold gear above your level, but cannot wear it yet. Equipped
          gear must be unequipped before it can be sold.
        </div>
      </div>
    );
  }

  // Shared −/qty/+ stepper for the Consumable + Lootbox Usage flow — same visual as
  // the Shop's key-purchase stepper. maxQty already accounts for whatever constraint
  // applies to that item (owned count, hairstyleEditUnlocked gating at 1, or the
  // penaltyQueue length for Teleport Stone). XP Booster isn't part of this flow at
  // all (v39) — see its own dedicated activate UI in the Inventory panel.
  function renderUsageStepper(itemKey, maxQty) {
    const qty = getUsageQty(itemKey);
    return (
      <div className="flex items-center gap-1">
        <button
          onClick={() => setUsageQtyFor(itemKey, (q) => Math.max(1, q - 1))}
          disabled={maxQty <= 1}
          className="mono text-[9px] w-5 h-5 rounded border border-[#2A3140] text-[#8B94A3] disabled:opacity-30 disabled:cursor-not-allowed transition"
        >
          −
        </button>
        <span className="mono text-[9px] w-4 text-center" style={{ color: "#D6DCE5" }}>
          {qty}
        </span>
        <button
          onClick={() => setUsageQtyFor(itemKey, (q) => Math.min(Math.max(maxQty, 1), q + 1))}
          disabled={maxQty <= 1}
          className="mono text-[9px] w-5 h-5 rounded border border-[#2A3140] text-[#8B94A3] disabled:opacity-30 disabled:cursor-not-allowed transition"
        >
          +
        </button>
      </div>
    );
  }

  function renderInventoryPanel() {
    return (
      <>
      {/* Inventory — mystery box drops */}
      {(inventory.mysteryBoxes > 0 ||
        inventory.equipmentLootbox > 0 ||
        unopenedDungeonLootboxes.length > 0 ||
        inventory.teleportStones > 0 ||
        inventory.bonusStatPoints > 0 ||
        inventory.xpBoosterSmall > 0 ||
        inventory.xpBoosterLarge > 0 ||
        activeXpBoost ||
        inventory.hvCatalysts > 0 ||
        inventory.dungeonKeys > 0 ||
        Object.values(inventory.domainKeys).some((n) => n > 0) ||
        CONSUMABLE_BOOST_TYPES.some((t) => CONSUMABLE_BOOST_TIERS.some((tier) => inventory.consumableBoosts[t.key][tier] > 0)) ||
        inventory.gold > 0) && (
        <div className="border border-[#1E2430] bg-[#12151C] rounded-md px-4 py-3 mb-4 space-y-2">

          {inventory.hvCatalysts > 0 && (
            <div className="flex flex-wrap items-center gap-2">

                onClick={openHvCatalystUseConfirm}

          {CONSUMABLE_BOOST_TYPES.some((t) =>
            CONSUMABLE_BOOST_TIERS.some((tier) => inventory.consumableBoosts[t.key][tier] > 0)
          ) && (
            <div className="pt-1 border-t border-[#1E2430]">
              <div className="mono text-[9px] text-[#5A6272] mb-1">
                CONSUMABLE BOOSTS — applied when entering a Dungeon, not used from here
              </div>
              {CONSUMABLE_BOOST_TYPES.map((t) =>
                CONSUMABLE_BOOST_TIERS.map(
                  (tier) =>
                    inventory.consumableBoosts[t.key][tier] > 0 && (
                      <div key={`${t.key}-${tier}`} className="mono text-[10px] text-[#7EE8E6]">
                        {consumableBoostLabel(t.key, tier)} × {inventory.consumableBoosts[t.key][tier]}
                      </div>
                    )
                )
              )}
            </div>
          )}
        </div>
      )}
      </>
    );
  }


  // Single-roll pure resolver — returns a description of the outcome without touching
  // state, so it can be called N times in a row for a batched multi-open (see
  // openMysteryBoxesBatch) without any stale-closure risk between rolls.
  function rollMysteryBoxOnce() {
    const roll = Math.random() * 100;
    if (roll < 23) return { kind: "gold", amount: 20, logLine: "Mystery Box — 20 Gold." };
    if (roll < 41) return { kind: "gold", amount: 50, logLine: "Mystery Box — 50 Gold." };
    if (roll < 47) return { kind: "gold", amount: 120, logLine: "Mystery Box — 120 Gold." };
    if (roll < 57) return { kind: "inventory", field: "bonusStatPoints", logLine: "Mystery Box — Bonus Stat Point acquired." };
    // XP Booster split (v39) — old flat 10% (57-67) replaced by two tiers, 7%/3%
    // (64/67 boundary), same 7:3 ratio as the Financial pools, summing to the same 10%.
    if (roll < 64) return { kind: "inventory", field: "xpBoosterSmall", logLine: "Mystery Box — XP Booster (Small) acquired." };
    if (roll < 67) return { kind: "inventory", field: "xpBoosterLarge", logLine: "Mystery Box — XP Booster (Large) acquired." };
    if (roll < 82) return { kind: "inventory", field: "hvCatalysts", logLine: "Mystery Box — HV Catalyst acquired." };
    if (roll < 90) return { kind: "inventory", field: "dungeonKeys", logLine: "Mystery Box — Dungeon Key acquired." };
    if (roll < 95) return { kind: "inventory", field: "hairstyleChanges", logLine: "Mystery Box — Hairstyle Change acquired." };
    if (roll < 98) return { kind: "teleportStone", logLines: ["Mystery Box — ??? acquired.", "Teleportation Stone."] };
    return { kind: "autoLevelUp", logLines: ["Mystery Box — ??? acquired.", "Auto Level Up triggered."] };
  }

  // Opens `qty` Mystery Boxes as `qty` INDEPENDENT rolls (not one roll scaled up) —
  // Auto Level Up is applied sequentially so a multi-open with 2+ triggers still grants
  // 2+ separate, correctly-sequenced pendingLevelUps entries. Clamps qty to however many
  // are actually owned. Returns one result line per roll, for the Completion screen.
  function openMysteryBoxesBatch(qty) {
    const actualQty = Math.min(qty, inventory.mysteryBoxes);
    if (actualQty <= 0) return [];
    const rolls = [];
    for (let i = 0; i < actualQty; i++) rolls.push(rollMysteryBoxOnce());

    let goldGain = 0;
    const invGains = {};
    let teleportGain = 0;
    let autoLevelUpCount = 0;
    let highTierGain = 0;
    const logLines = [];
    const resultLines = [];
    rolls.forEach((r) => {
      if (r.kind === "gold") {
        goldGain += r.amount;
      } else if (r.kind === "inventory") {
        invGains[r.field] = (invGains[r.field] || 0) + 1;
      } else if (r.kind === "teleportStone") {
        teleportGain += 1;
        highTierGain += 1;
      } else if (r.kind === "autoLevelUp") {
        autoLevelUpCount += 1;
        highTierGain += 1;
      }
      const lines = r.logLines || [r.logLine];
      logLines.push(...lines.map((l) => `[System]: ${l}`));
      resultLines.push(lines[lines.length - 1]);
    });

    setInventory((prev) => {
      const next = { ...prev, mysteryBoxes: prev.mysteryBoxes - actualQty, gold: prev.gold + goldGain, teleportStones: prev.teleportStones + teleportGain };
      Object.entries(invGains).forEach(([field, count]) => {
        next[field] = (next[field] || 0) + count;
      });
      return next;
    });
    if (goldGain > 0) setGoldEarnedTotal((prev) => prev + goldGain);
    if (highTierGain > 0) setHighTierDropCount((prev) => prev + highTierGain);
    if (autoLevelUpCount > 0) {
      const fromLevel = level;
      setLevel(fromLevel + autoLevelUpCount);
      const newPending = [];
      for (let i = 0; i < autoLevelUpCount; i++) {
        newPending.push({ fromLevel: fromLevel + i, toLevel: fromLevel + i + 1 });
      }
      setPendingLevelUps((prev) => [...prev, ...newPending]);
    }
    pushLog(logLines);
    return resultLines;
  }

  // Single-box pure resolver for an unopened Dungeon Lootbox — 30/70 gear/consumable
  // split (or the box's own boosted gearChance, if a Drop Rate Boost was applied to the
  // run that dropped it) against that box's stored domainKey/tierKey. No state touched.
  function resolveDungeonLootboxBox(box) {
    const isGear = Math.random() < box.gearChance;
    if (isGear) {
      const item = rollDungeonLootbox(box.domainKey, box.tierKey);
      return { kind: "gear", item, logLine: `Dungeon Lootbox — ${equipmentItemLabel(item)}.` };
    }
    const picked = pickWeighted(CONSUMABLE_BOOST_ROLL_POOL);
    return {
      kind: "consumable",
      type: picked.type,
      tier: picked.tier,
      logLine: `Dungeon Lootbox — ${consumableBoostLabel(picked.type, picked.tier)}.`,
    };
  }

  // Opens `qty` banked Dungeon Lootboxes (FIFO — oldest first) as `qty` INDEPENDENT
  // resolutions, each against its OWN stored domain/tier/gearChance — never a single
  // roll scaled up. Clamps qty to however many are actually banked.
  function openDungeonLootboxesBatch(qty) {
    const actualQty = Math.min(qty, unopenedDungeonLootboxes.length);
    if (actualQty <= 0) return [];
    const boxesToOpen = unopenedDungeonLootboxes.slice(0, actualQty);
    const results = boxesToOpen.map(resolveDungeonLootboxBox);
    const gearItems = results.filter((r) => r.kind === "gear").map((r) => r.item);
    if (gearItems.length > 0) setGearInventory((prev) => [...prev, ...gearItems]);
    const consumableResults = results.filter((r) => r.kind === "consumable");
    if (consumableResults.length > 0) {
      setInventory((prev) => {
        const nextBoosts = { ...prev.consumableBoosts };
        consumableResults.forEach((r) => {
          nextBoosts[r.type] = { ...nextBoosts[r.type], [r.tier]: nextBoosts[r.type][r.tier] + 1 };
        });
        return { ...prev, consumableBoosts: nextBoosts };
      });
    }
    setUnopenedDungeonLootboxes((prev) => prev.slice(actualQty));
    pushLog(results.map((r) => `[System]: ${r.logLine}`));
    return results.map((r) => r.logLine);
  }

  // Opens `qty` banked Equipment Lootboxes as `qty` INDEPENDENT rolls (not one roll
  // scaled up), same convention as Mystery Box/Dungeon Lootbox. Simpler than Dungeon
  // Lootbox's batch since there's no per-box domain/tier metadata to carry — every
  // Equipment Lootbox resolves against the same flat EQUIPMENT_LOOTBOX_TIER_WEIGHTS.
  function openEquipmentLootboxesBatch(qty) {
    const actualQty = Math.min(qty, inventory.equipmentLootbox);
    if (actualQty <= 0) return [];
    const results = [];
    for (let i = 0; i < actualQty; i++) results.push(resolveEquipmentLootboxBox());
    setGearInventory((prev) => [...prev, ...results.map((r) => r.item)]);
    setInventory((prev) => ({ ...prev, equipmentLootbox: prev.equipmentLootbox - actualQty }));
    pushLog(results.map((r) => `[System]: ${r.logLine}`));
    return results.map((r) => r.logLine);
  }

  // Skips the front N penalties (N = qty) — each application advances the queue one
  // step, same as clearPenalty, starting the next queued entry's countdown fresh.
  // Clamped to however many are actually queued — using more than that would just
  // waste stones with no effect, so the picker itself caps selectable qty the same way.
  function useTeleportStoneBatch(qty) {
    const actualQty = Math.min(qty, inventory.teleportStones, penaltyQueue.length);
    if (actualQty <= 0) return;
    setInventory((prev) => ({ ...prev, teleportStones: prev.teleportStones - actualQty }));
    setPenaltyQueue((prev) => {
      const next = prev.slice(actualQty);
      setPenaltyDeadline(next.length > 0 ? Date.now() + next[0].durationSeconds * 1000 : null);
      return next;
    });
    pushLog([
      `[System]: Teleportation Stone used × ${actualQty}.`,
      `[System]: ${actualQty} penalt${actualQty === 1 ? "y" : "ies"} bypassed. App access restored.`,
    ]);
  }

  // Spends `qty` Bonus Stat Points as `qty` separate +1 awards to the chosen domain.
  function spendBonusStatPointBatch(qty) {
    const actualQty = Math.min(qty, inventory.bonusStatPoints);
    if (actualQty <= 0) return;
    const domain = DOMAINS.find((d) => d.key === spendBonusDomain);
    setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints - actualQty }));
    setDomainStats((prev) => ({ ...prev, [spendBonusDomain]: prev[spendBonusDomain] + actualQty }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [spendBonusDomain]: true }));
    pushLog([`[System]: Bonus Stat Point spent × ${actualQty} — ${domain.label} +${actualQty}.`]);
  }

  // ============================================================================
  // CONSUMABLE + LOOTBOX USAGE — universal Confirm/Amount flow. One generic pair of
  // modals (usageConfirm -> usageComplete) shared by every item below rather than
  // bespoke modals per item, driven by a small descriptor opened via openUsageConfirm.
  // Hairstyle Change is included for a consistent Confirm step, but its maxQty is
  // capped at 1 — it's a single-flag "armed" mechanic (hairstyleEditUnlocked), not a
  // stacking counter, so "use 3" has no well-defined meaning the way it does for HV
  // Catalyst or a lootbox roll. XP Booster (Small/Large) is deliberately NOT part of
  // this generic flow at all (v39) — it explicitly doesn't need the multi-use
  // selector/Confirm pattern per spec, since only 1 can ever be active regardless of
  // how many are owned; it gets its own direct-activate UI instead (see
  // activateXpBooster + the Inventory panel's XP Booster lines).
  // ============================================================================
  function usageOwnedCount(itemKey) {
    if (itemKey === "mysteryBoxes") return inventory.mysteryBoxes;
    if (itemKey === "equipmentLootboxes") return inventory.equipmentLootbox;
    if (itemKey === "dungeonLootboxes") return unopenedDungeonLootboxes.length;
    if (itemKey === "hvCatalysts") return inventory.hvCatalysts;
    if (itemKey === "bonusStatPoints") return inventory.bonusStatPoints;
    if (itemKey === "teleportStones") return Math.min(inventory.teleportStones, penaltyQueue.length);
    if (itemKey === "hairstyleChanges") return hairstyleEditUnlocked ? 0 : Math.min(inventory.hairstyleChanges, 1);
    return 0;
  }

  function getUsageQty(itemKey) {
    const maxQty = Math.max(usageOwnedCount(itemKey), 1);
    return Math.max(1, Math.min(usageQty[itemKey] || 1, maxQty));
  }

  function setUsageQtyFor(itemKey, updater) {
    setUsageQty((prev) => ({ ...prev, [itemKey]: updater(getUsageQty(itemKey)) }));
  }

  function openUsageConfirm(itemKey, label, previewFn) {
    const owned = usageOwnedCount(itemKey);
    if (owned <= 0) return;
    const qty = getUsageQty(itemKey);
    setUsageConfirm({ itemKey, label, qty, previewLines: previewFn(qty) });
  }

  function openMysteryBoxUseConfirm() {
    openUsageConfirm("mysteryBoxes", "Mystery Box", (qty) => [
      `Opening ${qty}x Mystery Box`,
      `${qty} individual roll${qty > 1 ? "s" : ""}`,
    ]);
  }
  function openDungeonLootboxUseConfirm() {
    openUsageConfirm("dungeonLootboxes", "Dungeon Lootbox", (qty) => [
      `Opening ${qty}x Dungeon Lootbox`,
      `${qty} individual roll${qty > 1 ? "s" : ""} — gear or Consumable Boost each`,
    ]);
  }
  function openEquipmentLootboxUseConfirm() {
    openUsageConfirm("equipmentLootboxes", "Equipment Lootbox", (qty) => [
      `Opening ${qty}x Equipment Lootbox`,
      `${qty} individual roll${qty > 1 ? "s" : ""}`,
    ]);
  }
  function openHvCatalystUseConfirm() {
    const domain = DOMAINS.find((d) => d.key === spendCatalystDomain);
    openUsageConfirm("hvCatalysts", "HV Catalyst", (qty) => [
      `${qty}x HV Catalyst — grants ${domain.label} +2 HV × ${qty}`,
    ]);
  }
  function openBonusStatPointUseConfirm() {
    const domain = DOMAINS.find((d) => d.key === spendBonusDomain);
    openUsageConfirm("bonusStatPoints", "Bonus Stat Point", (qty) => [
      `${qty}x Bonus Stat Point — grants ${domain.label} +1 × ${qty}`,
    ]);
  }
  function openTeleportStoneUseConfirm() {
    openUsageConfirm("teleportStones", "Teleportation Stone", (qty) => [
      `${qty}x Teleportation Stone — bypasses ${qty} queued penalt${qty === 1 ? "y" : "ies"}`,
    ]);
  }
  function openHairstyleChangeUseConfirm() {
    openUsageConfirm("hairstyleChanges", "Hairstyle Change", () => ["Unlocks the hairstyle picker"]);
  }

  function cancelUsage() {
    setUsageConfirm(null);
  }

  // Confirm step, dispatched by itemKey to the matching batch resolver. Each branch
  // resets that item's quantity selector back to 1 and opens the Completion screen.
  function confirmUsageAction() {
    if (!usageConfirm) return;
    const { itemKey, qty, label } = usageConfirm;
    setUsageConfirm(null);
    let resultLines = [];
    if (itemKey === "mysteryBoxes") {
      resultLines = openMysteryBoxesBatch(qty);
    } else if (itemKey === "dungeonLootboxes") {
      resultLines = openDungeonLootboxesBatch(qty);
    } else if (itemKey === "equipmentLootboxes") {
      resultLines = openEquipmentLootboxesBatch(qty);
    } else if (itemKey === "hvCatalysts") {
      const domain = DOMAINS.find((d) => d.key === spendCatalystDomain);
      spendHvCatalystBatch(qty);
      resultLines = [`${domain.label} +${qty * 2} HV`];
    } else if (itemKey === "bonusStatPoints") {
      const domain = DOMAINS.find((d) => d.key === spendBonusDomain);
      spendBonusStatPointBatch(qty);
      resultLines = [`${domain.label} +${qty} stat point${qty > 1 ? "s" : ""}`];
    } else if (itemKey === "teleportStones") {
      const actualQty = Math.min(qty, inventory.teleportStones, penaltyQueue.length);
      useTeleportStoneBatch(qty);
      resultLines = [`${actualQty} penalt${actualQty === 1 ? "y" : "ies"} bypassed`];
    } else if (itemKey === "hairstyleChanges") {
      useHairstyleChange();
      resultLines = ["Hairstyle picker unlocked"];
    }
    setUsageQty((prev) => ({ ...prev, [itemKey]: 1 }));
    setUsageComplete({ label, qty, resultLines });
  }

  function closeUsageComplete() {
    setUsageComplete(null);
  }

  // ============================================================================
  // EQUIPMENT — buy / equip / effect-calculation helpers. All effect math lives
  // here as small pure-ish readers over `equipment` state, called from wherever
  // Dungeon/Encounter/reward formulas need them, rather than duplicating the
  // "which slot has what" logic at every call site.
  // ============================================================================

  // Sum of every equipped item's Resolve-cost reduction — Weapon's primary (now a
  // randomized roll, not a fixed table lookup) plus any T3 Weapon/Trinket's fixed
  // secondary. Universal: applies in every Dungeon regardless of domain. Multiple
  // matches stack additively (different slots contributing is intentional — that's
  // separate pieces of gear, not the same slot stacking with itself).
  // ARMOR EXCLUDED from the T3-secondary line here (per Armor Protection Chance
  // change) — Armor's Secondary is a per-hit heart-loss negation now, handled
  // separately in the Final Room round resolution, not a Resolve-cost reduction.
  function equipmentResolveCostReduction() {
    let total = 0;
    EQUIPMENT_SLOTS.forEach((slot) => {
      const item = equipment[slot];
      if (!item) return;
      if (slot === "weapon") total += item.bonus;
      if (item.tier === "t3" && slot !== "armor") total += EQUIPMENT_T3_SECONDARY_REDUCTION;
    });
    return Math.min(0.9, total); // safety ceiling — never let stacked gear zero out cost
  }

  // Equipped Armor's Protection Chance (T3/Named only — T1/T2 Armor has none). Checked
  // PER HIT at the moment a Final Room round would otherwise cost a heart; on proc,
  // fully negates that heart loss for the hit. Returns 0 for T1/T2/no-armor.
  function equipmentArmorProtectionChance() {
    const item = equipment.armor;
    if (!item) return 0;
    return EQUIPMENT_ARMOR_PROTECTION_CHANCE[item.tier] || 0;
  }

  // Equipped Trinket's flat Tell Chance bonus — its rolled primary effect, NOT the
  // exotic enchant pool. Applied post-cap by the caller.
  function equipmentTellChanceBonus() {
    const item = equipment.trinket;
    return item ? item.bonus * 100 : 0;
  }

  // Sums one exotic-pool enchant type across all 3 equipped slots' enchants arrays —
  // an item can carry 0, 1, or (Named only) 2 enchants; both are summed if they
  // happen to be the same type (they never will be, per rollNamedEnchants, but the
  // sum handles it correctly regardless).
  function equipmentEnchantBonus(type) {
    let total = 0;
    EQUIPMENT_SLOTS.forEach((slot) => {
      const item = equipment[slot];
      if (!item || !item.enchants) return;
      item.enchants.forEach((ench) => {
        if (ench.type === type) total += ench.magnitude;
      });
    });
    return total;
  }

  // Purchase flow, step 1 of 3: tapping a shop item opens confirmation — no gold
  // deducted, no item created yet. Guards the same way the old disabled-button check
  // did (no stock yet, can't afford it).
  function openGearPurchaseConfirm(slot) {
    const stockItem = shopGearStock[slot];
    if (!stockItem) return;
    const cost = EQUIPMENT_SHOP_COST[stockItem.tier];
    if (inventory.gold < cost) return;
    setGearPurchaseConfirm({ slot, item: stockItem, cost });
  }

  // Purchase flow, Cancel path: returns to the shop with zero changes.
  function cancelGearPurchase() {
    setGearPurchaseConfirm(null);
  }

  // Purchase flow, step 2 of 3: Confirm actually executes the purchase — a fresh copy
  // (new id) of today's stock listing, same as the old buyEquipment did. Then opens
  // step 3, the completion acknowledgment, instead of returning straight to the shop.
  function confirmGearPurchase() {
    if (!gearPurchaseConfirm) return;
    const { item: stockItem, cost } = gearPurchaseConfirm;
    const item = equipmentClonePurchase(stockItem);
    setInventory((prev) => ({ ...prev, gold: prev.gold - cost }));
    setGoldSpentTotal((prev) => prev + cost);
    setGearInventory((prev) => [...prev, item]);
    pushLog([`[System]: Purchased ${equipmentItemLabel(item)} — ${cost} Gold.`]);
    setGearPurchaseConfirm(null);
    setGearPurchaseComplete({ item, cost });
  }

  // Purchase flow, step 3 of 3: dismissing the completion screen returns to the shop.
  function closeGearPurchaseComplete() {
    setGearPurchaseComplete(null);
  }

  // On mount, reflect the REAL subscription status rather than defaulting the toggle to
  // off — a returning subscriber should see it already ON. Polls briefly since the SDK
  // may still be mid-load when this component first mounts; oneSignalCall's queueing
  // covers the "not ready at all yet" case, but PushSubscription.optedIn specifically
  // needs the SDK to have actually finished initializing to read a real value, so this
  // retries a few times rather than only checking once.
  useEffect(() => {
    let cancelled = false;
    let attempts = 0;
    function checkStatus() {
      if (cancelled) return;
      if (window.OneSignal && window.OneSignal.User && window.OneSignal.User.PushSubscription) {
        setPushOptedIn(!!window.OneSignal.User.PushSubscription.optedIn);
        return;
      }
      attempts += 1;
      if (attempts < 10) setTimeout(checkStatus, 500);
    }
    checkStatus();
    return () => {
      cancelled = true;
    };
  }, []);

  function enablePushNotifications() {
    setShowPushDeniedNote(false);
    // TEMP DEBUG — remove after diagnosing toggle issue
    if (typeof OneSignal === "undefined") {
      alert("DEBUG: OneSignal is undefined — SDK did not load");
      return;
    }
    oneSignalCall((OneSignal) => {
      OneSignal.Slidedown.promptPush();
      // Re-check shortly after — if the browser already denied permission previously,
      // promptPush() silently does nothing (browser limitation, can't be re-prompted
      // from JS) and optedIn stays false; show the inline note in that case.
      setTimeout(() => {
        const optedIn = !!(OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.optedIn);
        setPushOptedIn(optedIn);
        if (!optedIn) setShowPushDeniedNote(true);
      }, 1500);
    });
  }

  function disablePushNotifications() {
    setShowPushDeniedNote(false);
    oneSignalCall((OneSignal) => {
      OneSignal.User.PushSubscription.optOut();
    });
    setPushOptedIn(false);
  }

  // Sell flow, step 1 of 3: opens confirmation for an owned item — blocked if it's
  // currently equipped (must unequip first, per spec) or not actually owned.
  function openGearSellConfirm(item) {
    if (equipment[item.slot] && equipment[item.slot].id === item.id) return; // equipped — can't sell
    if (!gearInventory.some((i) => i.id === item.id)) return;
    const sellPrice = Math.round(EQUIPMENT_SELL_REFERENCE_VALUE[item.tier] * EQUIPMENT_SELL_PERCENT);
    setGearSellConfirm({ item, sellPrice });
  }

  function cancelGearSell() {
    setGearSellConfirm(null);
  }

  // Sell flow, step 2 of 3: Confirm removes the item from gearInventory and adds gold.
  function confirmGearSell() {
    if (!gearSellConfirm) return;
    const { item, sellPrice } = gearSellConfirm;
    setGearInventory((prev) => prev.filter((i) => i.id !== item.id));
    setInventory((prev) => ({ ...prev, gold: prev.gold + sellPrice }));
    setGoldEarnedTotal((prev) => prev + sellPrice);
    pushLog([`[System]: Sold ${equipmentItemLabel(item)} — +${sellPrice} Gold.`]);
    setGearSellConfirm(null);
    setGearSellComplete({ item, sellPrice });
  }

  // Sell flow, step 3 of 3: dismissing the completion screen returns to the Gear tab.
  function closeGearSellComplete() {
    setGearSellComplete(null);
  }

  // Equips exactly ONE item into a slot, replacing whatever was equipped there before
  // (never adds a second item to the same slot). Passing itemId=null unequips the slot
  // entirely. Level-gated HERE (not at acquisition) per the FINAL queued spec — a
  // low-level player can own a higher tier via drop/lootbox/purchase, just can't equip
  // it yet.
  function equipGearItem(slot, itemId) {
    if (itemId === null) {
      setEquipment((prev) => ({ ...prev, [slot]: null }));
      return;
    }
    const item = gearInventory.find((i) => i.id === itemId && i.slot === slot);
    if (!item) return;
    if (level < EQUIPMENT_EQUIP_LEVEL_REQ[item.tier]) return;
    setEquipment((prev) => ({ ...prev, [slot]: item }));
  }

  // Rolled on every Manual/Main Quest completion (Daily Quest excluded, matching
  // the same "no escalating bonuses on the fixed routine" principle Encounters
  // and Mystery Boxes already follow). Independent of both of those rolls. Picks
  // a random name from that slot+tier's pool (T2/T3 only — T1 is never dropped).
  // Split into a gate (maybeGrantEquipmentDrop) and the actual grant logic
  // (grantEquipmentDropRoll) so the Debug tab can force a guaranteed roll while
  // keeping the normal tier-weighted odds for WHICH item comes out.
  function grantEquipmentDropRoll() {
    const tier = Math.random() < EQUIPMENT_DROP_TIER_WEIGHTS.t3 ? "t3" : "t2";
    const slot = EQUIPMENT_SLOTS[Math.floor(Math.random() * EQUIPMENT_SLOTS.length)];
    const namePool = EQUIPMENT_NAMES[tier][slot];
    const name = namePool[Math.floor(Math.random() * namePool.length)];
    const enchant = equipmentRollEnchant(tier);
    const item = equipmentCreateItem(slot, tier, name, { enchants: enchant ? [enchant] : [] });
    setGearInventory((prev) => [...prev, item]);
    pushLog([`[System]: Equipment drop — ${equipmentItemLabel(item)}.`]);
    return item;
  }

  function maybeGrantEquipmentDrop() {
    if (Math.random() >= EQUIPMENT_QUEST_DROP_CHANCE) return;
    grantEquipmentDropRoll();
  }

          if (s.domainQuestCount) setDomainQuestCount(s.domainQuestCount);
          if (s.totalCyclesCompleted !== undefined) setTotalCyclesCompleted(s.totalCyclesCompleted);

          if (s.inventory) {

          if (s.activeXpBoost !== undefined) setActiveXpBoost(s.activeXpBoost);
          if (s.unlockedEmblems) setUnlockedEmblems(s.unlockedEmblems);
          // Merge with a default eyeStyle so saves from before this field existed

          if (s.avatar) setAvatar({ eyeStyle: EYE_STYLES[0].key, ...s.avatar });
          if (s.avatarLocked !== undefined) setAvatarLocked(s.avatarLocked);
          if (s.quickStartDismissed !== undefined) setQuickStartDismissed(s.quickStartDismissed);
          if (s.manualQuests) setManualQuests(s.manualQuests);
          // Main Quest data model changed (flat label -> SMART fields). Migrate an old
          // save's in-progress label into `specific` rather than silently losing it —
          // setAt defaults to now, so it starts its 48h lock fresh rather than being
          // instantly completable.
          if (s.mainQuests) {
            const migrated = Object.fromEntries(
              Object.entries(s.mainQuests).map(([key, q]) => [
                key,
                q && q.specific === undefined && q.label
                  ? {
                      specific: q.label,
                      measurable: "",
                      relevant: "",

          // the app was closed, same catch-up behavior as the Daily Quest deadline.
          if (s.fatigue !== undefined) setFatigue(s.fatigue);
          if (s.fatigueUpdatedAt !== undefined) setFatigueUpdatedAt(s.fatigueUpdatedAt);
          if (s.missCount !== undefined) setMissCount(s.missCount);
          if (s.currentStreak !== undefined) setCurrentStreak(s.currentStreak);
          if (s.goldEarnedTotal !== undefined) setGoldEarnedTotal(s.goldEarnedTotal);
          if (s.goldSpentTotal !== undefined) setGoldSpentTotal(s.goldSpentTotal);
          if (s.highTierDropCount !== undefined) setHighTierDropCount(s.highTierDropCount);
          if (s.activeUrgentQuests) setActiveUrgentQuests(s.activeUrgentQuests);
          // Urgent Quest persistence fix (v35) — urgentTimeLeft/urgentQuestsThisCycle
          // were never wired into save/load (only activeUrgentQuests was), same bug
          // class as the Emergency Quest fix above, now closed the same way.
          if (s.urgentTimeLeft) setUrgentTimeLeft(s.urgentTimeLeft);
          if (s.urgentQuestsThisCycle) setUrgentQuestsThisCycle(s.urgentQuestsThisCycle);
          // Emergency Quest persistence — was previously useState-only (never wired into
          // save/load), so an active Emergency Quest was lost on app close/reopen.
          if (s.activeEmergencyQuests) setActiveEmergencyQuests(s.activeEmergencyQuests);
          if (s.emergencyTimeLeft) setEmergencyTimeLeft(s.emergencyTimeLeft);
          if (s.emergencyQuestsThisCycle) setEmergencyQuestsThisCycle(s.emergencyQuestsThisCycle);
          if (s.shopOwned) setShopOwned(s.shopOwned);
          if (s.shopEquipped) setShopEquipped(s.shopEquipped);
          if (s.accessoryTier !== undefined) setAccessoryTier(s.accessoryTier);
          if (s.auraTier !== undefined) setAuraTier(s.auraTier);
          if (s.gearInventory) setGearInventory(s.gearInventory);
          if (s.equipment) setEquipment({ weapon: null, armor: null, trinket: null, ...s.equipment });
          if (s.shopGearStock) setShopGearStock({ weapon: null, armor: null, trinket: null, ...s.shopGearStock });
          if (s.shopDomainKeyToday) setShopDomainKeyToday(s.shopDomainKeyToday);

          if (s.checked) setChecked(s.checked);
          if (s.questComplete !== undefined) setQuestComplete(s.questComplete);
          if (s.dailyQuestDeadline !== undefined) setDailyQuestDeadline(s.dailyQuestDeadline);
          if (s.penaltyQueue !== undefined) setPenaltyQueue(s.penaltyQueue);
          if (s.penaltyDeadline !== undefined) setPenaltyDeadline(s.penaltyDeadline);
          hadSave = true;
        }
      } catch (e) {

      setLoaded(true);
      pushLog(
        hadSave

          : [
              "[System]: You have become a Player.",
              "[System]: Daily Quest has arrived.",
              "[System]: Failure to comply will result in a penalty.",

    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
