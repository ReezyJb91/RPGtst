                className="mono text-[10px] px-3 py-1 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                SPEND
              </button>
            </div>
          )}
        </div>
      )}
      </>
    );
  }


  // Opens the Daily Quest's Mystery Box. Nothing is the most likely outcome — this is meant
  // to feel like a real loot roll, not a guaranteed bonus every day.
  // Weighted loot roll: 30% Teleportation Stone, 20% Bonus Stat Point, 3% Auto Level Up
  // (extremely rare — instantly grants a level, no XP requirement), 47% nothing.
  // Weighted loot roll. Gold is the common floor — every roll gives something, nothing
  // returns empty-handed. Teleportation Stone and Auto Level Up are the two power outliers,
  // both pushed to the rarest tier since they bypass real mechanics (penalty, XP curve).
  // Small Gold 36% | Medium Gold 18% | Large Gold 6%
  // Bonus Point 10% | XP Booster 10% | HV Catalyst 15%
  // Teleport Stone 3% | Auto Level Up 2%
  // Small Gold 31% | Medium Gold 18% | Large Gold 6% | Bonus Point 10% | XP Booster 10%
  // HV Catalyst 15% | Hairstyle Change 5% | Teleport Stone 3% | Auto Level Up 2%
  // Usable, not auto-opened — this only runs when the player taps Open on a banked box.
  // Rebalanced for Dungeon Key (8%) — trimmed only from Small Gold (31%->23%), every
  // other entry's odds are untouched. No level-up key source per design — Mystery Box
  // is the only way to earn one.
  function openMysteryBox() {
    if (inventory.mysteryBoxes <= 0) return;
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes - 1 }));
    const roll = Math.random() * 100;
    if (roll < 23) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 10 }));
      setGoldEarnedTotal((prev) => prev + 10);
      pushLog(["[System]: Mystery Box — 10 Gold."]);
    } else if (roll < 41) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 25 }));
      setGoldEarnedTotal((prev) => prev + 25);
      pushLog(["[System]: Mystery Box — 25 Gold."]);
    } else if (roll < 47) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 60 }));
      setGoldEarnedTotal((prev) => prev + 60);
      pushLog(["[System]: Mystery Box — 60 Gold."]);
    } else if (roll < 57) {
      setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints + 1 }));
      pushLog(["[System]: Mystery Box — Bonus Stat Point acquired."]);
    } else if (roll < 67) {
      setInventory((prev) => ({ ...prev, xpBoosters: prev.xpBoosters + 1 }));
      pushLog(["[System]: Mystery Box — XP Booster acquired."]);
    } else if (roll < 82) {
      setInventory((prev) => ({ ...prev, hvCatalysts: prev.hvCatalysts + 1 }));
      pushLog(["[System]: Mystery Box — HV Catalyst acquired."]);
    } else if (roll < 90) {
      setInventory((prev) => ({ ...prev, dungeonKeys: prev.dungeonKeys + 1 }));
      pushLog(["[System]: Mystery Box — Dungeon Key acquired."]);
    } else if (roll < 95) {
      setInventory((prev) => ({ ...prev, hairstyleChanges: prev.hairstyleChanges + 1 }));
      pushLog(["[System]: Mystery Box — Hairstyle Change acquired."]);
    } else if (roll < 98) {
      setInventory((prev) => ({ ...prev, teleportStones: prev.teleportStones + 1 }));
      setHighTierDropCount((prev) => prev + 1);
      pushLog(["[System]: Mystery Box — ??? acquired.", "[System]: Teleportation Stone."]);
    } else {
      const newLevel = level + 1;
      setHighTierDropCount((prev) => prev + 1);
      pushLog(["[System]: Mystery Box — ??? acquired.", "[System]: Auto Level Up triggered."]);
      setLevel(newLevel);
      setPendingLevelUps((prev) => [...prev, { fromLevel: level, toLevel: newLevel }]);
    }
  }

  function useTeleportStone() {
    if (inventory.teleportStones <= 0) return;
    setInventory((prev) => ({ ...prev, teleportStones: prev.teleportStones - 1 }));
    setPenaltyActive(false);
    setActiveChallenge(null);
    setPenaltyDeadline(null);
    pushLog([
      "[System]: Teleportation Stone used.",
      "[System]: Penalty bypassed. App access restored.",
    ]);
  }

  function spendBonusStatPoint() {
    if (inventory.bonusStatPoints <= 0) return;
    const domain = DOMAINS.find((d) => d.key === spendBonusDomain);
    setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints - 1 }));
    setDomainStats((prev) => ({ ...prev, [spendBonusDomain]: prev[spendBonusDomain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [spendBonusDomain]: true }));
    pushLog([`[System]: Bonus Stat Point spent — ${domain.label} +1.`]);
  }

  // Load saved state on mount. Runs once; sets `loaded` when done so the auto-save effect
  // doesn't fire on default state before a real save has had a chance to load.
  useEffect(() => {
    (async () => {
      let hadSave = false;
      try {
        const result = await window.storage.get("system-engine-save", false);
        if (result && result.value) {
          const s = JSON.parse(result.value);
          if (s.level) setLevel(s.level);
          if (s.xp !== undefined) setXp(s.xp);
          if (s.domainStats) setDomainStats(s.domainStats);
          if (s.domainHV) setDomainHV(s.domainHV);
          if (s.domainPointsMissedStreak) setDomainPointsMissedStreak(s.domainPointsMissedStreak);
          if (s.domainMainQuestsSinceReset) setDomainMainQuestsSinceReset(s.domainMainQuestsSinceReset);
          if (s.domainQuestCount) setDomainQuestCount(s.domainQuestCount);
          if (s.totalCyclesCompleted !== undefined) setTotalCyclesCompleted(s.totalCyclesCompleted);
          // Merge with a default dungeonKeys so saves from before this field existed
          // don't produce NaN when a key drops or "undefined" in the inventory display.
          if (s.inventory) setInventory({ dungeonKeys: 0, ...s.inventory });
          if (s.xpBoostActive !== undefined) setXpBoostActive(s.xpBoostActive);
          if (s.unlockedEmblems) setUnlockedEmblems(s.unlockedEmblems);
          // Merge with a default eyeStyle so saves from before this field existed
          // don't break the new eye-art lookup — old saves just get the first style.
          if (s.avatar) setAvatar({ eyeStyle: EYE_STYLES[0].key, ...s.avatar });
          if (s.avatarLocked !== undefined) setAvatarLocked(s.avatarLocked);
          if (s.manualQuests) setManualQuests(s.manualQuests);
          // Main Quest data model changed (flat label -> SMART fields). Migrate an old
          // save's in-progress label into `specific` rather than silently losing it —
          // setAt defaults to now, so it starts its 48h lock fresh rather than being
          // instantly completable.
          if (s.mainQuests) {
            const migrated = Object.fromEntries(
              Object.entries(s.mainQuests).map(([key, q]) => [
                key,
                q && q.specific === undefined && q.label
                  ? {
                      specific: q.label,
                      measurable: "",
                      relevant: "",
                      targetDate: "",
                      setAt: Date.now(),
                      complete: q.complete || false,
                    }
                  : q,
              ])
            );
            setMainQuests(migrated);
          }
          // fatigueUpdatedAt loads as-is (a real past timestamp) — the derived
          // currentFatigue calculation above correctly applies decay for however long
          // the app was closed, same catch-up behavior as the Daily Quest deadline.
          if (s.fatigue !== undefined) setFatigue(s.fatigue);
          if (s.fatigueUpdatedAt !== undefined) setFatigueUpdatedAt(s.fatigueUpdatedAt);
          if (s.missCount !== undefined) setMissCount(s.missCount);
          if (s.currentStreak !== undefined) setCurrentStreak(s.currentStreak);
          if (s.goldEarnedTotal !== undefined) setGoldEarnedTotal(s.goldEarnedTotal);
          if (s.goldSpentTotal !== undefined) setGoldSpentTotal(s.goldSpentTotal);
          if (s.highTierDropCount !== undefined) setHighTierDropCount(s.highTierDropCount);
          if (s.activeUrgentQuests) setActiveUrgentQuests(s.activeUrgentQuests);
          if (s.shopOwned) setShopOwned(s.shopOwned);
          if (s.shopEquipped) setShopEquipped(s.shopEquipped);
          if (s.accessoryTier !== undefined) setAccessoryTier(s.accessoryTier);
          if (s.auraTier !== undefined) setAuraTier(s.auraTier);
          // Real-clock daily cycle state — now persisted so it survives a reload within
          // the same real day, and so a missed midnight can be caught up on next open.
          if (s.checked) setChecked(s.checked);
          if (s.questComplete !== undefined) setQuestComplete(s.questComplete);
          if (s.dailyQuestDeadline !== undefined) setDailyQuestDeadline(s.dailyQuestDeadline);
          if (s.penaltyActive !== undefined) setPenaltyActive(s.penaltyActive);
          if (s.activeChallenge !== undefined) setActiveChallenge(s.activeChallenge);
          if (s.challengeTier !== undefined) setChallengeTier(s.challengeTier);
          if (s.penaltyDeadline !== undefined) setPenaltyDeadline(s.penaltyDeadline);
          hadSave = true;
        }
      } catch (e) {
        // no save yet — fresh start
      }
      setLoaded(true);
      pushLog(
        hadSave
          ? ["[System]: Welcome back, Player.", "[System]: Progress restored."]
          : [
              "[System]: You have become a Player.",
              "[System]: Daily Quest has arrived.",
              "[System]: Failure to comply will result in a penalty.",
            ]
      );
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Auto-saves the durable game state as one combined key whenever it changes. Daily Quest
  // and Penalty state (checked, questComplete, dailyQuestDeadline, penaltyActive, etc.) are
  // now included too — the real-clock model needs them persisted so a reload mid-day
  // resumes correctly, and so a missed midnight gets caught up on next open instead of
  // silently vanishing (see the deadline-crossing effect above).
  useEffect(() => {
    if (!loaded) return;
    const state = {
      level,
      xp,
      domainStats,
      domainHV,
      domainPointsMissedStreak,
      domainMainQuestsSinceReset,
      domainQuestCount,
      totalCyclesCompleted,
      inventory,
      xpBoostActive,
      unlockedEmblems,
      avatar,
      avatarLocked,
      manualQuests,
      mainQuests,
      fatigue,
      fatigueUpdatedAt,
      missCount,
      currentStreak,
      goldEarnedTotal,
      goldSpentTotal,
      highTierDropCount,
      activeUrgentQuests,
      shopOwned,
      shopEquipped,
      accessoryTier,
      auraTier,
      checked,
      questComplete,
      dailyQuestDeadline,
      penaltyActive,
      activeChallenge,
      challengeTier,
      penaltyDeadline,
    };
    window.storage.set("system-engine-save", JSON.stringify(state), false).catch(() => {});
  }, [
    loaded,
    level,
    xp,
    domainStats,
    domainHV,
    domainPointsMissedStreak,
    domainMainQuestsSinceReset,
    domainQuestCount,
    totalCyclesCompleted,
    inventory,
    xpBoostActive,
    unlockedEmblems,
    avatar,
    avatarLocked,
    manualQuests,
    mainQuests,
    fatigue,
    fatigueUpdatedAt,
    missCount,
    currentStreak,
    goldEarnedTotal,
    goldSpentTotal,
    highTierDropCount,
    activeUrgentQuests,
    shopOwned,
    shopEquipped,
    accessoryTier,
    auraTier,
    checked,
    questComplete,
    dailyQuestDeadline,
    penaltyActive,
    activeChallenge,
    challengeTier,
    penaltyDeadline,
  ]);

  // Wipes both the save and all in-memory state back to defaults.
  async function debugReset() {
    try {
      await window.storage.delete("system-engine-save", false);
    } catch (e) {
      // nothing saved yet — fine
    }
    setLevel(1);
    setXp(0);
    setDomainStats(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainHV(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainPointsMissedStreak(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainReceivedPointSinceCycle(Object.fromEntries(DOMAINS.map((d) => [d.key, false])));
    setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setTotalCyclesCompleted(0);
    setDomainQuestCount(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setInventory({
      mysteryBoxes: 0,
      teleportStones: 0,
      bonusStatPoints: 0,
      xpBoosters: 0,
      hvCatalysts: 0,
      hairstyleChanges: 0,
      dungeonKeys: 0,
      gold: 0,
    });
    setXpBoostActive(false);
    setUnlockedEmblems({});
    setLevelUpNotification(null);
    setPendingLevelUps([]);
    setAvatar({
      gender: GENDERS[0],
      skinTone: SKIN_TONES[0].key,
      eyeColor: EYE_COLORS[0],
      eyeStyle: EYE_STYLES[0].key,
      hairColor: HAIR_COLORS[0],
      hairstyle: HAIRSTYLES[2],
    });
    setAvatarLocked(false);
    setHairstyleEditUnlocked(false);
    setManualQuests([]);
    setMainQuests(
      Object.fromEntries(
        DOMAINS.map((d) => [
          d.key,
          { specific: "", measurable: "", relevant: "", targetDate: "", setAt: null, complete: false },
        ])
      )
    );
    setMainQuestSetupDomain(null);
    setFatigue(0);
    setFatigueUpdatedAt(Date.now());
    setActiveEncounter(null);
    setActiveDungeonRun(null);
    setMissCount(0);
    setCurrentStreak(0);
    setGoldEarnedTotal(0);
    setGoldSpentTotal(0);
    setHighTierDropCount(0);
    setActiveUrgentQuests([]);
    setUrgentTimeLeft(0);
    setUrgentPopupView("quest");
    setUrgentQuestsThisCycle(0);
    setShopOwned({ head: [], upper: [], lower: [] });
    setShopEquipped({ head: null, upper: null, lower: null });
    setAccessoryTier(0);
    setAuraTier(0);
    setChecked({});
    setQuestComplete(false);
    setDailyQuestDeadline(null); // init effect will set a fresh next-midnight value
    setPenaltyActive(false);
    setActiveChallenge(null);
    setChallengeTier(1);
    setPenaltyDeadline(null);
    setResetArmed(false);
    setSimResults(null);
    setDebugTriggerResult(null);
    clearLog();
    pushLog(["[System]: Debug reset — all progress wiped."]);
  }

  // Single shared clock heartbeat — every countdown display and deadline check derives
  // from this instead of running its own independent decrementing timer.
  useEffect(() => {
    const t = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // Initializes dailyQuestDeadline to the next real midnight the first time it's needed —
  // either a brand-new save, or a debug reset that cleared it back to null.
  useEffect(() => {
    if (loaded && dailyQuestDeadline === null) {
      setDailyQuestDeadline(getNextMidnight(Date.now()));
    }
  }, [loaded, dailyQuestDeadline]);

  // Fires whenever real midnight has passed relative to the current cycle's deadline —
  // whether that's because the app was open and a tick just crossed it live, or because
  // the app was closed over midnight and this is the first render after reopening (same
  // logic handles both: nowTick starts near "now" on mount, so if the loaded deadline is
  // already in the past, this fires immediately rather than waiting for a fresh tick).
  // Guarded on penaltyActive so it doesn't double-fire while already locked — see
  // clearPenalty/useTeleportStone for what happens if ANOTHER day passes while still stuck.
  useEffect(() => {
    if (!loaded || penaltyActive || dailyQuestDeadline === null) return;
    if (nowTick < dailyQuestDeadline) return;

    if (questComplete) {
      // Completed before the deadline hit — roll cleanly into the next cycle.
      setChecked({});
      setQuestComplete(false);
    } else {
      // Deadline passed with the quest incomplete — apply the penalty retroactively,
      // exactly as if the countdown had hit zero while the app was open.
      triggerPenalty();
    }
    setDailyQuestDeadline(getNextMidnight(nowTick));
    // Fatigue resets here specifically because this IS the real daily-timer-start
    // boundary (real midnight), not on early quest completion — matches the locked
    // design ("reset tied to the daily timer start, not cycle end").
    setFatigue(0);
    setFatigueUpdatedAt(nowTick);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [nowTick, loaded, dailyQuestDeadline, questComplete, penaltyActive]);

  // Drains the pending level-up queue one at a time. This is what actually calls
  // processLevelUp — deferred to an effect (never called synchronously from grantXp) so it
  // always reads state AFTER every other setState from the triggering action has committed,
  // instead of stale pre-action closures.
  useEffect(() => {
    if (pendingLevelUps.length === 0) return;
    const [next, ...rest] = pendingLevelUps;
    setPendingLevelUps(rest);
    processLevelUp(next.fromLevel, next.toLevel);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingLevelUps]);

  // The first active Urgent Quest is the "focused" one — the modal only ever shows one at
  // a time, even if multiple domains have quests queued simultaneously.
  const focusedUrgentQuest = activeUrgentQuests[0] || null;
  const focusedUrgentQuestIdRef = useRef(null);

  // Single consolidated effect for both "a new quest just became focused, reset the timer"
  // and "count down the existing timer." These MUST live in one effect, not two — splitting
  // them caused a real race: the countdown-check effect would read the leftover urgentTimeLeft
  // from whatever the PREVIOUS quest left it at (often 0, right after a resolve/fail) in the
  // same pass as the reset effect, immediately failing a quest that had just been created,
  // before the reset to 45s had actually applied. The ref lets this effect tell "brand new
  // quest, just reset and stop here" apart from "same quest, keep counting down."
  useEffect(() => {
    if (!focusedUrgentQuest) {
      focusedUrgentQuestIdRef.current = null;
      return;
    }

    if (focusedUrgentQuestIdRef.current !== focusedUrgentQuest.id) {
      focusedUrgentQuestIdRef.current = focusedUrgentQuest.id;
      setUrgentTimeLeft(URGENT_QUEST_WINDOW_SECONDS);
      setUrgentPopupView("quest");
      return; // don't evaluate failure this same pass — nothing to fail yet
    }

    if (urgentTimeLeft <= 0) {
      failFocusedUrgentQuest();
      return;
    }
    const t = setTimeout(() => setUrgentTimeLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [urgentTimeLeft, focusedUrgentQuest]);

  // Timeout with no reward. Deliberately doesn't reset the domain's neglect/stagnation
  // clocks or add any extra punishment — the underlying signal that caused it stays exactly
  // where it was, so it can simply resurface and roll again later.
  function failFocusedUrgentQuest() {
    if (!focusedUrgentQuest) return;
    const quest = focusedUrgentQuest;
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    pushLog([`[System]: Urgent Quest failed — ${quest.label}`, "[System]: No reward granted."]);
  }

  function touchedMapFromChecked() {
    const map = {};
    DOMAINS.forEach((d) => {
      const task = DAILY_TASKS.find((t) => t.domain === d.key);
      map[d.key] = !!(task && checked[task.id]);
    });
    return map;
  }

  // Runs at the end of every cycle (success or failure). Grows HV for whatever got touched
  // (daily tasks = 2 HV each), rolls the neglect clock, tracks stat-allocation stagnation,
  // and evaluates Urgent Quest triggers — only on a full pass does it also rank HV to
  // allocate the 3 earned stat points across domains.
  function endCycle({ awardPoints }) {
    const touched = touchedMapFromChecked();

    // Daily task HV growth now routes through grantHV, so it also counts toward leveling
    // (1 HV = 1 XP), consistent with every other HV source.
    DOMAINS.forEach((d) => {
      if (touched[d.key]) grantHV(d.key, 2);
    });

    setDomainQuestCount((prev) => {
      const next = { ...prev };
      DOMAINS.forEach((d) => {
        if (touched[d.key]) next[d.key] = (next[d.key] || 0) + 1;
      });
      return next;
    });

    // Ranked HV allocation replaced with 1 manually-allocated point per Daily Quest pass —
    // banked in inventory, spent on whichever domain the player chooses via the existing
    // Bonus Stat Point flow.
    if (awardPoints) {
      setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints + 1 }));
      pushLog(["[System]: +1 Stat Point earned. Allocate it in Inventory."]);
    }

    // The daily cycle's only remaining job for the Urgent Quest system: refresh the
    // per-cycle fire cap. Neglect and stagnation are both level-up-driven now — this
    // cycle boundary doesn't touch either of them.
    setUrgentQuestsThisCycle(0);
    setTotalCyclesCompleted((n) => n + 1); // real endCycle() count, for comparing against Level

    setChecked({});
  }

  // Neglect: consecutive level-up checkpoints without receiving a stat point (the old
  // domainPointsMissedStreak/domainReceivedPointSinceCycle tracking — repurposed as
  // neglect's definition now, not a separately-named "stagnation").
  function severityFromNeglect(streak) {
    if (streak >= NEGLECT_THRESHOLDS.severe) return "severe";
    if (streak >= NEGLECT_THRESHOLDS.moderate) return "moderate";
    if (streak >= NEGLECT_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Stagnation: how far this domain's Main Quest completions have fallen behind whichever
  // domain has completed the most, within the current window (since the last stagnation
  // reset). counts must include every domain, including this one.
  function severityFromStagnation(domainKey, counts) {
    const maxCount = Math.max(0, ...Object.values(counts));
    const deficit = maxCount - (counts[domainKey] || 0);
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.severe) return "severe";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.moderate) return "moderate";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Caps at 1 new Urgent Quest per cycle, gated on chance rather than firing automatically
  // the instant a domain crosses threshold. Two independent trigger sources feed the same
  // pool: neglect (not touched) and stagnation (touched, but keeps losing the point ranking).
  // Whichever is worse for a domain determines its severity. Eligible domains that don't get
  // picked stay queued silently for future cycles — no notification for a non-event.
  // Pure readout of what's currently eligible, straight from real committed game state —
  // used for the debug panel's live preview and the "run trigger on current state" button.
  // NOT used by evaluateUrgentTriggers itself: that function is called from processLevelUp
  // with a freshly-computed neglect map that hasn't been committed to state yet, so it needs
  // its own pass rather than reading domainPointsMissedStreak directly.
  function getCurrentEligibleDomains() {
    return DOMAINS.map((d) => {
      if (activeUrgentQuests.some((q) => q.domain === d.key)) return null;
      const neglectSev = severityFromNeglect(domainPointsMissedStreak[d.key] || 0);
      const stagnationSev = severityFromStagnation(d.key, domainMainQuestsSinceReset);
      let severity = null;
      let reason = null;
      if (neglectSev && SEVERITY_RANK[neglectSev] >= (SEVERITY_RANK[stagnationSev] || 0)) {
        severity = neglectSev;
        reason = "neglect";
      } else if (stagnationSev) {
        severity = stagnationSev;
        reason = "stagnation";
      }
      return severity ? { domain: d, severity, reason } : null;
    }).filter(Boolean);
  }

  // Pure roll: given a list of {domain, severity} eligible entries, returns the picked
  // one or null. No side effects — this is the exact mechanism both the real trigger path
  // and the debug simulator use, so simulating it actually tests the real code.
  function rollUrgentTrigger(eligible) {
    if (eligible.length === 0) return null;
    if (Math.random() > URGENT_TRIGGER_CHANCE) return null;
    const totalWeight = eligible.reduce((sum, e) => sum + SEVERITY_WEIGHT[e.severity], 0);
    let roll = Math.random() * totalWeight;
    let picked = eligible[0];
    for (const e of eligible) {
      roll -= SEVERITY_WEIGHT[e.severity];
      if (roll <= 0) {
        picked = e;
        break;
      }
    }
    return picked;
  }

  // Debug: fires rollUrgentTrigger 1000x against a synthetic eligible set (not real game
  // state) and tallies results. Tests the actual chance-gate + severity-weighting mechanism
  // in isolation, since waiting on real cycles to see if the odds "feel right" is slow and
  // easy to misjudge from a handful of pulls.
  function runUrgentTriggerSimulation(scenarioLabel, eligible) {
    const iterations = 1000;
    let firedCount = 0;
    const pickCounts = {};
    for (let i = 0; i < iterations; i++) {
      const picked = rollUrgentTrigger(eligible);
      if (picked) {
        firedCount++;
        pickCounts[picked.domain.key] = (pickCounts[picked.domain.key] || 0) + 1;
      }
    }
    setSimResults({ scenarioLabel, iterations, firedCount, pickCounts, eligible });
  }

  function evaluateUrgentTriggers(pointsMissedMap, mainQuestCounts) {
    if (urgentQuestsThisCycle >= URGENT_QUESTS_PER_CYCLE_CAP) return; // cap reached for this cycle
    setActiveUrgentQuests((prevActive) => {
      const eligible = DOMAINS.map((d) => {
        if (prevActive.some((q) => q.domain === d.key)) return null; // already has one active
        const neglectSev = severityFromNeglect(pointsMissedMap[d.key] || 0);
        const stagnationSev = severityFromStagnation(d.key, mainQuestCounts);
        let severity = null;
        let reason = null;
        if (neglectSev && SEVERITY_RANK[neglectSev] >= (SEVERITY_RANK[stagnationSev] || 0)) {
          severity = neglectSev;
          reason = "neglect";
        } else if (stagnationSev) {
          severity = stagnationSev;
          reason = "stagnation";
        }
        return severity ? { domain: d, severity, reason } : null;
      }).filter(Boolean);

      const picked = rollUrgentTrigger(eligible);
      if (!picked) return prevActive;

      const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
      if (pool.length === 0) return prevActive;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      const newQuest = {
        id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
        domain: picked.domain.key,
        label: chosen.label,
        severity: picked.severity,
      };

      // Player-facing log stays mechanics-free — no "neglect"/"stagnation" reveal, same
      // spirit as HV being a hidden value. The severity badge on the quest card itself
      // (mild/moderate/severe) is the only difficulty signal the player sees.
      pushLog([
        `[System]: Urgent Quest — ${picked.domain.label}.`,
        `[System]: ${chosen.label}`,
      ]);
      setUrgentQuestsThisCycle((n) => n + 1);

      // Stagnation reset rule: firing a quest FOR stagnation wipes the imbalance window for
      // EVERY domain, not just the picked one — the slate clears once you've been prompted
      // to address it, rather than immediately flagging whichever domain is next-most-behind.
      if (picked.reason === "stagnation") {
        setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));
      }

      return [...prevActive, newQuest];
    });
  }

  // Debug-only wrapper: runs the real trigger logic (same pure helpers, same real
  // consequences — a fired result really does add a real Urgent Quest and log it) but also
  // captures the outcome synchronously for display, since evaluateUrgentTriggers itself is
  // silent on a non-fire by design, which makes it look like nothing happened when testing.
  function runTriggerOnCurrentState() {
    const eligible = getCurrentEligibleDomains();
    const picked = rollUrgentTrigger(eligible);

    if (!picked) {
      setDebugTriggerResult({
        eligible,
        fired: false,
        reason: eligible.length === 0 ? "No domain eligible." : "Roll failed (40% chance not met).",
      });
      return;
    }

    const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
    if (pool.length === 0) {
      setDebugTriggerResult({ eligible, fired: false, reason: "Picked domain had an empty pool." });
      return;
    }
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    const newQuest = {
      id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
      domain: picked.domain.key,
      label: chosen.label,
      severity: picked.severity,
    };
    setActiveUrgentQuests((prev) => [...prev, newQuest]);
    // Shares the exact same player-facing (mechanics-hidden) log text as the real trigger
    // path — this button applies real consequences, so the log it produces should read
    // identically to what a real level-up trigger would write. Full detail (reason,
    // severity) still shows in debugTriggerResult below, in the Debug tab only.
    pushLog([
      `[System]: Urgent Quest — ${picked.domain.label}.`,
      `[System]: ${chosen.label}`,
    ]);
    if (picked.reason === "stagnation") {
      setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));
    }
    setDebugTriggerResult({ eligible, fired: true, picked, questLabel: chosen.label });
  }

  function resolveUrgentQuest(quest) {
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    setDomainStats((prev) => ({ ...prev, [quest.domain]: prev[quest.domain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [quest.domain]: true })); // auto stat point
    grantXp(15);
    grantHV(quest.domain, 1); // +1 more XP on top of the 15, since HV now always carries XP
    pushLog([
      `[System]: Urgent Quest resolved — ${quest.label}`,
      "[System]: +15 XP, +1 stat point.",
    ]);
    maybeRollEncounter(); // non-Daily completion — small chance of an Encounter
    maybeGrantMysteryBox(); // same non-Daily completions, independent roll
  }

  // Manual quests: player-authored, ad hoc ("go to the gym today"). Gives XP and HV, but no
  // direct stat bump — same as Main Quests, HV only influences future daily point allocation.
  // Completing one still counts as touching that domain today.
  function addManualQuest() {
    const label = newManualLabel.trim();
    if (!label) return;
    setManualQuests((prev) => [
      ...prev,
      { id: `manual-${Date.now()}-${Math.random()}`, label, domain: newManualDomain },
    ]);
    setNewManualLabel("");
  }

  function completeManualQuest(quest) {
    setManualQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    grantXp(10);
    grantHV(quest.domain, 1); // +1 more XP on top of the 10
    pushLog([`[System]: Manual Quest complete — ${quest.label}`, "[System]: +10 XP, +1 HV."]);
    maybeRollEncounter(); // non-Daily completion — small chance of an Encounter
    maybeGrantMysteryBox(); // same non-Daily completions, independent roll
  }

  // Main quests: one per domain, mandatory-feeling milestone objective, player-authored.
  // +3 HV plus a bigger XP reward on completion, matching the weight of a real milestone.
  // How many domains currently have a SMART quest set but not yet completed — the
  // number the domain cap checks against. Completed quests free their slot back up.
  function activeMainQuestCount() {
    return DOMAINS.filter((d) => mainQuests[d.key].specific && !mainQuests[d.key].complete).length;
  }

  function openMainQuestSetup(domainKey) {
    if (activeMainQuestCount() >= MAIN_QUEST_DOMAIN_CAP) return; // cap enforced at the open step
    setMainQuestSetupDomain(domainKey);
  }

  function submitMainQuestSetup(domainKey, fields) {
    if (!fields.specific.trim() || !fields.measurable.trim()) return; // minimum viable SMART entry
    setMainQuests((prev) => ({
      ...prev,
      [domainKey]: {
        specific: fields.specific.trim(),
        measurable: fields.measurable.trim(),
        relevant: fields.relevant.trim(),
        targetDate: fields.targetDate,
        setAt: Date.now(),
        complete: false,
      },
    }));
    setMainQuestSetupDomain(null);
    pushLog([`[System]: Main Quest set — ${DOMAINS.find((d) => d.key === domainKey).label}.`]);
  }

  function completeMainQuest(domainKey) {
    const quest = mainQuests[domainKey];
    if (!quest.specific || quest.complete) return;
    if (nowTick < quest.setAt + MAIN_QUEST_TIME_LOCK_MS) return; // still time-locked
    setMainQuests((prev) => ({ ...prev, [domainKey]: { ...prev[domainKey], complete: true } }));
    setDomainQuestCount((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    setDomainMainQuestsSinceReset((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    grantXp(60);
    grantHV(domainKey, 3); // +3 more XP on top of the 60
    pushLog([
      `[System]: Main Quest complete — ${quest.specific}`,
      "[System]: +60 XP, +3 HV.",
    ]);
    maybeRollEncounter(); // non-Daily completion — small chance of an Encounter
    maybeGrantMysteryBox(); // same non-Daily completions, independent roll
  }

  function resetMainQuest(domainKey) {
    setMainQuests((prev) => ({
      ...prev,
      [domainKey]: { specific: "", measurable: "", relevant: "", targetDate: "", setAt: null, complete: false },
    }));
  }

  // Shared fatigue-add helper — collapses the derived currentFatigue back into a
  // concrete snapshot at the moment of change, so decay continues correctly from
  // *this* point forward rather than from whenever it was last touched. Used by
  // Encounters below and by the Debug tab's manual test buttons.
  function addFatigue(amount) {
    setFatigue(Math.min(100, currentFatigue + amount));
    setFatigueUpdatedAt(nowTick);
  }

  // Resolution behind one function boundary, per the extensibility plan — everything
  // that CALLS this only ever reacts to its result, so V2 (multi-stat, multi-stage)
  // can change what happens INSIDE this function without touching any call site.
  // Accepts a full stats object even though V1 only reads the one relevant domain's
  // stat off it, for the same forward-compatibility reason.
  //
  // Two-stage stat scaling — see ENCOUNTER_STAGE2_START/CAP above for the full
  // reasoning. Stage 1 lowers the Loss threshold toward its permanent floor of 10
  // (40-30); Stage 2 only ever touches the WIN threshold, so Loss can never drop
  // further no matter how high the stat climbs — investment past the Stage 1 cap
  // converts Close call into Win instead of doing nothing.
  function resolveEncounter(encounter, stats) {
    const relevantStat = stats[encounter.domain] || 0;
    const stage1Bonus = Math.min(ENCOUNTER_STAT_BONUS_CAP, relevantStat * 0.3);
    const extraStat = Math.max(0, relevantStat - ENCOUNTER_STAGE2_START);
    const stage2Bonus = Math.min(ENCOUNTER_STAGE2_CAP, extraStat * 0.1);
    const lossThreshold = 40 - stage1Bonus; // floors at 10, permanently
    const winThreshold = 70 - stage1Bonus - stage2Bonus; // keeps dropping via stage2 past that point
    const roll = Math.random() * 100;
    const tier = roll >= winThreshold ? "win" : roll >= lossThreshold ? "closeCall" : "loss";
    const text = tier === "win" ? encounter.winText : tier === "closeCall" ? encounter.closeCallText : encounter.lossText;

    // Financial Win grants an item instead of gold — see ENCOUNTER_ITEM_POOL and the
    // comment above ENCOUNTER_POOL's Financial section for the reasoning. Close
    // call/Loss stay on the uniform gold system even for Financial; only Win differs.
    let itemReward = null;
    let goldChange = ENCOUNTER_GOLD[tier];
    if (encounter.domain === "financial" && tier === "win") {
      itemReward = ENCOUNTER_ITEM_POOL[Math.floor(Math.random() * ENCOUNTER_ITEM_POOL.length)];
      goldChange = 0;
    }

    return {
      tier,
      text,
      goldChange,
      itemReward,
      fatigueChange: ENCOUNTER_FATIGUE[tier],
      stages: [{ roll, tier }], // always exactly 1 stage in V1 — see design notes above
    };
  }

  // Small chance on Manual/Urgent/Main Quest completion — deliberately excludes Daily
  // Quest, which stays the fixed, non-escalating routine it was always meant to be.
  function maybeRollEncounter() {
    if (Math.random() >= ENCOUNTER_CHANCE) return;
    const encounter = ENCOUNTER_POOL[Math.floor(Math.random() * ENCOUNTER_POOL.length)];
    setActiveEncounter({ encounter, result: null });
  }

  // The original "small lootbox chance on quest completion" idea — deliberately kept
  // separate from Encounters (which also fire on these same 3 completion types) rather
  // than having Encounter Win also grant a box, which would let two independent bonus-
  // loot systems stack on the same action. A distinct rate (8%, not 10%) so the two
  // don't read as the same mechanic wearing two names.
  function maybeGrantMysteryBox() {
    if (Math.random() >= QUEST_COMPLETION_BOX_CHANCE) return;
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes + 1 }));
    pushLog(["[System]: A Mystery Box turned up along the way."]);
  }

  function engageEncounter() {
    if (!activeEncounter || activeEncounter.result) return;
    const result = resolveEncounter(activeEncounter.encounter, domainStats);
    if (result.itemReward) {
      setInventory((prev) => ({
        ...prev,
        [result.itemReward.field]: prev[result.itemReward.field] + 1,
      }));
    } else if (result.goldChange !== 0) {
      setInventory((prev) => ({ ...prev, gold: Math.max(0, prev.gold + result.goldChange) }));
      if (result.goldChange > 0) {
        setGoldEarnedTotal((prev) => prev + result.goldChange);
      }
    }
    // Encounter losses are a forced cost, not an intentional purchase — deliberately
    // NOT counted toward goldSpentTotal, which the Big Spender emblem tracks and which
    // Shop purchases are documented as the "only source" of.
    addFatigue(result.fatigueChange);
    pushLog([
      `[System]: ${activeEncounter.encounter.label} — ${result.text}`,
      result.itemReward
        ? `[System]: Received ${result.itemReward.label}. +${result.fatigueChange} Fatigue.`
        : `[System]: ${result.goldChange >= 0 ? "+" : ""}${result.goldChange} Gold, +${result.fatigueChange} Fatigue.`,
    ]);
    setActiveEncounter((prev) => ({ ...prev, result }));
  }

  function declineEncounter() {
    setActiveEncounter(null); // no effect at all — no gold, no fatigue
  }

  // Gate check — all 4 must pass: level, the specific domain's stat, current streak,
  // and having enough keys banked. Fatigue is the hard wall (>80 blocks regardless of
  // the other 3), matching the locked design distinguishing Dungeon from Encounters.
  function canAttemptDungeon(domainKey, tier) {
    return (
      level >= tier.levelReq &&
      (domainStats[domainKey] || 0) >= tier.statReq &&
      currentStreak >= tier.streakReq &&
      inventory.dungeonKeys >= tier.keysReq &&
      currentFatigue <= 80
    );
  }

  function dungeonRandomInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  // 2-3 choices, each independently assigned a random domain — repeats across choices
  // in the same room are allowed, no guaranteed "home domain" option, per spec. Also
  // picks a fresh scene-setting prompt each time, paired with the choices so they're
  // generated atomically together (never a mismatch between old prompt/new choices).
  function generateDungeonRoom() {
    const count = dungeonRandomInt(2, 3);
    const choices = Array.from({ length: count }, () => {
      const d = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
      return { domainKey: d.key };
    });
    const prompt = DUNGEON_ROOM_PROMPTS[Math.floor(Math.random() * DUNGEON_ROOM_PROMPTS.length)];
    return { prompt, choices };
  }

  // Entry point — replaces the old openDungeonPrompt+confirmDungeonAttempt combo.
  // debugForced skips the gate check and key cost entirely (see the Debug tab trigger)
  // but still runs the REAL room/resolve/final-room/reward logic, same principle as
  // the old debug-force path had for the simpler single-roll version.
  function startDungeonRun(domainKey, tierKey, debugForced) {
    const tier = DUNGEON_TIERS.find((t) => t.key === tierKey);
    if (!tier) return;
    if (!debugForced) {
      if (!canAttemptDungeon(domainKey, tier)) return;
      setInventory((prev) => ({ ...prev, dungeonKeys: prev.dungeonKeys - tier.keysReq }));
    }
    const [roomMin, roomMax] = DUNGEON_ROOM_COUNT_RANGE[tierKey];
    const totalRooms = dungeonRandomInt(roomMin, roomMax);
    const resolveMax = Object.values(domainStats).reduce((sum, v) => sum + (v || 0), 0) + level * 2;
    const firstRoom = generateDungeonRoom();
    setActiveDungeonRun({
      domainKey,
      tier,
      debugForced: !!debugForced,
      totalRooms,
      roomIndex: 0,
      resolveMax,
      resolve: resolveMax,
      prompt: firstRoom.prompt,
      choices: firstRoom.choices,
      pickedDomainKey: null,
      pickedCost: null,
      phase: "rooms",
    });
  }

  // Voluntary exit during Regular Rooms — mechanically identical to running out of
  // Resolve (same fatigue, same zero reward), but a deliberate player choice rather
  // than a forced one. Per design: "2 separate mechanics, same outcome."
  function retreatFromDungeon() {
    if (!activeDungeonRun || activeDungeonRun.phase !== "rooms") return;
    finishDungeonRun("fail");
  }

  // Cost is deliberately hidden until after the pick — the choice itself is the whole
  // mechanic, not a menu of visible numbers to optimize against.
  function pickDungeonRoomChoice(domainKey) {
    if (!activeDungeonRun || activeDungeonRun.phase !== "rooms" || activeDungeonRun.pickedCost !== null) return;
    const stat = domainStats[domainKey] || 0;
    const raw = Math.max(DUNGEON_ROOM_COST_FLOOR, DUNGEON_ROOM_COST_BASE - stat * DUNGEON_ROOM_COST_REDUCTION);
    const cost = Math.round(raw * DUNGEON_ROOM_TIER_MULT[activeDungeonRun.tier.key]);
    setActiveDungeonRun((prev) => ({
      ...prev,
      resolve: Math.max(0, prev.resolve - cost),
      pickedDomainKey: domainKey,
      pickedCost: cost,
    }));
  }

  // Advances past the "here's what that cost you" feedback — either into the next
  // room, into the Final Room (all rooms cleared), or straight to a fail result
  // (Resolve hit 0 before the Final Room was ever reached).
  function continueAfterDungeonRoom() {
    if (!activeDungeonRun || activeDungeonRun.pickedCost === null) return;
    if (activeDungeonRun.resolve <= 0) {
      finishDungeonRun("fail");
      return;
    }
    const nextIndex = activeDungeonRun.roomIndex + 1;
    if (nextIndex >= activeDungeonRun.totalRooms) {
      // All Regular Rooms cleared — the Final Room's opponent hearts = this run's
      // actual room count, so a harder tier's finale is a longer fight, not just
      // scarier flavor text.
      startDungeonFinalRoomRound({
        ...activeDungeonRun,
        phase: "finalRoom",
        playerHearts: DUNGEON_PLAYER_HEARTS,
        opponentHearts: activeDungeonRun.totalRooms,
      });
      return;
    }
    const nextRoom = generateDungeonRoom();
    setActiveDungeonRun((prev) => ({
      ...prev,
      roomIndex: nextIndex,
      prompt: nextRoom.prompt,
      choices: nextRoom.choices,
      pickedDomainKey: null,
      pickedCost: null,
    }));
  }

  const DUNGEON_BEATS = { heavy: "fast", fast: "counter", counter: "heavy" };

  // Sets up one round: pre-generates the opponent's move (needed so a tell can reveal
  // it before the player picks) and rolls whether this round's tell actually triggers.
  function startDungeonFinalRoomRound(baseState) {
    const moves = ["heavy", "fast", "counter"];
    const opponentMove = moves[Math.floor(Math.random() * moves.length)];
    const stat = domainStats[baseState.domainKey] || 0;
    const baseTell = Math.min(30, stat * 0.3) + Math.min(20, Math.max(0, stat - 100) * 0.1);
    const tellChance = Math.min(50, baseTell * DUNGEON_TELL_TIER_MULT[baseState.tier.key]);
    const tellTriggered = Math.random() * 100 < tellChance;
    setActiveDungeonRun({
      ...baseState,
      opponentMove,
      tellRevealed: tellTriggered ? opponentMove : null,
      lastRoundOutcome: null,
    });
  }

  function pickDungeonFinalRoomMove(playerMove) {
    if (!activeDungeonRun || activeDungeonRun.phase !== "finalRoom" || activeDungeonRun.lastRoundOutcome) return;
    const { opponentMove } = activeDungeonRun;
    const outcome =
      playerMove === opponentMove ? "tie" : DUNGEON_BEATS[playerMove] === opponentMove ? "win" : "lose";
    const newPlayerHearts = outcome === "lose" ? activeDungeonRun.playerHearts - 1 : activeDungeonRun.playerHearts;
    const newOpponentHearts = outcome === "win" ? activeDungeonRun.opponentHearts - 1 : activeDungeonRun.opponentHearts;
    setActiveDungeonRun((prev) => ({ ...prev, playerHearts: newPlayerHearts, opponentHearts: newOpponentHearts, lastRoundOutcome: outcome, playerMove }));
  }

  // Called after a brief pause on the round result (tie/win/lose) — either starts the
  // next round, or ends the run if either side just ran out of hearts.
  function continueAfterDungeonRound() {
    if (!activeDungeonRun || !activeDungeonRun.lastRoundOutcome) return;
    if (activeDungeonRun.opponentHearts <= 0) {
      finishDungeonRun("complete");
      return;
    }
    if (activeDungeonRun.playerHearts <= 0) {
      finishDungeonRun("partial");
      return;
    }
    startDungeonFinalRoomRound(activeDungeonRun);
  }

  // Computes and applies every reward for the run in one place, regardless of which
  // path led here (Resolve hitting 0, a voluntary Retreat, or a Final Room outcome).
  function finishDungeonRun(result) {
    setActiveDungeonRun((prev) => {
      const { domainKey, tier, debugForced } = prev;
      const domain = DOMAINS.find((d) => d.key === domainKey);
      let xp = 0, gold = 0, stat = 0;

      if (result === "complete" || result === "partial") {
        const [pMin, pMax] = DUNGEON_XP_PERCENT_RANGE[tier.key];
        const percent = pMin + Math.random() * (pMax - pMin);
        const xpToNext = level * 100;
        const [gMin, gMax] = DUNGEON_GOLD_RANGE[tier.key];
        const fullXp = Math.floor(xpToNext * (percent / 100));
        const fullGold = Math.floor(gMin + Math.random() * (gMax - gMin));
        const fullStat = DUNGEON_STAT_REWARD[tier.key];
        if (result === "complete") {
          xp = fullXp; gold = fullGold; stat = fullStat;
        } else {
          // Partial: a genuinely separate second step on the SAME rolled values, not
          // a different formula — half of whatever Complete would have given, floored.
          xp = Math.floor(fullXp * 0.5);
          gold = Math.floor(fullGold * 0.5);
          stat = Math.floor(fullStat * 0.5); // Novice's +1 floors to 0 here, by design
        }
        if (xp > 0) grantXp(xp);
        if (gold > 0) {
          setInventory((inv) => ({ ...inv, gold: inv.gold + gold }));
          setGoldEarnedTotal((g) => g + gold);
        }
        if (stat > 0) setDomainStats((ds) => ({ ...ds, [domainKey]: (ds[domainKey] || 0) + stat }));
      }

      const fatigueGain =
        result === "fail" ? DUNGEON_FATIGUE.retreatOrFail : DUNGEON_FATIGUE.reachedFinalRoom;
      addFatigue(fatigueGain);

      const label = result === "complete" ? "cleared" : result === "partial" ? "partially cleared" : "not cleared";
      pushLog([
        `[System]: Dungeon ${label} — ${domain.label} (${tier.label}).${debugForced ? " [debug]" : ""}`,
        result === "fail"
          ? `[System]: No reward. +${fatigueGain} Fatigue.`
          : `[System]: +${xp} XP, +${gold} Gold, +${stat} ${domain.label} stat, +${fatigueGain} Fatigue.`,
      ]);

      return { ...prev, phase: "result", result, rewardXp: xp, rewardGold: gold, rewardStat: stat };
    });
  }

  function closeDungeonRun() {
    setActiveDungeonRun(null);
  }

  function setAvatarField(field, value) {
    setAvatar((prev) => ({ ...prev, [field]: value }));
    if (field === "hairstyle" && hairstyleEditUnlocked) {
      setHairstyleEditUnlocked(false);
      pushLog([`[System]: Hairstyle updated — ${value}.`]);
    }
  }

  function confirmAvatar() {
    setAvatarLocked(true);
    pushLog(["[System]: Avatar locked in.", "[System]: Use a Hairstyle Change to alter it later."]);
  }

  // Renders the hair silhouette on top of the base head shape. Kept as simple stacked
  // ellipses/rects rather than precise anatomical paths — this is a stylized placeholder,
  // not final art, since there's no way to visually preview SVG alignment from code alone.
  // Splits the body silhouette into upper (chest/shoulders) and lower (waist down) regions
  // so Shop's Upper/Lower slots can recolor them independently. Per-gender coordinates are
  // hand-picked to roughly match the original single-piece torso shape, split at the waist.
  function getAvatarBodyPaths(gender) {
    if (gender === "Female") {
      return {
        upper: "M 72 165 L 128 165 L 125 195 L 75 195 Z",
        lower: "M 75 195 L 125 195 L 122 225 L 78 225 Z",
      };
    }
    if (gender === "Non-binary") {
      return {
        upper: "M 67 165 L 133 165 L 129 195 L 71 195 Z",
        lower: "M 71 195 L 129 195 L 125 225 L 75 225 Z",
      };
    }
    return {
      upper: "M 62 165 L 138 165 L 133 195 L 67 195 Z",
      lower: "M 67 195 L 133 195 L 128 225 L 72 225 Z",
    };
  }

  function renderAvatarHair(hairstyle, hairColor) {
    if (hairstyle === "Bald") return null;
    const cap =
      hairstyle === "Buzzcut" ? (
        <ellipse cx="100" cy="72" rx="42" ry="16" fill={hairColor} />
      ) : (
        <ellipse cx="100" cy="70" rx="42" ry="24" fill={hairColor} />
      );
    if (hairstyle === "Buzzcut") return cap;
    if (hairstyle === "Short") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="20" rx="4" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Medium") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="40" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="40" rx="4" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Long") {
      return (
        <>
          {cap}
          <rect x="56" y="70" width="12" height="90" rx="5" fill={hairColor} />
          <rect x="132" y="70" width="12" height="90" rx="5" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Ponytail") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <path d="M 136 75 Q 170 100 150 170 Q 165 110 130 80 Z" fill={hairColor} />
        </>
      );
    }
    return cap;
  }

  // Shared avatar SVG — used both by the one-time creation screen and the ongoing
  // Character-tab display, so the two never drift out of sync with each other.
  function renderAvatarSVG(className) {
    // Per-base position correction — see BODY_HEAD_OFFSETS above for why this exists.
    const genderKey = avatar.gender?.toLowerCase();
    const offset =
      (BODY_HEAD_OFFSETS[genderKey] && BODY_HEAD_OFFSETS[genderKey][avatar.skinTone]) ||
      { dx: 0, dy: 0 };

    // Head-mapping transform for hair/headgear — still authored in the OLD 200x240
    // coordinate space (old head: center 100,95, r=38), mapped onto the REAL head's
    // measured position (61,78 for the reference base, offset per-base above) so hair
    // doesn't break/mis-render during the transition. Reasonable estimate, not
    // composite-verified the way body+eyes were.
    const headTransform = `translate(${61 + offset.dx},${78 + offset.dy}) scale(0.947) translate(-100,-95)`;

    return (
      <svg viewBox={`0 0 ${BODY_WIDTH} ${BODY_HEIGHT}`} className={className}>
        {/* Aura/accessory positions below are proportional estimates in the new
            coordinate space, not verified via composite-testing like body+eyes — flag
            for a follow-up look once they're actually visible in a real render. */}
        {auraTier > 0 && (
          <circle
            cx="61"
            cy="160"
            r="100"
            fill="none"
            stroke={AURA_TIERS[auraTier - 1].color}
            strokeWidth={2 + auraTier}
            opacity="0.5"
          />
        )}
        {/* Real body art — falls back to male/light if gender is Non-binary (no art
            exists yet for that option) or skinTone is ever unexpected. Lowercased
            because GENDERS stores display values ("Male"/"Female") but BODY_BASES
            keys are lowercase — this mismatch was the actual bug behind gender/skin
            tone selection appearing to do nothing. */}
        <image
          href={
            (BODY_BASES[avatar.gender?.toLowerCase()] &&
              BODY_BASES[avatar.gender.toLowerCase()][avatar.skinTone]) ||
            BODY_BASES.male.light
          }
          x="0"
          y="0"
          width={BODY_WIDTH}
          height={BODY_HEIGHT}
        />
        {/* Real eye art — VERIFIED against actual body art via composite testing.
            Shifted left and tightened further per feedback, checked against a
            reference image before committing these numbers. */}
        <image
          href={EYE_STYLE_IMAGES[avatar.eyeStyle] || EYE_STYLE_IMAGES.calm}
          x={56.5 + offset.dx}
          y={80 + offset.dy}
          width="30"
          height="18.53"
          preserveAspectRatio="xMidYMid meet"
        />
        <g transform="scale(-1,1)">
          <image
            href={EYE_STYLE_IMAGES[avatar.eyeStyle] || EYE_STYLE_IMAGES.calm}
            x={-59.5 - offset.dx}
            y={80 + offset.dy}
            width="30"
            height="18.53"
            preserveAspectRatio="xMidYMid meet"
          />
        </g>
        {shopEquipped.head ? (
          <g transform={headTransform}>
            <ellipse
              cx="100"
              cy="70"
              rx="46"
              ry="28"
              fill={HEAD_CATALOG.find((i) => i.id === shopEquipped.head)?.color}
            />
          </g>
        ) : (
          <g transform={headTransform}>{renderAvatarHair(avatar.hairstyle, avatar.hairColor)}</g>
        )}
        {accessoryTier > 0 && (
          <circle cx="85" cy="207" r={3 + accessoryTier * 2} fill={ACCESSORY_TIERS[accessoryTier - 1].color} />
        )}
      </svg>
    );
  }

  function triggerPenalty() {
    endCycle({ awardPoints: false }); // cycle ends in failure — HV/neglect still update, no points awarded

    const nextMissCount = missCount + 1;
    const tier = nextMissCount >= ESCALATION_THRESHOLD ? 2 : 1;
    const challenge = PENALTY_POOL[Math.floor(Math.random() * PENALTY_POOL.length)];
    const duration = Math.round(
      challenge.baseSeconds * (tier === 2 ? ESCALATION_MULTIPLIER : 1)
    );

    setMissCount(nextMissCount);
    setActiveChallenge(challenge);
    setChallengeTier(tier);
    setPenaltyDeadline(Date.now() + duration * 1000);
    setPenaltyActive(true);
    setCurrentStreak(0); // any miss breaks the streak Dungeon's streak-gate checks

    pushLog([
      "[System]: Daily Quest failed.",
      `[System]: App locked. Penalty assigned: ${challenge.label}.`,
      tier === 2
        ? `[System]: Escalation Tier 2 — ${nextMissCount} consecutive misses.`
        : "[System]: Complete the challenge to restore access.",
    ]);
  }

  function clearPenalty() {
    if (!canClearPenalty) return;
    pushLog([
      "[System]: Challenge verified complete.",
      "[System]: App access restored.",
      "[System]: Daily Quest reset.",
    ]);
    setPenaltyActive(false);
    setActiveChallenge(null);
    setPenaltyDeadline(null);
  }

  function toggleTask(task) {
    if (questComplete || penaltyActive) return;
    setChecked((prev) => ({ ...prev, [task.id]: !prev[task.id] }));
  }

  useEffect(() => {
    const allDone = DAILY_TASKS.every((t) => checked[t.id]);
    if (allDone && !questComplete) {
      completeQuest();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [checked]);

  function completeQuest() {
    setQuestComplete(true);
    const gainedXp = 40;

    pushLog(["[System]: Daily Quest complete.", `[System]: +${gainedXp} XP.`, "[System]: +1 Mystery Box."]);
    grantXp(gainedXp);
    setMissCount(0);
    setCurrentStreak((prev) => prev + 1); // consecutive full passes — Dungeon's streak-gate reads this
    endCycle({ awardPoints: true }); // full pass — HV grows for all 6, +1 manual stat point banked
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes + 1 }));
  }

  const combinedLog = logHistory;
  const questProgress = DAILY_TASKS.filter((t) => checked[t.id]).length;

  // Derived, never independently stored — always exactly correct relative to real time,
  // since they're computed fresh from timestamps rather than decremented by a timer.
  const dailyTimeLeft =
    dailyQuestDeadline !== null ? Math.max(0, Math.round((dailyQuestDeadline - nowTick) / 1000)) : 0;
  const penaltyTimeLeftDerived =
    penaltyDeadline !== null ? Math.max(0, Math.round((penaltyDeadline - nowTick) / 1000)) : 0;
  const canClearPenalty = penaltyDeadline !== null && nowTick >= penaltyDeadline;
  // Passive -5/hour decay, derived fresh each render rather than ticked down — same
  // "correct even after being closed" property as the timers above. Clamped to
  // [0,100]; the upper clamp matters once Encounters/Dungeon start adding to it.
  const currentFatigue = Math.max(
    0,
    Math.min(100, fatigue - ((nowTick - fatigueUpdatedAt) / (1000 * 60 * 60)) * 5)
  );

  if (!loaded) {
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg flex items-center justify-center"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>
        <div className="mono text-xs" style={{ color: "#8B94A3" }}>
          [System]: Loading save data...
        </div>
      </div>
    );
  }

  // One-time character creation — blocks the entire app until confirmed, then never shows
  // again (short of a debug reset). Genuinely separate from the ongoing Character tab
  // display, not just a greyed-out version of the same panel.
  if (!avatarLocked) {
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>
        <div className="mono text-xs tracking-widest mb-1" style={{ color: "#3DDBD9" }}>
          CHARACTER CREATION
        </div>
        <div className="mono text-[10px] mb-4" style={{ color: "#5A6272" }}>
          One-time setup. Hairstyle can be changed later with an item; everything else is
          permanent.
        </div>

        <div className="flex justify-center mb-4">{renderAvatarSVG("w-40 h-48")}</div>

        <div className="space-y-4">
          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              GENDER
            </div>
            <div className="flex gap-2 flex-wrap">
              {GENDERS.map((g) => (
                <button
                  key={g}
                  onClick={() => setAvatarField("gender", g)}
                  className="mono text-[10px] px-3 py-1.5 rounded border transition"
                  style={{
                    borderColor: avatar.gender === g ? "#3DDBD9" : "#2A3140",
                    color: avatar.gender === g ? "#3DDBD9" : "#8B94A3",
                  }}
                >
                  {g}
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              HAIRSTYLE
            </div>
            <div className="flex gap-2 flex-wrap">
              {HAIRSTYLES.map((h) => (
                <button
                  key={h}
                  onClick={() => setAvatarField("hairstyle", h)}
                  className="mono text-[10px] px-3 py-1.5 rounded border transition"
                  style={{
                    borderColor: avatar.hairstyle === h ? "#3DDBD9" : "#2A3140",
                    color: avatar.hairstyle === h ? "#3DDBD9" : "#8B94A3",
                  }}
                >
                  {h}
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              SKIN TONE
            </div>
            <div className="flex gap-2 flex-wrap">
              {SKIN_TONES.map((s) => (
                <button
                  key={s.key}
                  onClick={() => setAvatarField("skinTone", s.key)}
                  className="mono text-[10px] px-3 py-1.5 rounded border transition"
                  style={{
                    borderColor: avatar.skinTone === s.key ? "#3DDBD9" : "#2A3140",
                    color: avatar.skinTone === s.key ? "#3DDBD9" : "#8B94A3",
                  }}
                >
                  {s.label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              EYE COLOR
            </div>
            <div className="flex gap-2 flex-wrap">
              {EYE_COLORS.map((c) => (
                <button
                  key={c}
                  onClick={() => setAvatarField("eyeColor", c)}
                  className="w-8 h-8 rounded-full border-2 transition"
                  style={{
                    backgroundColor: c,
                    borderColor: avatar.eyeColor === c ? "#3DDBD9" : "transparent",
                  }}
                />
              ))}
            </div>
          </div>

          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              EYE STYLE
            </div>
            <div className="flex gap-2 flex-wrap">
              {EYE_STYLES.map((s) => (
                <button
                  key={s.key}
                  onClick={() => setAvatarField("eyeStyle", s.key)}
                  className="rounded border-2 transition p-1 flex flex-col items-center gap-1"
                  style={{
                    borderColor: avatar.eyeStyle === s.key ? "#3DDBD9" : "#2A3140",
                    backgroundColor: "#0B0D12",
                  }}
                >
                  <img
                    src={EYE_STYLE_IMAGES[s.key]}
                    alt={s.label}
                    style={{ width: 48, height: 29.6, objectFit: "contain" }}
                  />
                  <span
                    className="mono text-[9px]"
                    style={{ color: avatar.eyeStyle === s.key ? "#3DDBD9" : "#8B94A3" }}
                  >
                    {s.label}
                  </span>
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="mono text-[10px] mb-1.5" style={{ color: "#8B94A3" }}>
              HAIR COLOR
            </div>
            <div className="flex gap-2 flex-wrap">
              {HAIR_COLORS.map((c) => (
                <button
                  key={c}
                  onClick={() => setAvatarField("hairColor", c)}
                  className="w-8 h-8 rounded-full border-2 transition"
                  style={{
                    backgroundColor: c,
                    borderColor: avatar.hairColor === c ? "#3DDBD9" : "transparent",
                  }}
                />
              ))}
            </div>
          </div>

          <button
            onClick={confirmAvatar}
            className="mono text-xs px-5 py-2.5 rounded transition"
            style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
          >
            CONFIRM AVATAR
          </button>
        </div>
      </div>
    );
  }

  // Full app lockout — this replaces the entire interface, no nav, no bypass,
  // until the assigned challenge's minimum duration has elapsed and it's marked complete.
  if (penaltyActive) {
    const domainMeta = activeChallenge && DOMAINS.find((d) => d.key === activeChallenge.domain);
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg flex flex-col items-center justify-center text-center relative"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>

        <button
          onClick={() => setShowDebug((s) => !s)}
          className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4"
          style={{ border: "1px solid #1E2430", color: "#5A6272" }}
        >
          DEBUG
        </button>
        {showDebug && (
          <div
            className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
            style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
          >
            {!resetArmed ? (
              <button
                onClick={() => setResetArmed(true)}
                className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                style={{ border: "1px solid #E5484D", color: "#E5484D" }}
              >
                RESET ALL PROGRESS
              </button>
            ) : (
              <div className="flex flex-col gap-1.5">
                <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                  Wipes save + all state. Confirm?
                </span>
                <div className="flex gap-1.5">
                  <button
                    onClick={debugReset}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #E5484D", backgroundColor: "#E5484D", color: "#0B0D12" }}
                  >
                    YES
                  </button>
                  <button
                    onClick={() => setResetArmed(false)}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                  >
                    CANCEL
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        <ShieldAlert size={36} color="#E5484D" />
        <div className="mono text-[#E5484D] text-sm tracking-widest mt-4">
          APP LOCKED{challengeTier === 2 ? " — ESCALATION TIER 2" : ""}
        </div>
        <div className="mono text-[10px] text-[#8B94A3] mt-1">
          {missCount} consecutive miss{missCount !== 1 ? "es" : ""}
        </div>

        <div className="mt-6 border border-[#2A1518] bg-[#160D0F] rounded-md px-6 py-5 max-w-sm w-full">
          <div className="flex items-center justify-center gap-2 mb-2">
            <Lock size={14} color={domainMeta?.color || "#E5484D"} />
            <span
              className="mono text-[10px] tracking-widest"
              style={{ color: domainMeta?.color || "#E5484D" }}
            >
              {domainMeta?.label}
            </span>
          </div>
          <div className="text-[#EDEFF3] text-sm">{activeChallenge?.label}</div>
        </div>

        <div className="mt-6 mono text-xs text-[#8B94A3]">
          {canClearPenalty
            ? "Minimum duration met."
            : `Locked for ${formatCountdown(penaltyTimeLeftDerived)} minimum`}
        </div>
        {!canClearPenalty && (
          <div className="w-full max-w-xs h-1.5 bg-[#1E2430] rounded-full overflow-hidden mt-3">
            <div
              className="h-full bg-[#E5484D] transition-all duration-1000"
              style={{
                width: `${
                  activeChallenge
                    ? ((Math.round(
                        activeChallenge.baseSeconds *
                          (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                      ) -
                        penaltyTimeLeftDerived) /
                        Math.round(
                          activeChallenge.baseSeconds *
                            (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                        )) *
                      100
                    : 0
                }%`,
              }}
            />
          </div>
        )}

        <button
          onClick={clearPenalty}
          disabled={!canClearPenalty}
          className="mono text-xs mt-6 px-5 py-2.5 rounded border border-[#2A3140] bg-[#12151C] text-[#D6DCE5] disabled:opacity-40 disabled:cursor-not-allowed hover:border-[#3DDBD9] transition"
        >
          MARK CHALLENGE COMPLETE
        </button>

        {inventory.teleportStones > 0 && (
          <button
            onClick={useTeleportStone}
            className="mono text-xs mt-3 px-5 py-2.5 rounded border border-[#3DDBD9] bg-[#0F1218] text-[#3DDBD9] hover:bg-[#12151C] transition"
          >
            USE TELEPORTATION STONE ({inventory.teleportStones}) — SKIP PENALTY
          </button>
        )}

        <div className="mono text-[9px] text-[#5A6272] mt-3 max-w-xs">
          Prototype note: self-reported. Real build needs an honest completion
          signal — a linked workout log, timer app, or similar — or this button
          defeats the whole mechanic.
        </div>
      </div>
    );
  }

  return (
    <div
      className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg"
      style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
    >
      <style>{`
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      `}</style>

      {/* Level Up popup — overlays the current view, dismissible, doesn't lock anything */}
      {levelUpNotification && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-xs w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <Zap size={28} color="#3DDBD9" className="mx-auto mb-2" />
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              LEVEL UP
            </div>
            <div className="mono text-lg mb-4" style={{ color: "#EDEFF3" }}>
              Level: {levelUpNotification.fromLevel} → {levelUpNotification.toLevel}
            </div>
            <div className="space-y-1 mb-5">
              {DOMAINS.filter((d) => levelUpNotification.gains[d.key]).map((d) => (
                <div key={d.key} className="flex items-center justify-between mono text-xs">
                  <span style={{ color: d.color }}>{d.label}</span>
                  <span style={{ color: "#D6DCE5" }}>
                    {levelUpNotification.gains[d.key].before} → {levelUpNotification.gains[d.key].after}
                  </span>
                </div>
              ))}
              {Object.keys(levelUpNotification.gains).length === 0 && (
                <div className="mono text-xs" style={{ color: "#5A6272" }}>
                  No eligible domain for stat gain.
                </div>
              )}
            </div>
            <button
              onClick={() => setLevelUpNotification(null)}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Main Quest SMART setup — a focused, single-purpose popup rather than an inline
          form, so setting a Main Quest feels like a deliberate commitment, not a text
          field you can absent-mindedly fill in. Specific + Measurable are required;
          Relevant and Target Date are encouraged but optional (informational only —
          the system doesn't enforce the date, only the 48h post-set completion lock). */}
      {mainQuestSetupDomain && (() => {
        const domain = DOMAINS.find((d) => d.key === mainQuestSetupDomain);
        return (
          <MainQuestSetupModal
            domain={domain}
            onCancel={() => setMainQuestSetupDomain(null)}
            onSubmit={(fields) => submitMainQuestSetup(mainQuestSetupDomain, fields)}
          />
        );
      })()}

      {/* Encounter popup — engage/decline, single-roll resolution shown immediately on
          engage. No countdown/window to expire against (unlike Urgent Quest), so
          Decline (or just not engaging) simply clears it with zero effect. */}
      {activeEncounter && (() => {
        const { encounter, result } = activeEncounter;
        const domain = DOMAINS.find((d) => d.key === encounter.domain);
        const tierColor =
          result?.tier === "win" ? "#3DDBD9" : result?.tier === "closeCall" ? "#F2A93B" : "#E5484D";
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-50 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full text-center"
              style={{ border: `1px solid ${domain.color}`, backgroundColor: "#12151C" }}
            >
              <div className="mono text-xs tracking-widest mb-1" style={{ color: domain.color }}>
                ENCOUNTER — {encounter.label.toUpperCase()}
              </div>
              <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                {encounter.flavor}
              </div>

              {!result ? (
                <div className="flex gap-2">
                  <button
                    onClick={declineEncounter}
                    className="flex-1 mono text-xs px-4 py-2 rounded border transition"
                    style={{ borderColor: "#2A3140", color: "#8B94A3" }}
                  >
                    DECLINE
                  </button>
                  <button
                    onClick={engageEncounter}
                    className="flex-1 mono text-xs px-4 py-2 rounded border transition"
                    style={{ borderColor: domain.color, color: domain.color }}
                  >
                    ENGAGE
                  </button>
                </div>
              ) : (
                <>
                  <div className="mono text-xs mb-3" style={{ color: tierColor }}>
                    {result.tier === "win" ? "WIN" : result.tier === "closeCall" ? "CLOSE CALL" : "LOSS"}
                  </div>
                  <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                    {result.text}
                  </div>
                  <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                    {result.itemReward
                      ? `Received: ${result.itemReward.label}`
                      : `${result.goldChange >= 0 ? "+" : ""}${result.goldChange} Gold`}
                    {" "}· +{result.fatigueChange} Fatigue
                  </div>
                  <button
                    onClick={() => setActiveEncounter(null)}
                    className="mono text-xs px-5 py-2 rounded transition"
                    style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                  >
                    CONTINUE
                  </button>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Dungeon — full multi-phase run in one popup: Regular Rooms (hidden-cost
          domain choices) -> Final Room (hearts-based triangle) -> Result. See
          dungeon-spec.md for the complete design this implements. */}
      {activeDungeonRun && (() => {
        const run = activeDungeonRun;
        const domain = DOMAINS.find((d) => d.key === run.domainKey);
        const domainActionLabel = {
          financial: "Weigh the cost carefully",
          physical: "Push through with force",
          mental: "Think it through",
          relational: "Call out for support",
          social: "Read the room and adapt",
          faith: "Trust your resolve",
        };
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-50 p-4"

                  <div

                          : run.result === "partial"
                          ? "#F2A93B"

                    {run.result === "complete"

                    CLOSE
                  </button>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Urgent Quest semi-lock — a modal overlay, not a full app-replace like the Penalty

      {focusedUrgentQuest && (() => {

                      <div className="flex gap-1.5">

                            backgroundColor: "#E5484D",

      <div style={{ paddingBottom: "calc(76px + env(safe-area-inset-bottom))" }}>

                  style={{
                    borderColor: avatar.hairstyle === h ? "#3DDBD9" : "#2A3140",

                    : `Bronze at ${a.thresholds[0]} ${a.metricLabel}`}
                </div>

        </div>

        </>

              <Sparkles size={14} color="#8B94A3" />
              <span className="mono text-[10px] text-[#8B94A3]">Skills — locked</span>
            </div>
          </div>
        </div>
      </div>

      {/* Urgent Quests — surfaced from per-domain neglect, not from a schedule */}
      {activeUrgentQuests.length > 0 && (
        <div className="border border-[#2A2010] bg-[#161206] rounded-md p-4 mt-4">
          <div className="mono text-xs tracking-widest text-[#F2A93B] mb-3">

          <div className="space-y-2">

                <div

                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1">
                      <span
                        className="mono text-[9px] tracking-widest px-1.5 py-0.5 rounded"
                        style={{ color: severityColor, border: `1px solid ${severityColor}` }}
                      >

                      </span>
                      <span
                        className="mono text-[10px] tracking-wide"

                    <div className="text-sm text-[#D6DCE5]">{q.label}</div>

                <div>
                  Fired: {simResults.firedCount}/{simResults.iterations} (
                  {((simResults.firedCount / simResults.iterations) * 100).toFixed(1)}% — target ~
                  {(URGENT_TRIGGER_CHANCE * 100).toFixed(0)}%)
                </div>
                {simResults.eligible.length > 0 && simResults.firedCount > 0 && (
                  <div className="pt-1 space-y-0.5">
                    {simResults.eligible.map((e) => {
                      const count = simResults.pickCounts[e.domain.key] || 0;
                      const totalWeight = simResults.eligible.reduce(
                        (sum, x) => sum + SEVERITY_WEIGHT[x.severity],
                        0
                      );
                      const expectedPct = ((SEVERITY_WEIGHT[e.severity] / totalWeight) * 100).toFixed(1);
                      const actualPct = ((count / simResults.firedCount) * 100).toFixed(1);
                      return (
                        <div key={e.domain.key} className="flex justify-between">
                          <span style={{ color: e.domain.color }}>
                            {e.domain.label} ({e.severity})
                          </span>
                          <span className="text-[#5A6272]">
                            {count} picks — {actualPct}% actual / {expectedPct}% expected
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<SystemEngine />);
} catch (err) {
  const diag = document.getElementById("diag");
  diag.style.display = "block";
  diag.textContent += "[render error] " + (err && err.message ? err.message : err) + "\n" + (err && err.stack ? err.stack : "") + "\n\n";
}
</script>

<!-- The app source above sits inert (type="text/plain") so the browser never tries to run
     it directly. We pull the text out, transform it ourselves with the CLASSIC JSX runtime
     explicitly forced — Babel's default "automatic" runtime injects a real `import` line
     into its output, which breaks when the transformed code is later appended as a plain
     script. This was the actual root cause of every "Cannot use import statement outside a
     module" error hit while getting this deployed — confirmed and fixed via this exact
     pattern in a minimal test file first. -->
<script>
  try {
    const source = document.getElementById("app-source").textContent;
    const output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    const script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  } catch (err) {
    const diag = document.getElementById("diag");
    diag.style.display = "block";
    diag.textContent += "[transform error] " + (err && err.message ? err.message : err) + "\n";
  }
</script>
</body>
</html>
