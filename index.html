  html, body, #root { height: 100%; margin: 0; background: #0B0D12; }
  body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;

       bar at the bottom, which matters much more once running with no browser chrome. */
    padding-top: env(safe-area-inset-top);

       "webpage" behaviors — accidentally highlighting text while tapping around. */
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;

  /* ---- Mobile-app sizing pass ----
     Rather than rewriting sizing on every element individually across a ~3000-line file,
     this overrides the specific arbitrary-value and utility classes actually in use,
     app-wide, in one place. Terminal aesthetic (monospace font, System-log framing) stays;
     the cramped small-screen sizing that came from a desktop-first build does not. */

  /* Text sizes — was tuned for a dense desktop HUD; bumped for real phone readability. */
  .text-\[8px\]  { font-size: 12px !important; }
  .text-\[9px\]  { font-size: 13px !important; }
  .text-\[10px\] { font-size: 14px !important; }
  .text-\[11px\] { font-size: 15px !important; }
  .text-xs { font-size: 15px !important; line-height: 1.4 !important; }
  .text-sm { font-size: 17px !important; line-height: 1.4 !important; }
  .text-lg { font-size: 22px !important; }

  /* Softer corners read as "app" more than the sharp/small radii a dense HUD layout used. */
  .rounded    { border-radius: 12px !important; }
  .rounded-md { border-radius: 14px !important; }
  .rounded-lg { border-radius: 16px !important; }

  /* Real touch-target floor on every interactive control, regardless of its own padding. */
  button, select {
    min-height: 44px;
    touch-action: manipulation;
  }
  /* The very smallest padding values were sized for a mouse, not a thumb. */
  .py-0\.5 { padding-top: 6px !important; padding-bottom: 6px !important; }
  .py-1    { padding-top: 8px !important; padding-bottom: 8px !important; }
  .px-1    { padding-left: 8px !important; padding-right: 8px !important; }

<script>
  // Diagnostic error surface — if anything fails (Babel parse error, a runtime error in
  // the app, a failed CDN load), show it as visible text instead of a silent blank page.
  (function () {
    const diag = document.getElementById("diag");
    function showError(msg) {
      diag.style.display = "block";
      diag.textContent += msg + "\n\n";
    }
    window.addEventListener("error", function (e) {
      showError("[error] " + (e.message || e) + (e.filename ? "\n  at " + e.filename + ":" + e.lineno + ":" + e.colno : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showError("[unhandled promise rejection] " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // If nothing has rendered into #root after 6 seconds, say so explicitly rather than
    // leaving a blank screen with no clue anything went wrong.
    setTimeout(function () {
      const root = document.getElementById("root");
      if (root && root.children.length === 0 && diag.style.display === "none") {
        showError("[diagnostic] Nothing rendered into #root after 6s, and no JS error was caught either. Likely a CDN script (React/Babel/Tailwind) failed to load — check your connection or try reloading.");
      }
    }, 6000);
  })();
</script>

<script>
  // window.storage polyfill — the original app was built against Claude's artifact
  // persistence API, which doesn't exist in a normal browser. This mirrors the same
  // async, Promise-based shape using localStorage, so the app code needed zero changes.
  (function () {
    const PREFIX = "system-engine:";
    window.storage = {
      get: async (key) => {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw };
      },
      set: async (key, value) => {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      },
      delete: async (key) => {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith(PREFIX + (prefix || "")))
          .map((k) => k.slice(PREFIX.length));
        return { keys, prefix };
      },
    };
  })();
</script>

// Shared countdown formatter — hour-scale durations (Daily/Urgent Quest windows) show as
// "Xh Ym"; anything under an hour (Penalty challenge minimums) shows as MM:SS.
function formatCountdown(totalSeconds) {
  const clamped = Math.max(0, totalSeconds);
  if (clamped >= 3600) {
    const h = Math.floor(clamped / 3600);
    const m = Math.floor((clamped % 3600) / 60);
    return `${h}h ${m}m`;
  }
  const m = Math.floor(clamped / 60);
  const s = clamped % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

// Returns the timestamp (ms) of the next local midnight strictly after `fromMs`.
function getNextMidnight(fromMs) {
  const d = new Date(fromMs);
  d.setHours(24, 0, 0, 0); // JS correctly rolls this into tomorrow's midnight
  return d.getTime();
}

// Persistent typewriter: pulls one line at a time off an ever-growing queue, so multiple
// pushLog calls in the same tick queue up instead of clobbering each other.
function useTypedLog() {
  const [history, setHistory] = useState([]);
  const queueRef = useRef([]);
  const timerRef = useRef(null);

  const push = useCallback((lines) => {
    queueRef.current = [...queueRef.current, ...lines];
    if (!timerRef.current) tick();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function tick() {
    timerRef.current = setTimeout(() => {
      if (queueRef.current.length === 0) {
        timerRef.current = null;
        return;
      }
      const [next, ...rest] = queueRef.current;
      queueRef.current = rest;
      setHistory((h) => [...h, next]);
      tick();
    }, 550);
  }

  useEffect(() => () => timerRef.current && clearTimeout(timerRef.current), []);

  const clear = useCallback(() => {
    queueRef.current = [];
    if (timerRef.current) {
      clearTimeout(timerRef.current);
      timerRef.current = null;
    }
    setHistory([]);
  }, []);

  return { history, push, clear };
}

  // anything else level/stat-gated) can actually be tested without grinding real XP

  const { history: logHistory, push: pushLog, clear: clearLog } = useTypedLog();

  // Checks every ACHIEVEMENTS entry against current progress whenever a relevant counter
  // changes, and climbs the tier ladder as far as thresholds allow. unlockedEmblems stores
  // the highest tier INDEX reached per achievement (-1/absent = none yet). If a big jump in
  // one update crosses several tiers at once, each crossed tier gets its own log line.
  useEffect(() => {
    const statTotal = DOMAINS.reduce((sum, d) => sum + (domainStats[d.key] || 0), 0);
    const maxDomainQuestCount = Math.max(0, ...DOMAINS.map((d) => domainQuestCount[d.key] || 0));
    const maxDomainStat = Math.max(0, ...DOMAINS.map((d) => domainStats[d.key] || 0));

    const metricValue = (metric) => {
      switch (metric) {
        case "domainQuestCount":
          return maxDomainQuestCount;
        case "domainStat":
          return maxDomainStat;
        case "statTotal":
          return statTotal;
        case "level":
          return level;
        case "goldEarned":
          return goldEarnedTotal;
        case "goldSpent":
          return goldSpentTotal;
        case "highTierDrops":
          return highTierDropCount;
        default:
          return 0;
      }
    };

    ACHIEVEMENTS.forEach((a) => {
      const currentTier = unlockedEmblems[a.id] ?? -1;
      const value = metricValue(a.metric);
      let newTier = currentTier;
      a.thresholds.forEach((threshold, i) => {
        if (value >= threshold) newTier = i;
      });
      if (newTier > currentTier) {
        for (let i = currentTier + 1; i <= newTier; i++) {
          pushLog([`[System]: Emblem tier unlocked — ${a.label} [${TIERS[i].label}].`]);
        }
        setUnlockedEmblems((prev) => ({ ...prev, [a.id]: newTier }));
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [
    domainStats,
    domainQuestCount,
    level,
    goldEarnedTotal,
    goldSpentTotal,
    highTierDropCount,
  ]);


  // Shared XP grant + level-up handling, used by every quest type. Consumes an active
  // XP Booster if one is set — doubles this single grant, then the boost is spent.
  // Ranks domains by hidden value (HV) and distributes up to 3 stat points on level-up:
  // 3+ eligible domains (HV > 0) -> top 3 get 1 each. 2 eligible -> 2/1. 1 eligible -> all 3.
  // Tie-break is randomized each call so ties don't always favor the same domain order.
  function allocateStatPoints(hvMap) {
    const eligible = DOMAINS.filter((d) => (hvMap[d.key] || 0) > 0);
    const ranked = [...eligible]
      .sort(() => Math.random() - 0.5)
      .sort((a, b) => (hvMap[b.key] || 0) - (hvMap[a.key] || 0));

    const allocation = {};
    if (ranked.length >= 3) {
      ranked.slice(0, 3).forEach((d) => (allocation[d.key] = 1));
    } else if (ranked.length === 2) {
      allocation[ranked[0].key] = 2;
      allocation[ranked[1].key] = 1;
    } else if (ranked.length === 1) {
      allocation[ranked[0].key] = 3;
    }
    return allocation;
  }

  // Applies ranked stat allocation for every level gained in one jump (usually 1, but a big
  // XP Booster-doubled grant could cross more than one), accumulates the total gain per
  // domain across however many levels were crossed, applies it once, and queues the popup.
  // Applies ranked stat allocation for every level gained in one jump (usually 1, but a big
  // XP Booster-doubled grant could cross more than one). HV resets to zero after each level
  // processed — including mid-batch for a multi-level jump — so an early lead in HV can't
  // keep winning every future ranking forever; each level-up starts the ranking fresh.
  function processLevelUp(fromLevel, toLevel) {
    const beforeStats = { ...domainStats };
    const totalGain = {};
    let hvSnapshot = { ...domainHV };
    for (let i = 0; i < toLevel - fromLevel; i++) {
      const allocation = allocateStatPoints(hvSnapshot);
      Object.keys(allocation).forEach((key) => {
        totalGain[key] = (totalGain[key] || 0) + allocation[key];
      });
      hvSnapshot = Object.fromEntries(DOMAINS.map((d) => [d.key, 0]));
    }
    setDomainStats((prev) => {
      const next = { ...prev };
      Object.keys(totalGain).forEach((key) => {
        next[key] = (next[key] || 0) + totalGain[key];
      });
      return next;
    });
    setDomainHV(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));

    const gains = {};
    DOMAINS.forEach((d) => {
      if (totalGain[d.key]) {
        const before = beforeStats[d.key] || 0;
        gains[d.key] = { before, after: before + totalGain[d.key] };
      }
    });
    setLevelUpNotification({ fromLevel, toLevel, gains });
    const gainLines = DOMAINS.filter((d) => gains[d.key])
      .map((d) => `${d.label} ${gains[d.key].before} -> ${gains[d.key].after}`)
      .join(", ");
    pushLog([
      `[System]: Level ${fromLevel} -> ${toLevel}.`,
      gainLines ? `[System]: ${gainLines}` : "[System]: No eligible domain for stat gain.",
    ]);

    // Neglect checkpoint: a domain that received a stat point at any point since the last
    // level-up resets to 0; everything else advances by one checkpoint. Stagnation
    // (Main Quest imbalance) needs no checkpoint step — it's read live from current state.
    // Neglect checkpoint: a domain that received a stat point resets to 0; everything else
    // advances by one checkpoint. "Received a point" means EITHER a manual spend/Urgent
    // Quest resolve flagged before this level-up (domainReceivedPointSinceCycle) OR the
    // ranked HV allocation that just ran above in this same level-up (totalGain) — a domain
    // that just won the allocation clearly isn't neglected, even though nothing had flagged
    // it yet. Missing this second source was the bug: a domain could visibly grow every
    // level-up via the ranked split and still show climbing neglect, because only the other
    // two point sources were ever checked.
    const nextPointsMissed = { ...domainPointsMissedStreak };
    DOMAINS.forEach((d) => {
      const receivedPoint = domainReceivedPointSinceCycle[d.key] || !!totalGain[d.key];
      nextPointsMissed[d.key] = receivedPoint ? 0 : (nextPointsMissed[d.key] || 0) + 1;
    });
    setDomainPointsMissedStreak(nextPointsMissed);
    setDomainReceivedPointSinceCycle(Object.fromEntries(DOMAINS.map((d) => [d.key, false])));

    // Urgent Quest evaluation runs against the neglect numbers just computed above (not
    // possibly-stale committed state) and live Main Quest counts for stagnation. Function
    // declarations are hoisted, so this can reference evaluateUrgentTriggers even though
    // it's defined later in the file.
    evaluateUrgentTriggers(nextPointsMissed, domainMainQuestsSinceReset);
  }

  function grantXp(amount) {
    const doubled = xpBoostActive;
    const finalAmount = doubled ? amount * 2 : amount;
    if (doubled) {
      setXpBoostActive(false);
      pushLog([`[System]: XP Booster consumed — doubled to +${finalAmount}.`]);
    }
    setXp((prevXp) => {
      let total = prevXp + finalAmount;
      let lvl = level;
      let cap = lvl * 100;
      while (total >= cap) {
        total -= cap;
        lvl += 1;
        cap = lvl * 100;
      }
      if (lvl !== level) {
        setLevel(lvl);
        // processLevelUp must NOT run here — this callback executes synchronously inside
        // whatever handler called grantXp, before that handler's OTHER setState calls
        // (e.g., flagging a domain as touched/received-a-point) have actually committed.
        // Queuing it for a useEffect guarantees it only runs after everything from this
        // action has landed, so it reads fresh state instead of stale pre-action closures.
        setPendingLevelUps((prev) => [...prev, { fromLevel: level, toLevel: lvl }]);
      }
      return total;
    });
  }

  // Every HV grant also counts toward leveling — 1 HV = 1 XP, applied through the same
  // grantXp path (including XP Booster doubling). This is the single place HV is ever
  // added, so every source (daily tasks, quests, HV Catalyst) stays consistent.
  function grantHV(domainKey, amount) {
    setDomainHV((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + amount }));
    grantXp(amount);
  }

  function activateXpBoost() {
    if (inventory.xpBoosters <= 0 || xpBoostActive) return;
    setInventory((prev) => ({ ...prev, xpBoosters: prev.xpBoosters - 1 }));
    setXpBoostActive(true);
    pushLog(["[System]: XP Booster activated — next XP grant doubled."]);
  }

  function spendHvCatalyst() {
    if (inventory.hvCatalysts <= 0) return;
    const domain = DOMAINS.find((d) => d.key === spendCatalystDomain);
    setInventory((prev) => ({ ...prev, hvCatalysts: prev.hvCatalysts - 1 }));
    grantHV(spendCatalystDomain, 2);
    pushLog([`[System]: HV Catalyst spent — ${domain.label} +2 HV (+2 XP).`]);
  }

  // Avatar creation is one-and-done — this is the only way to change hairstyle afterward.
  // Consumes on use, temporarily re-enables just the hairstyle picker; re-locks automatically
  // the moment a new style is chosen.
  function useHairstyleChange() {
    if (inventory.hairstyleChanges <= 0 || hairstyleEditUnlocked) return;
    setInventory((prev) => ({ ...prev, hairstyleChanges: prev.hairstyleChanges - 1 }));
    setHairstyleEditUnlocked(true);
    pushLog(["[System]: Hairstyle Change used — pick a new style."]);

  // Shop: purely cosmetic. Head/Upper/Lower are buy-once-equip-freely; Accessory/Aura are
  // sequential ladders (must own tier N-1 before buying tier N). Every purchase here is the
  // only source of goldSpentTotal, which is what the "Big Spender" emblem tracks.
  function buyCosmeticItem(slot, catalog, item) {
    const owned = shopOwned[slot];
    if (owned.includes(item.id) || inventory.gold < item.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - item.cost }));
    setGoldSpentTotal((prev) => prev + item.cost);
    setShopOwned((prev) => ({ ...prev, [slot]: [...prev[slot], item.id] }));
    pushLog([`[System]: Purchased ${item.label} — ${item.cost} Gold.`]);
  }

  function equipCosmeticItem(slot, itemId) {
    if (itemId !== null && !shopOwned[slot].includes(itemId)) return;
    setShopEquipped((prev) => ({ ...prev, [slot]: itemId }));
  }

  function buyAccessoryTier() {
    const nextIdx = accessoryTier; // tier N is index N-1; buying rung `accessoryTier + 1`
    if (nextIdx >= ACCESSORY_TIERS.length) return;
    const tier = ACCESSORY_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAccessoryTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  function buyAuraTier() {
    const nextIdx = auraTier;
    if (nextIdx >= AURA_TIERS.length) return;
    const tier = AURA_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAuraTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  // Reusable Shop slot picker — "None" plus each catalog item, showing owned/equipped/

  function renderShopSlot(slotKey, catalog, slotLabel) {
    const owned = shopOwned[slotKey];

    return (

            className={`mono text-[9px] px-2 py-1.5 rounded border transition ${

            }`}

                key={item.id}

                }
                className={`flex items-center gap-1.5 mono text-[9px] px-2 py-1.5 rounded border transition ${
                  isEquipped
                    ? "border-[#3DDBD9]"

                {!isOwned && <span className="text-[#F2C94C]">{item.cost}g</span>}

  // Reusable tier-ladder picker for Accessories/Aura — same visual language as the Emblem

  }
