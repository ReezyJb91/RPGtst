  // Fires whenever real midnight has passed relative to the current cycle's deadline —
  // whether that's because the app was open and a tick just crossed it live, or because
  // the app was closed over midnight and this is the first render after reopening (same
  // logic handles both: nowTick starts near "now" on mount, so if the loaded deadline is
  // already in the past, this fires immediately rather than waiting for a fresh tick).
  // Guarded on penaltyActive so it doesn't double-fire while already locked — see
  // clearPenalty/useTeleportStone for what happens if ANOTHER day passes while still stuck.
  useEffect(() => {
    if (!loaded || penaltyActive || dailyQuestDeadline === null) return;
    if (nowTick < dailyQuestDeadline) return;

    if (questComplete) {
      // Completed before the deadline hit — roll cleanly into the next cycle.
      setChecked({});
      setQuestComplete(false);
    } else {
      // Deadline passed with the quest incomplete — apply the penalty retroactively,
      // exactly as if the countdown had hit zero while the app was open.
      triggerPenalty();
    }
    setDailyQuestDeadline(getNextMidnight(nowTick));
    // Fatigue resets here specifically because this IS the real daily-timer-start
    // boundary (real midnight), not on early quest completion — matches the locked
    // design ("reset tied to the daily timer start, not cycle end").
    setFatigue(0);
    setFatigueUpdatedAt(nowTick);
    // Shop gear reroll — tied to this exact same real-midnight boundary, per the
    // queued spec ("rerolls daily on the dailies reset cycle"). Deliberately inside
    // the penaltyActive-guarded branch above rather than its own independent day-
    // counter, so it turns over exactly when the rest of the daily cycle does.
    setShopGearStock(rollShopGearStock(level));
    // Domain key rotation — one new domain-specific key type per day, excluding
    // yesterday's pick (no-repeat rule). Functional update so it reads the actual
    // current value rather than a possibly-stale closed-over one.
    setShopDomainKeyToday((prev) => rollShopDomainKey(prev));
    // Key purchase caps (universal + 6 domain-specific) reset on this exact same
    // real-midnight boundary, same reasoning as the Shop gear reroll above.
    setKeyPurchasesToday({
      universal: 0,
      ...Object.fromEntries(DOMAINS.map((d) => [d.key, 0])),
    });
    // OneSignal — Daily Quest completion tag resets here too, unconditionally: whether
    // the previous cycle ended in a clean completion or a penalty, a new day of Daily
    // Quests has begun and yesterday's "done" status no longer applies.
    setDailyQuestsDoneTag(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [nowTick, loaded, dailyQuestDeadline, questComplete, penaltyActive]);

  // Drains the pending level-up queue one at a time. This is what actually calls
  // processLevelUp — deferred to an effect (never called synchronously from grantXp) so it
  // always reads state AFTER every other setState from the triggering action has committed,
  // instead of stale pre-action closures.
  useEffect(() => {
    if (pendingLevelUps.length === 0) return;
    const [next, ...rest] = pendingLevelUps;
    setPendingLevelUps(rest);
    processLevelUp(next.fromLevel, next.toLevel);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingLevelUps]);

  // The first active Urgent Quest is the "focused" one — the modal only ever shows one at
  // a time, even if multiple domains have quests queued simultaneously.
  const focusedUrgentQuest = activeUrgentQuests[0] || null;
  const focusedUrgentQuestIdRef = useRef(null);

  // Single consolidated effect for both "a new quest just became focused, reset the timer"
  // and "count down the existing timer." These MUST live in one effect, not two — splitting
  // them caused a real race: the countdown-check effect would read the leftover urgentTimeLeft
  // from whatever the PREVIOUS quest left it at (often 0, right after a resolve/fail) in the
  // same pass as the reset effect, immediately failing a quest that had just been created,
  // before the reset to 45s had actually applied. The ref lets this effect tell "brand new
  // quest, just reset and stop here" apart from "same quest, keep counting down."
  useEffect(() => {
    if (!focusedUrgentQuest) {
      focusedUrgentQuestIdRef.current = null;
      return;
    }

    if (focusedUrgentQuestIdRef.current !== focusedUrgentQuest.id) {
      focusedUrgentQuestIdRef.current = focusedUrgentQuest.id;
      setUrgentTimeLeft(URGENT_QUEST_WINDOW_SECONDS);
      setUrgentPopupView("quest");
      return; // don't evaluate failure this same pass — nothing to fail yet
    }

    if (urgentTimeLeft <= 0) {
      failFocusedUrgentQuest();
      return;
    }
    const t = setTimeout(() => setUrgentTimeLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [urgentTimeLeft, focusedUrgentQuest]);

  // Timeout with no reward. Deliberately doesn't reset the domain's neglect/stagnation
  // clocks or add any extra punishment — the underlying signal that caused it stays exactly
  // where it was, so it can simply resurface and roll again later.
  function failFocusedUrgentQuest() {
    if (!focusedUrgentQuest) return;
    const quest = focusedUrgentQuest;
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    pushLog([`[System]: Urgent Quest failed — ${quest.label}`, "[System]: No reward granted."]);
  }

  // Emergency Quest's focus/countdown effect — structurally identical to Urgent's above
  // (same ref-based "brand new quest vs. still counting down" split, same reasoning for
  // why it has to be one effect not two), except on timeout it calls failEmergencyQuest
  // (queues a Tier 2 penalty) instead of Urgent's no-penalty failure. focusedEmergencyQuest
  // is a derived const (mirrors focusedUrgentQuest above), not stored state.
  const focusedEmergencyQuest = activeEmergencyQuests[0] || null;
  const focusedEmergencyQuestIdRef = useRef(null);

  useEffect(() => {
    if (!focusedEmergencyQuest) {
      focusedEmergencyQuestIdRef.current = null;
      return;
    }
    if (focusedEmergencyQuestIdRef.current !== focusedEmergencyQuest.id) {
      focusedEmergencyQuestIdRef.current = focusedEmergencyQuest.id;
      setEmergencyTimeLeft(EMERGENCY_QUEST_WINDOW_SECONDS);
      setEmergencyPopupView("quest");
      return; // don't evaluate failure this same pass — nothing to fail yet
    }
    if (emergencyTimeLeft <= 0) {
      failEmergencyQuest(focusedEmergencyQuest);
      return;
    }
    const t = setTimeout(() => setEmergencyTimeLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [emergencyTimeLeft, focusedEmergencyQuest]);

  function touchedMapFromChecked() {
    const map = {};
    DOMAINS.forEach((d) => {
      const task = DAILY_TASKS.find((t) => t.domain === d.key);
      map[d.key] = !!(task && checked[task.id]);
    });
    return map;
  }

  // Runs at the end of every cycle (success or failure). Grows HV for whatever got touched
  // (daily tasks = 2 HV each), rolls the neglect clock, tracks stat-allocation stagnation,
  // and evaluates Urgent Quest triggers — only on a full pass does it also rank HV to
  // allocate the 3 earned stat points across domains.
  function endCycle({ awardPoints }) {
    const touched = touchedMapFromChecked();

    // Daily task HV growth routes through grantHV. Since the shared fix (grantHV no
    // longer also grants XP), this only grows HV now — no hidden XP on top.
    DOMAINS.forEach((d) => {
      if (touched[d.key]) grantHV(d.key, 2);
    });

    setDomainQuestCount((prev) => {
      const next = { ...prev };
      DOMAINS.forEach((d) => {
        if (touched[d.key]) next[d.key] = (next[d.key] || 0) + 1;
      });
      return next;
    });

    // Ranked HV allocation replaced with 1 manually-allocated point per Daily Quest pass —
    // banked in inventory, spent on whichever domain the player chooses via the existing
    // Bonus Stat Point flow.
    if (awardPoints) {
      setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints + 1 }));
      pushLog(["[System]: +1 Stat Point earned. Allocate it in Inventory."]);
    }

    // The daily cycle's only remaining job for the Urgent/Emergency Quest systems:
    // refresh their per-cycle fire caps. Neglect and stagnation are both level-up-driven
    // now — this cycle boundary doesn't touch either of them.
    setUrgentQuestsThisCycle(0);
    setEmergencyQuestsThisCycle(0);
    setTotalCyclesCompleted((n) => n + 1); // real endCycle() count, for comparing against Level

    setChecked({});
  }

  // Neglect: consecutive level-up checkpoints without receiving a stat point (the old
  // domainPointsMissedStreak/domainReceivedPointSinceCycle tracking — repurposed as
  // neglect's definition now, not a separately-named "stagnation").
  function severityFromNeglect(streak) {
    if (streak >= NEGLECT_THRESHOLDS.severe) return "severe";
    if (streak >= NEGLECT_THRESHOLDS.moderate) return "moderate";
    if (streak >= NEGLECT_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Stagnation: how far this domain's Main Quest completions have fallen behind whichever
  // domain has completed the most, within the current window (since the last stagnation
  // reset). counts must include every domain, including this one.
  function severityFromStagnation(domainKey, counts) {
    const maxCount = Math.max(0, ...Object.values(counts));
    const deficit = maxCount - (counts[domainKey] || 0);
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.severe) return "severe";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.moderate) return "moderate";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Caps at 1 new Urgent Quest per cycle, gated on chance rather than firing automatically
  // the instant a domain crosses threshold. TRIGGER SOURCE SWAP (locked 2026-09-07):
  // Urgent now checks STAGNATION only — neglect belongs to Emergency Quest instead (see
  // below). The old combined neglect/stagnation tie-break is gone entirely; each system
  // checks exactly one condition, independently. Eligible domains that don't get picked
  // stay queued silently for future cycles — no notification for a non-event.
  // Pure readout of what's currently eligible, straight from real committed game state —
  // used for the debug panel's live preview. NOT used by evaluateUrgentTriggers itself:
  // that function is called from processLevelUp with live domainMainQuestsSinceReset,
  // which doesn't need a freshly-computed pass the way neglect (used by Emergency) does.
  function getCurrentEligibleUrgentDomains() {
    return DOMAINS.map((d) => {
      if (activeUrgentQuests.some((q) => q.domain === d.key)) return null;
      const severity = severityFromStagnation(d.key, domainMainQuestsSinceReset);
      return severity ? { domain: d, severity } : null;
    }).filter(Boolean);
  }

  // Emergency Quest's eligible-domain readout — NEGLECT only, mirrors the Urgent
  // version above exactly except for which single condition it checks.
  function getCurrentEligibleEmergencyDomains() {
    return DOMAINS.map((d) => {
      if (activeEmergencyQuests.some((q) => q.domain === d.key)) return null;
      const severity = severityFromNeglect(domainPointsMissedStreak[d.key] || 0);
      return severity ? { domain: d, severity } : null;
    }).filter(Boolean);
  }

  // Pure roll: given a list of {domain, severity} eligible entries and a trigger chance,
  // returns the picked one or null. No side effects — shared by both Urgent and
  // Emergency (and their debug simulators), so simulating either actually tests the
  // real code, not a reimplementation of it.
  function rollWeightedTrigger(eligible, chance) {
    if (eligible.length === 0) return null;
    if (Math.random() > chance) return null;
    const totalWeight = eligible.reduce((sum, e) => sum + SEVERITY_WEIGHT[e.severity], 0);
    let roll = Math.random() * totalWeight;
    let picked = eligible[0];
    for (const e of eligible) {
      roll -= SEVERITY_WEIGHT[e.severity];
      if (roll <= 0) {
        picked = e;
        break;
      }
    }
    return picked;
  }
  function rollUrgentTrigger(eligible) {
    return rollWeightedTrigger(eligible, URGENT_TRIGGER_CHANCE);
  }
  function rollEmergencyTrigger(eligible) {
    return rollWeightedTrigger(eligible, EMERGENCY_TRIGGER_CHANCE);
  }

  // Debug: fires rollWeightedTrigger 1000x against a synthetic eligible set (not real game
  // state) and tallies results. Tests the actual chance-gate + severity-weighting mechanism
  // in isolation, since waiting on real cycles to see if the odds "feel right" is slow and
  // easy to misjudge from a handful of pulls.
  function runUrgentTriggerSimulation(scenarioLabel, eligible) {
    const iterations = 1000;
    let firedCount = 0;
    const pickCounts = {};
    for (let i = 0; i < iterations; i++) {
      const picked = rollUrgentTrigger(eligible);
      if (picked) {
        firedCount++;
        pickCounts[picked.domain.key] = (pickCounts[picked.domain.key] || 0) + 1;
      }
    }
    setSimResults({ scenarioLabel, iterations, firedCount, pickCounts, eligible });
  }

  function evaluateUrgentTriggers(mainQuestCounts) {
    if (urgentQuestsThisCycle >= URGENT_QUESTS_PER_CYCLE_CAP) return; // cap reached for this cycle
    setActiveUrgentQuests((prevActive) => {
      const eligible = DOMAINS.map((d) => {
        if (prevActive.some((q) => q.domain === d.key)) return null; // already has one active
        const severity = severityFromStagnation(d.key, mainQuestCounts);
        return severity ? { domain: d, severity } : null;
      }).filter(Boolean);

      const picked = rollUrgentTrigger(eligible);
      if (!picked) return prevActive;

      const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
      if (pool.length === 0) return prevActive;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      const newQuest = {
        id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
        domain: picked.domain.key,
        label: chosen.label,
        severity: picked.severity,
      };

      // Player-facing log stays mechanics-free — no "stagnation" reveal, same spirit as
      // HV being a hidden value. The severity badge on the quest card itself
      // (mild/moderate/severe) is the only difficulty signal the player sees.
      pushLog([
        `[System]: Urgent Quest — ${picked.domain.label}.`,
        `[System]: ${chosen.label}`,
      ]);
      setUrgentQuestsThisCycle((n) => n + 1);

      // Firing a quest wipes the imbalance window for EVERY domain, not just the picked
      // one — the slate clears once you've been prompted to address it, rather than
      // immediately flagging whichever domain is next-most-behind. Unconditional now
      // (used to be gated on reason==="stagnation" back when Urgent had two reasons —
      // stagnation is the ONLY reason now, so this always applies).
      setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));

      return [...prevActive, newQuest];
    });
  }

  // Emergency Quest's trigger evaluation — NEGLECT only, mirrors evaluateUrgentTriggers
  // structurally. Returns whether it actually fired (added a new quest), since
  // processLevelUp needs that to decide whether Urgent gets to roll this same cycle
  // (Emergency rolls FIRST; if it fires, Urgent does NOT roll that cycle).
  function evaluateEmergencyTriggers(pointsMissedMap) {
    if (emergencyQuestsThisCycle >= EMERGENCY_QUESTS_PER_CYCLE_CAP) return false;
    let fired = false;
    setActiveEmergencyQuests((prevActive) => {
      const eligible = DOMAINS.map((d) => {
        if (prevActive.some((q) => q.domain === d.key)) return null;
        const severity = severityFromNeglect(pointsMissedMap[d.key] || 0);
        return severity ? { domain: d, severity } : null;
      }).filter(Boolean);

      const picked = rollEmergencyTrigger(eligible);
      if (!picked) return prevActive;

      const pool = EMERGENCY_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
      if (pool.length === 0) return prevActive;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      const newQuest = {
        id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
        domain: picked.domain.key,
        label: chosen.label,
        severity: picked.severity,
      };

      pushLog([
        `[System]: EMERGENCY QUEST — ${picked.domain.label}.`,
        `[System]: ${chosen.label}`,
      ]);
      setEmergencyQuestsThisCycle((n) => n + 1);
      fired = true;
      return [...prevActive, newQuest];
    });
    return fired;
  }

  // Debug-only wrapper: runs the real trigger logic (same pure helpers, same real
  // consequences — a fired result really does add a real Urgent Quest and log it) but also
  // captures the outcome synchronously for display, since evaluateUrgentTriggers itself is
  // silent on a non-fire by design, which makes it look like nothing happened when testing.
  function runTriggerOnCurrentState() {
    const eligible = getCurrentEligibleUrgentDomains();
    const picked = rollUrgentTrigger(eligible);

    if (!picked) {
      setDebugTriggerResult({
        eligible,
        fired: false,
        reason: eligible.length === 0 ? "No domain eligible." : "Roll failed (40% chance not met).",
      });
      return;
    }

    const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
    if (pool.length === 0) {
      setDebugTriggerResult({ eligible, fired: false, reason: "Picked domain had an empty pool." });
      return;
    }
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    const newQuest = {
      id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
      domain: picked.domain.key,
      label: chosen.label,
      severity: picked.severity,
    };
    setActiveUrgentQuests((prev) => [...prev, newQuest]);
    // Shares the exact same player-facing (mechanics-hidden) log text as the real trigger
    // path — this button applies real consequences, so the log it produces should read
    // identically to what a real level-up trigger would write. Full detail (reason,
    // severity) still shows in debugTriggerResult below, in the Debug tab only.
    pushLog([
      `[System]: Urgent Quest — ${picked.domain.label}.`,
      `[System]: ${chosen.label}`,
    ]);
    if (picked.reason === "stagnation") {
      setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));
    }
    setDebugTriggerResult({ eligible, fired: true, picked, questLabel: chosen.label });
  }

  function resolveUrgentQuest(quest) {
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    setDomainStats((prev) => ({ ...prev, [quest.domain]: prev[quest.domain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [quest.domain]: true })); // auto stat point
    const grantedXp = grantXp(150); // XP doubling pass (v39) — Urgent 75 -> 150 (Manual 60 / Main 300)
    grantHV(quest.domain, 1); // HV only now — grantHV no longer adds hidden bonus XP
    pushLog([
      `[System]: Urgent Quest resolved — ${quest.label}`,
      `[System]: +${grantedXp} XP, +1 stat point.`,
    ]);
    maybeRollEncounter(); // non-Daily completion — small chance of an Encounter
    const gotBox = maybeGrantMysteryBox(); // same non-Daily completions, independent roll
    setQuestCompletePopup({
      type: "Urgent Quest",
      label: quest.label,
      lines: [`+${grantedXp} XP`, "+1 stat point", ...(gotBox ? ["+1 Mystery Box"] : [])],
    });
  }

  // Emergency Quest resolution — same shape as resolveUrgentQuest, different reward
  // numbers: flat 150 XP (double Urgent's 75), +1 stat (same as Urgent), and HV = the
  // player's CURRENT level (grantHV(domain, level), not a flat number) — a genuinely
  // level-scaling reward, unlike every other quest type's fixed HV amounts.
  function resolveEmergencyQuest(quest) {
    setActiveEmergencyQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    setDomainStats((prev) => ({ ...prev, [quest.domain]: prev[quest.domain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [quest.domain]: true })); // auto stat point
    const grantedXp = grantXp(EMERGENCY_QUEST_XP);
    grantHV(quest.domain, level); // HV = player level, per spec — scales with progression
    pushLog([
      `[System]: Emergency Quest resolved — ${quest.label}`,
      `[System]: +${grantedXp} XP, +1 stat point.`,
    ]);
    maybeRollEncounter(); // same non-Daily completion bonuses as every other quest type
    const gotBox = maybeGrantMysteryBox(); // independent roll
    setQuestCompletePopup({
      type: "Emergency Quest",
      label: quest.label,
      lines: [`+${grantedXp} XP`, "+1 stat point", ...(gotBox ? ["+1 Mystery Box"] : [])],
    });
  }

  // Manual quests: player-authored, ad hoc ("go to the gym today"). Gives XP and HV, but no
  // direct stat bump — same as Main Quests, HV only influences future daily point allocation.
  // Completing one still counts as touching that domain today.
  function addManualQuest() {
    const label = newManualLabel.trim();
    if (!label) return;
    setManualQuests((prev) => [
      ...prev,
      { id: `manual-${Date.now()}-${Math.random()}`, label, domain: newManualDomain },
    ]);
    setNewManualLabel("");
  }

  function completeManualQuest(quest) {
    // Guard added as part of the XP-not-granted bug investigation: completeMainQuest
    // already guards against being called on an already-completed/removed quest, but
    // completeManualQuest never did. A double-fire (rapid double-tap, or a stale button
    // reference from a delayed re-render) would previously have granted XP/HV twice
    // silently rather than being blocked — this closes that gap defensively, even
    // though it wasn't confirmed as the exact cause of the reported bug.
    if (!manualQuests.some((q) => q.id === quest.id)) return;
    setManualQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    const grantedXp = grantXp(60); // XP doubling pass (v39) — Manual 30->60 / Main 150->300 / Urgent 75->150
    grantHV(quest.domain, 1); // HV only now — grantHV no longer adds hidden bonus XP
    pushLog([`[System]: Manual Quest complete — ${quest.label}`, `[System]: +${grantedXp} XP.`]);
    maybeRollEncounter(); // non-Daily completion — small chance of an Encounter
    const gotBox = maybeGrantMysteryBox(); // same non-Daily completions, independent roll
    maybeGrantEquipmentDrop(); // independent equipment-drop roll, same completion types
    setQuestCompletePopup({
      type: "Manual Quest",
      label: quest.label,
      lines: [`+${grantedXp} XP`, ...(gotBox ? ["+1 Mystery Box"] : [])], // "+1 HV" hidden from popup per queue — HV grant above is unaffected
    });
  }

  // Main quests: one per domain, mandatory-feeling milestone objective, player-authored.
  // +3 HV plus a bigger XP reward on completion, matching the weight of a real milestone.
  // How many domains currently have a SMART quest set but not yet completed — the
  // number the domain cap checks against. Completed quests free their slot back up.
  function activeMainQuestCount() {
    return DOMAINS.filter((d) => mainQuests[d.key].specific && !mainQuests[d.key].complete).length;
  }

  function openMainQuestSetup(domainKey) {
    if (activeMainQuestCount() >= MAIN_QUEST_DOMAIN_CAP) return; // cap enforced at the open step
    setMainQuestSetupDomain(domainKey);
  }

  function submitMainQuestSetup(domainKey, fields) {
    if (!fields.specific.trim() || !fields.measurable.trim()) return; // minimum viable SMART entry
    setMainQuests((prev) => ({
      ...prev,
      [domainKey]: {
        specific: fields.specific.trim(),
        measurable: fields.measurable.trim(),
        relevant: fields.relevant.trim(),
        targetDate: fields.targetDate,
        setAt: Date.now(),
        complete: false,
      },
    }));
    setMainQuestSetupDomain(null);
    pushLog([`[System]: Main Quest set — ${DOMAINS.find((d) => d.key === domainKey).label}.`]);
  }

  function completeMainQuest(domainKey) {
    const quest = mainQuests[domainKey];
    if (!quest.specific || quest.complete) return;
    if (nowTick < quest.setAt + MAIN_QUEST_TIME_LOCK_MS) return; // still time-locked
    setMainQuests((prev) => ({ ...prev, [domainKey]: { ...prev[domainKey], complete: true } }));
    setDomainQuestCount((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    setDomainMainQuestsSinceReset((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    const grantedXp = grantXp(300); // XP doubling pass (v39) — Manual 30->60 / Main 150->300 / Urgent 75->150
    grantHV(domainKey, 3); // HV only now — grantHV no longer adds hidden bonus XP
    pushLog([
      `[System]: Main Quest complete — ${quest.specific}`,
      `[System]: +${grantedXp} XP.`,
    ]);
    maybeRollMainQuestEncounter(); // dedicated higher-rate trigger — NOT maybeRollEncounter/ENCOUNTER_CHANCE
    const gotBox = maybeGrantMysteryBox(); // same non-Daily completions, independent roll
    maybeGrantEquipmentDrop(); // independent equipment-drop roll, same completion types
    setQuestCompletePopup({
      type: "Main Quest",
      label: quest.specific,
      lines: [`+${grantedXp} XP`, ...(gotBox ? ["+1 Mystery Box"] : [])], // "+3 HV" hidden from popup per queue — HV grant above is unaffected
    });
  }

  function resetMainQuest(domainKey) {
    setMainQuests((prev) => ({
      ...prev,
      [domainKey]: { specific: "", measurable: "", relevant: "", targetDate: "", setAt: null, complete: false },
    }));
  }

  // Shared fatigue-add helper — collapses the derived currentFatigue back into a
  // concrete snapshot at the moment of change, so decay continues correctly from
  // *this* point forward rather than from whenever it was last touched. Used by
  // Encounters below and by the Debug tab's manual test buttons.
  function addFatigue(amount) {
    setFatigue(Math.min(100, currentFatigue + amount));
    setFatigueUpdatedAt(nowTick);
  }

  // Resolution behind one function boundary, per the extensibility plan — everything
  // that CALLS this only ever reacts to its result, so V2 (multi-stat, multi-stage)
  // can change what happens INSIDE this function without touching any call site.
  // Accepts a full stats object even though V1 only reads the one relevant domain's
  // stat off it, for the same forward-compatibility reason.
  //
  // Two-stage stat scaling — see ENCOUNTER_STAGE2_START/CAP above for the full
  // reasoning. Stage 1 lowers the Loss threshold toward its permanent floor of 10
  // (40-30); Stage 2 only ever touches the WIN threshold, so Loss can never drop
  // further no matter how high the stat climbs — investment past the Stage 1 cap
  // converts Close call into Win instead of doing nothing.
  // `opts.isMainQuest` scales rewards for a Main Quest Encounter (2x gold/fatigue, 3x
  // XP; Financial Win uses MAIN_QUEST_FINANCIAL_ITEM_POOL instead of the base pool) —
  // added so the SAME resolution function handles both cases without duplicating any
  // of the win/loss/stat-scaling logic above. Regular Encounters just omit opts.
  function resolveEncounter(encounter, stats, opts) {
    opts = opts || {};
    const isMainQuest = !!opts.isMainQuest;
    const choice = opts.choice || null; // "defensive" | "aggressive" | "balanced" | null
    const relevantStat = stats[encounter.domain] || 0;
    const stage1Bonus = Math.min(ENCOUNTER_STAT_BONUS_CAP, relevantStat * 0.3);
    const extraStat = Math.max(0, relevantStat - ENCOUNTER_STAGE2_START);
    const stage2Bonus = Math.min(ENCOUNTER_STAGE2_CAP, extraStat * 0.1);
    let lossThreshold = 40 - stage1Bonus; // floors at 10, permanently
    let winThreshold = 70 - stage1Bonus - stage2Bonus + equipmentEnchantBonus("encounterWinRate");
    // Encounter Choice System (v38) — modifiers apply ON TOP of the thresholds above,
    // immediately before the roll. Aggressive's clamp protects the win-bonus it just
    // bought by capping the flat risk instead, rather than letting a low-stat pick
    // invert the two thresholds entirely.
    if (choice === "defensive") {
      lossThreshold -= Math.min(15, relevantStat * 0.15);
    } else if (choice === "aggressive") {
      winThreshold -= Math.min(25, relevantStat * 0.25);
      lossThreshold += 15;
      if (winThreshold < lossThreshold + 10) {
        lossThreshold = winThreshold - 10;
      }
    } else if (choice === "balanced") {
      const scale = Math.min(5, relevantStat * 0.05);
      winThreshold -= 5 + scale;
      lossThreshold -= 5 + scale;
    }
    const roll = Math.random() * 100;
    const tier = roll >= winThreshold ? "win" : roll >= lossThreshold ? "closeCall" : "loss";
    const text = tier === "win" ? encounter.winText : tier === "closeCall" ? encounter.closeCallText : encounter.lossText;

    // Financial Win grants an item instead of gold — see ENCOUNTER_ITEM_POOL and the
    // comment above ENCOUNTER_POOL's Financial section for the reasoning. Close
    // call/Loss stay on the uniform gold system even for Financial; only Win differs.
    // Financial Win is also excluded from ENCOUNTER_XP below — it's item-only, no XP —
    // while Financial's own Close Call/Loss still get XP normally like every other domain.
    let itemReward = null;
    let goldChange = ENCOUNTER_GOLD[tier] * (isMainQuest ? MAIN_QUEST_ENCOUNTER_GOLD_MULT : 1);
    let xpChange = ENCOUNTER_XP[tier] * (isMainQuest ? MAIN_QUEST_ENCOUNTER_XP_MULT : 1);
    const fatigueChange = ENCOUNTER_FATIGUE[tier] * (isMainQuest ? MAIN_QUEST_ENCOUNTER_FATIGUE_MULT : 1);
    if (encounter.domain === "financial" && tier === "win") {
      const picked = pickWeighted(isMainQuest ? MAIN_QUEST_FINANCIAL_ITEM_POOL : ENCOUNTER_ITEM_POOL);
      // Equipment Lootbox now banks like every other lootbox (resolve-on-open, not
      // resolve-on-win) — a flat inventory counter, same shape as Mystery Box/Dungeon
      // Lootbox, instead of the old special-cased "equipment" itemReward type that
      // rolled and granted a concrete item immediately. See resolveEquipmentLootboxBox
      // + openEquipmentLootboxesBatch for the actual roll, now deferred to open time.
      itemReward = { field: picked.field, label: picked.label };
      goldChange = 0;
      xpChange = 0; // unchanged by isMainQuest — Financial Win stays item-only either way
    }

    return {
      tier,
      text,
      goldChange,
      xpChange,
      itemReward,
      fatigueChange,
      isMainQuest,
      choice,
      stages: [{ roll, tier }], // always exactly 1 stage in V1 — see design notes above
    };
  }

  // Small chance on Manual/Urgent Quest completion — deliberately excludes Daily
  // Quest, which stays the fixed, non-escalating routine it was always meant to be.
  // Main Quest no longer uses this shared rate — see maybeRollMainQuestEncounter below,
  // which uses its own dedicated, higher rate instead.
  function maybeRollEncounter() {
    if (Math.random() >= ENCOUNTER_CHANCE) return;
    const encounter = ENCOUNTER_POOL[Math.floor(Math.random() * ENCOUNTER_POOL.length)];
    setActiveEncounter({ encounter, result: null });
  }

  // Main Quest's own dedicated Encounter trigger (3x ENCOUNTER_CHANCE) — deliberately
  // NOT routed through maybeRollEncounter/ENCOUNTER_CHANCE, since Main Quest's rate is
  // meant to be independently tunable (see MAIN_QUEST_ENCOUNTER_CHANCE comment). Flags
  // the resulting activeEncounter as isMainQuest so engageEncounter passes that through
  // to resolveEncounter for the 2x/3x reward scaling.
  function maybeRollMainQuestEncounter() {
    if (Math.random() >= MAIN_QUEST_ENCOUNTER_CHANCE) return;
    const encounter = ENCOUNTER_POOL[Math.floor(Math.random() * ENCOUNTER_POOL.length)];
    setActiveEncounter({ encounter, result: null, isMainQuest: true });
  }

  // The original "small lootbox chance on quest completion" idea — deliberately kept
  // separate from Encounters (which also fire on these same 3 completion types) rather
  // than having Encounter Win also grant a box, which would let two independent bonus-
  // loot systems stack on the same action. A distinct rate (8%, not 10%) so the two
  // don't read as the same mechanic wearing two names.
  // Split into a gate (maybeGrantMysteryBox) and the actual grant logic
  // (grantMysteryBox) so the Debug tab can force a guaranteed box on demand.
  function grantMysteryBox() {
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes + 1 }));
    pushLog(["[System]: A Mystery Box turned up along the way."]);
    return true;
  }

  function maybeGrantMysteryBox() {
    const chance = QUEST_COMPLETION_BOX_CHANCE + equipmentEnchantBonus("mysteryBoxRate");
    if (Math.random() >= chance) return false;
    return grantMysteryBox();
  }

  // Now takes the player's Encounter Choice pick (v38) — "defensive"/"aggressive"/
  // "balanced" — and passes it straight through to resolveEncounter as opts.choice,
  // which is where the actual threshold math lives. This is the ONLY caller of
  // resolveEncounter that a person can reach through normal play, so choice is
  // required here, not optional (declineEncounter bypasses resolution entirely).
  function engageEncounter(choice) {
    if (!activeEncounter || activeEncounter.result) return;
    const result = resolveEncounter(activeEncounter.encounter, domainStats, {
      isMainQuest: activeEncounter.isMainQuest,
      choice,
    });
    if (result.itemReward) {
      setInventory((prev) => ({
        ...prev,
        [result.itemReward.field]: prev[result.itemReward.field] + 1,
      }));
    } else if (result.goldChange !== 0) {
      setInventory((prev) => ({ ...prev, gold: Math.max(0, prev.gold + result.goldChange) }));
      if (result.goldChange > 0) {
        setGoldEarnedTotal((prev) => prev + result.goldChange);
      }
    }
    const xpGranted = result.xpChange > 0 ? grantXp(result.xpChange) : 0;
    // Encounter losses are a forced cost, not an intentional purchase — deliberately
    // NOT counted toward goldSpentTotal, which the Big Spender emblem tracks and which
    // Shop purchases are documented as the "only source" of.
    addFatigue(result.fatigueChange);
    const rewardLine = result.itemReward
      ? `[System]: Received ${result.itemReward.label}.`
      : `[System]: ${result.goldChange >= 0 ? "+" : ""}${result.goldChange} Gold.`;
    pushLog([
      `[System]: ${activeEncounter.encounter.label} — ${ENCOUNTER_CHOICE_LABELS[activeEncounter.encounter.domain][choice].label}. ${result.text}`,
      `${rewardLine}${xpGranted > 0 ? ` +${xpGranted} XP.` : ""} +${result.fatigueChange} Fatigue.`,
    ]);
    setActiveEncounter((prev) => ({ ...prev, result: { ...result, xpGranted } }));
  }

  function declineEncounter() {
    setActiveEncounter(null); // no effect at all — no gold, no fatigue
  }

  // Gate check — all 4 must pass: level, the specific domain's stat, current streak,
  // and having enough keys banked. Fatigue is the hard wall (>80 blocks regardless of
  // the other 3), matching the locked design distinguishing Dungeon from Encounters.
  // Key availability is domain-specific keys PLUS the universal pool combined — spend
  // priority (domain-specific first) is resolved separately in startDungeonRun.
  function canAttemptDungeon(domainKey, tier) {
    const availableKeys = (inventory.domainKeys[domainKey] || 0) + inventory.dungeonKeys;
    return (
      level >= tier.levelReq &&
      (domainStats[domainKey] || 0) >= tier.statReq &&
      currentStreak >= tier.streakReq &&
      availableKeys >= tier.keysReq &&
      currentFatigue <= 80
    );
  }

  function dungeonRandomInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  // Secondary domain per location — pairs with the location's own domain (the
  // "primary") to form the weighted-bias scheme below. Chosen per the earlier
  // location↔domain design pass: Icy Mountains skews Physical/Mental, Deep-Sea
  // skews Mental/Physical, etc. — see dungeon-room-content-draft.md.
  const DUNGEON_SECONDARY_DOMAIN = {
    physical: "mental",
    mental: "physical",
    financial: "mental",
    relational: "faith",
    social: "physical",
    faith: "financial",
  };

  // Weighted domain pick for a single answer: 50% the location's own (primary)
  // domain, 20% its secondary domain, remaining 30% split evenly across the
  // other four domains (7.5% each). This is what makes training a location's
  // home domain actually pay off — previously every domain was equally likely
  // regardless of which Dungeon you were running, so stat investment didn't
  // make your own Dungeon meaningfully cheaper. Replaces the old uniform
  // 1-in-6 pick. See dungeon-room-content-draft.md for the full rationale.
  function pickWeightedDomain(primaryKey) {
    const secondaryKey = DUNGEON_SECONDARY_DOMAIN[primaryKey];
    const others = DOMAINS.map((d) => d.key).filter((k) => k !== primaryKey && k !== secondaryKey);
    const roll = Math.random() * 100;
    if (roll < 50) return primaryKey;
    if (roll < 70) return secondaryKey;
    const idx = Math.min(others.length - 1, Math.floor(((roll - 70) / 30) * others.length));
    return others[idx];
  }

  // Picks one authored scenario from THIS location's own pool (see
  // DUNGEON_SCENARIOS — now keyed per location, not one shared pool across all
  // six), pairs each answer with a weighted-random domain via pickWeightedDomain
  // (primary/secondary bias, not uniform across all 6 anymore), then shuffles
  // display order so the always-3 answers never sit in a learnable best->worst
  // position. Choices-per-room is fixed at 3 (one per authored answer), since
  // every scenario is authored as a complete 3-answer set. This does NOT change
  // the run's total room count (still the random per-tier range in
  // DUNGEON_ROOM_COUNT_RANGE); see dungeon-spec.md for the update.
  function generateDungeonRoom(domainKey) {
    const pool = DUNGEON_SCENARIOS[domainKey];
    const scenario = pool[Math.floor(Math.random() * pool.length)];
    const paired = scenario.answers.map((a) => ({
      domainKey: pickWeightedDomain(domainKey),
      quality: a.quality,
      text: a.text,
    }));
    const choices = dungeonShuffle(paired);
    return { prompt: scenario.setting, choices };
  }

  // Entry point — replaces the old openDungeonPrompt+confirmDungeonAttempt combo.
  // debugForced skips the gate check and key cost entirely (see the Debug tab trigger)
  // but still runs the REAL room/resolve/final-room/reward logic, same principle as
  // the old debug-force path had for the simpler single-roll version.
  // Computes the exact key spend breakdown for a tier attempt — domain-specific first,
  // universal covering the rest — WITHOUT touching inventory. Used to populate the
  // confirmation screen; startDungeonRun below does the identical calculation again at
  // the moment of actual spend (kept separate/duplicated rather than shared, since one
  // is a pure preview and the other is the real state update).
  function dungeonKeySpendPreview(domainKey, tier) {
    const domainAvail = inventory.domainKeys[domainKey] || 0;
    const fromDomain = Math.min(domainAvail, tier.keysReq);
    const fromUniversal = tier.keysReq - fromDomain;
    return {
      fromDomain,
      fromUniversal,
      domainRemainingAfter: domainAvail - fromDomain,
      universalRemainingAfter: inventory.dungeonKeys - fromUniversal,
    };
  }

  // Opens the confirmation screen — does NOT spend a key or start the run. Only reached
  // from an already-unlocked tier button (canAttemptDungeon already passed), so the
  // preview here is guaranteed satisfiable. Boost selection always starts fresh (no
  // carry-over from a cancelled previous attempt).
  function requestDungeonEntry(domainKey, tierKey) {
    const tier = DUNGEON_TIERS.find((t) => t.key === tierKey);
    if (!tier) return;
    setPendingDungeonEntry({ domainKey, tier });
    setDungeonBoostSelection({ tellChance: null, resolve: null, hearts: null, dropRate: null });
  }

  // Toggles one boost type's tier selection in the pending confirmation — picking the
  // already-selected tier again deselects it (None). Only ever called for a tier the
  // player actually owns (the picker UI itself only renders owned tiers as options).
  function selectDungeonBoostTier(type, tier) {
    setDungeonBoostSelection((prev) => ({ ...prev, [type]: prev[type] === tier ? null : tier }));
  }

  function cancelDungeonEntry() {
    setPendingDungeonEntry(null);
  }

  function confirmDungeonEntry() {
    if (!pendingDungeonEntry) return;
    const { domainKey, tier } = pendingDungeonEntry;
    const boosts = dungeonBoostSelection;
    setPendingDungeonEntry(null);
    // Consume the selected boosts now, atomically alongside the key spend inside
    // startDungeonRun — a boost picked here is spent whether or not the run ultimately
    // succeeds, same convention as the key cost.
    setInventory((prev) => {
      const next = { ...prev, consumableBoosts: { ...prev.consumableBoosts } };
      CONSUMABLE_BOOST_TYPES.forEach((t) => {
        const pickedTier = boosts[t.key];
        if (pickedTier) {
          next.consumableBoosts = {
            ...next.consumableBoosts,
            [t.key]: { ...next.consumableBoosts[t.key], [pickedTier]: next.consumableBoosts[t.key][pickedTier] - 1 },
          };
        }
      });
      return next;
    });
    startDungeonRun(domainKey, tier.key, false, boosts); // existing key-consumption + entry logic, unchanged
  }

  function startDungeonRun(domainKey, tierKey, debugForced, boosts) {
    const tier = DUNGEON_TIERS.find((t) => t.key === tierKey);
    if (!tier) return;
    if (!debugForced) {
      if (!canAttemptDungeon(domainKey, tier)) return;
      // Spend priority: domain-specific keys for this dungeon FIRST, universal pool
      // only covers whatever's left — never the other way around.
      setInventory((prev) => {
        const domainAvail = prev.domainKeys[domainKey] || 0;
        const fromDomain = Math.min(domainAvail, tier.keysReq);
        const fromUniversal = tier.keysReq - fromDomain;
        return {
          ...prev,
          domainKeys: { ...prev.domainKeys, [domainKey]: domainAvail - fromDomain },
          dungeonKeys: prev.dungeonKeys - fromUniversal,
        };
      });
    }
    const [roomMin, roomMax] = DUNGEON_ROOM_COUNT_RANGE[tierKey];
    const totalRooms = dungeonRandomInt(roomMin, roomMax);
    // v38 Dungeon rework: Resolve pool is now the RELEVANT domain's stat only, not the
    // sum of all 6 — "dedication vs. breadth": a neglected domain now carries real risk
    // into its own dungeon regardless of how strong the other 5 are. No floor, no
    // blending with the other domains, per spec — matches the existing Neglect/
    // Stagnation design language (a domain's own numbers are what's on the line).
    let resolveMax = (domainStats[domainKey] || 0) + level * 2;
    // Resolve Boost — fractional increase to the pool for this run only, applied once
    // here at entry (not re-checked later, same "snapshot at entry" convention the
    // Two-Pronged Hearts bonus already uses for its own Resolve% read).
    const activeBoosts = boosts || { tellChance: null, resolve: null, hearts: null, dropRate: null };
    if (activeBoosts.resolve) {
      resolveMax = Math.round(resolveMax * (1 + CONSUMABLE_BOOST_EFFECTS.resolve[activeBoosts.resolve]));
    }
    const firstRoom = generateDungeonRoom(domainKey);
    setActiveDungeonRun({
      domainKey,
      tier,
      debugForced: !!debugForced,
      totalRooms,
      roomIndex: 0,
      resolveMax,
      resolve: resolveMax,
      prompt: firstRoom.prompt,
      choices: firstRoom.choices,
      pickedDomainKey: null,
      pickedCost: null,
      phase: "rooms",
      boosts: activeBoosts, // read later by startDungeonFinalRoomRound (tellChance),
      // continueAfterDungeonRoom (hearts), and finishDungeonRun (dropRate)
    });
  }

  // Voluntary exit during Regular Rooms — mechanically identical to running out of
  // Resolve (same fatigue, same zero reward), but a deliberate player choice rather
  // than a forced one. Per design: "2 separate mechanics, same outcome."
  function retreatFromDungeon() {
    if (!activeDungeonRun || activeDungeonRun.phase !== "rooms") return;
    finishDungeonRun("fail");
  }

  // Cost is deliberately hidden until after the pick — the choice itself is the whole
  // mechanic, not a menu of visible numbers to optimize against. As of the worldbuilding
  // pass, cost is now driven by TWO independent hidden factors: the domain stat (as
  // before) and the answer's authored quality (best/ok/worst — see DUNGEON_SCENARIOS),
  // multiplied in alongside tierMultiplier. Floor is still applied before either
  // multiplier, consistent with the tier-multiplier ordering already documented.
  function pickDungeonRoomChoice(domainKey, quality) {
    if (!activeDungeonRun || activeDungeonRun.phase !== "rooms" || activeDungeonRun.pickedCost !== null) return;
    const stat = domainStats[domainKey] || 0;
    const raw = Math.max(DUNGEON_ROOM_COST_FLOOR, DUNGEON_ROOM_COST_BASE - stat * DUNGEON_ROOM_COST_REDUCTION);
    const qualityMult = DUNGEON_QUALITY_COST_MULT[quality] ?? 1;
    let cost = Math.round(raw * DUNGEON_ROOM_TIER_MULT[activeDungeonRun.tier.key] * qualityMult);
    // Equipment's Weapon/T3-secondary Resolve-cost reduction applies here, after the
    // floor and every other multiplier — a real % cut off the final number, not a
    // pre-formula stat point, so it stays meaningful even at the stat floor. Universal:
    // applies regardless of which domain this room choice happens to be.
    const reduction = equipmentResolveCostReduction();
    if (reduction > 0) cost = Math.round(cost * (1 - reduction));
    setActiveDungeonRun((prev) => ({
      ...prev,
      resolve: Math.max(0, prev.resolve - cost),
      pickedDomainKey: domainKey,
      pickedCost: cost,
    }));
  }

  // Advances past the "here's what that cost you" feedback — either into the next
  // room, into the Final Room (all rooms cleared), or straight to a fail result
  // (Resolve hit 0 before the Final Room was ever reached).
  function continueAfterDungeonRoom() {
    if (!activeDungeonRun || activeDungeonRun.pickedCost === null) return;
    if (activeDungeonRun.resolve <= 0) {
      finishDungeonRun("fail");
      return;
    }
    const nextIndex = activeDungeonRun.roomIndex + 1;
    if (nextIndex >= activeDungeonRun.totalRooms) {
      // All Regular Rooms cleared — the Final Room's opponent hearts = this run's
      // actual room count, so a harder tier's finale is a longer fight, not just
      // scarier flavor text. Boss is picked ONCE here, not per-round — it's the
      // same opponent for the whole Final Room.
      const boss = pickDungeonBoss(activeDungeonRun.domainKey, activeDungeonRun.tier.key);
      const introText = DUNGEON_FINAL_ROOM_INTROS[activeDungeonRun.domainKey](dungeonCapitalize(dungeonBossDisplayName(boss)));
      // Hearts total is snapshotted ONCE here, at Final Room entry — armor tier and
      // Resolve% are both read at this exact moment, per the Two-Pronged Bonus System.
      const armorTier = equipment.armor ? equipment.armor.tier : "none";
      const resolvePercent = activeDungeonRun.resolveMax > 0 ? activeDungeonRun.resolve / activeDungeonRun.resolveMax : 0;
      // Hearts Boost consumable (if applied to this run) adds flat bonus hearts on top
      // of the existing Two-Pronged total — additive, not folded into that formula.
      const heartsBoostBonus =
        activeDungeonRun.boosts && activeDungeonRun.boosts.hearts
          ? CONSUMABLE_BOOST_EFFECTS.hearts[activeDungeonRun.boosts.hearts]
          : 0;
      const totalHearts = dungeonComputeFinalRoomHearts(armorTier, resolvePercent) + heartsBoostBonus;
      // Boss intro is now its own screen (phase: "finalRoomIntro") with a Start Battle
      // button, rather than sharing the first Attack Select screen — see boss intro
      // screen split. continueFromDungeonIntro() below advances into "finalRoom".
      setActiveDungeonRun({
        ...activeDungeonRun,
        phase: "finalRoomIntro",
        playerHearts: totalHearts,
        maxPlayerHearts: totalHearts,
        opponentHearts: activeDungeonRun.totalRooms,
        boss,
        introText,
        // Snapshotted once, here, same moment as the Hearts bonus read above — reused
        // by finishDungeonRun's XP formula (v38 rework) so both rewards are driven off
        // the exact same "how much Resolve did you have left when it mattered" number.
        resolvePercentAtEntry: resolvePercent,
      });
      return;
    }
    const nextRoom = generateDungeonRoom(activeDungeonRun.domainKey);
    setActiveDungeonRun((prev) => ({
      ...prev,
      roomIndex: nextIndex,
      prompt: nextRoom.prompt,
      choices: nextRoom.choices,
      pickedDomainKey: null,
      pickedCost: null,
    }));
  }

  const DUNGEON_BEATS = { heavy: "fast", fast: "counter", counter: "heavy" };

  // Sets up one round: pre-generates the opponent's move (needed so a tell can reveal
  // it before the player picks) and rolls whether this round's tell actually triggers.
  // When it does, also picks which of the boss's authored cue lines for that move to
  // show — restricted to this tier's variety count (see DUNGEON_BOSS_CUE_COUNT) —
  // alongside the existing explicit "you sense HEAVY" callout, not replacing it; the
  // cue is flavor on top of the mechanical signal, not a substitute for it.
  function startDungeonFinalRoomRound(baseState) {
    const moves = ["heavy", "fast", "counter"];
    const opponentMove = moves[Math.floor(Math.random() * moves.length)];
    const stat = domainStats[baseState.domainKey] || 0;
    const baseTell = Math.min(30, stat * 0.3) + Math.min(20, Math.max(0, stat - 100) * 0.1);
    let tellChance = Math.min(50, baseTell * DUNGEON_TELL_TIER_MULT[baseState.tier.key]);
    // Trinket's flat bonus AND a Tell Chance Boost consumable (if applied to this run)
    // are both added AFTER the tier cap/multiplier above — the only kinds of bonus that
    // can push past Elite's permanent 35% ceiling, per design.
    const consumableTellBonus =
      baseState.boosts && baseState.boosts.tellChance
        ? CONSUMABLE_BOOST_EFFECTS.tellChance[baseState.boosts.tellChance]
        : 0;
    tellChance = Math.min(100, tellChance + equipmentTellChanceBonus() + consumableTellBonus);
    const tellTriggered = Math.random() * 100 < tellChance;
    const tellCue = tellTriggered ? pickDungeonBossCue(baseState.boss, opponentMove, baseState.tier.key) : null;
    setActiveDungeonRun({
      ...baseState,
      phase: "finalRoom",
      opponentMove,
      tellRevealed: tellTriggered ? opponentMove : null,
      tellCue,
      lastRoundOutcome: null,
    });
  }

  // Boss intro screen's "Start Battle" button — advances from the standalone intro
  // screen (phase: "finalRoomIntro") into the first real round of the Final Room.
  // This is the ONLY caller that should ever transition out of "finalRoomIntro".
  function continueFromDungeonIntro() {
    if (!activeDungeonRun || activeDungeonRun.phase !== "finalRoomIntro") return;
    startDungeonFinalRoomRound(activeDungeonRun);
  }

  function pickDungeonFinalRoomMove(playerMove) {
    if (!activeDungeonRun || activeDungeonRun.phase !== "finalRoom" || activeDungeonRun.lastRoundOutcome) return;
    const { opponentMove } = activeDungeonRun;
    const outcome =
      playerMove === opponentMove ? "tie" : DUNGEON_BEATS[playerMove] === opponentMove ? "win" : "lose";
    // Armor Protection Chance — checked PER HIT, only relevant on an actual loss.
    // On proc, fully negates the heart loss for this hit; the round still records as
    // a "lose" for tell/cue purposes, only the heart cost itself is negated.
    const protectionProcced = outcome === "lose" && Math.random() < equipmentArmorProtectionChance();
    const newPlayerHearts =
      outcome === "lose" && !protectionProcced ? activeDungeonRun.playerHearts - 1 : activeDungeonRun.playerHearts;
    const newOpponentHearts = outcome === "win" ? activeDungeonRun.opponentHearts - 1 : activeDungeonRun.opponentHearts;
    setActiveDungeonRun((prev) => ({
      ...prev,
      playerHearts: newPlayerHearts,
      opponentHearts: newOpponentHearts,
      lastRoundOutcome: outcome,
      playerMove,
      protectionProcced,
    }));
  }

  // Called after a brief pause on the round result (tie/win/lose) — either starts the
  // next round, or ends the run if either side just ran out of hearts.
  function continueAfterDungeonRound() {
    if (!activeDungeonRun || !activeDungeonRun.lastRoundOutcome) return;
    if (activeDungeonRun.opponentHearts <= 0) {
      finishDungeonRun("complete");
      return;
    }
    if (activeDungeonRun.playerHearts <= 0) {
      finishDungeonRun("partial");
      return;
    }
    startDungeonFinalRoomRound(activeDungeonRun);
  }

  // Computes and applies every reward for the run in one place, regardless of which
  // path led here (Resolve hitting 0, a voluntary Retreat, or a Final Room outcome).
  function finishDungeonRun(result) {
    setActiveDungeonRun((prev) => {
      const { domainKey, tier, debugForced } = prev;
      const domain = DOMAINS.find((d) => d.key === domainKey);
      let xp = 0, gold = 0, stat = 0;

      if (result === "complete" || result === "partial") {
        // v38 Dungeon rework: XP is now Resolve-driven, not a flat uniform-random roll.
        // resolvePercentAtEntry is the exact same entry-snapshotted resolve/resolveMax
        // the Final Room Hearts bonus already uses — a depleted run lands near pMin,
        // a well-prepared one near pMax. Always set by this point: Complete/Partial
        // only ever happen after passing through the Final Room entry snapshot above.
        const [pMin, pMax] = DUNGEON_XP_PERCENT_RANGE[tier.key];
        const resolvePercent = prev.resolvePercentAtEntry || 0;
        const percent = pMin + (pMax - pMin) * resolvePercent;
        const xpToNext = level * 100;
        const [gMin, gMax] = DUNGEON_GOLD_RANGE[tier.key];
        const fullXp = Math.floor(xpToNext * (percent / 100));
        const fullGold = Math.floor(gMin + Math.random() * (gMax - gMin));
        const fullStat = DUNGEON_STAT_REWARD[tier.key];
        if (result === "complete") {
          xp = fullXp; gold = fullGold; stat = fullStat;
        } else {
          // Partial: a genuinely separate second step on the SAME rolled values, not
          // a different formula — half of whatever Complete would have given, floored.
          xp = Math.floor(fullXp * 0.5);
          gold = Math.floor(fullGold * 0.5);
          stat = Math.floor(fullStat * 0.5); // Novice's +1 floors to 0 here, by design
        }
        if (xp > 0) xp = grantXp(xp); // capture the actual (possibly boosted) amount for display below
        if (gold > 0) {
          setInventory((inv) => ({ ...inv, gold: inv.gold + gold }));
          setGoldEarnedTotal((g) => g + gold);
        }
        if (stat > 0) setDomainStats((ds) => ({ ...ds, [domainKey]: (ds[domainKey] || 0) + stat }));
      }

      // Dungeon Lootbox — guaranteed on Complete (DUNGEON_LOOTBOX_CHANCE = 1.0),
      // independent of maybeGrantEquipmentDrop's quest-completion roll. Banked
      // UNOPENED (resolve-on-open) rather than resolved immediately — gear vs
      // consumable is decided later, in openDungeonLootboxes, against this box's own
      // gearChance (30% baseline, or boosted if a Drop Rate Boost was applied to this
      // specific run — self-referential, doesn't affect any other banked box).
      let lootboxBanked = false;
      if (result === "complete" && Math.random() < DUNGEON_LOOTBOX_CHANCE) {
        const dropRateTier = prev.boosts && prev.boosts.dropRate;
        const gearChance = dropRateTier
          ? CONSUMABLE_BOOST_EFFECTS.dropRate[dropRateTier]
          : DUNGEON_LOOTBOX_GEAR_CHANCE;
        setUnopenedDungeonLootboxes((boxes) => [
          ...boxes,
          { id: dungeonLootboxNextId(), domainKey, tierKey: tier.key, gearChance },
        ]);
        lootboxBanked = true;
      }

      const fatigueGain =
        result === "fail" ? DUNGEON_FATIGUE.retreatOrFail : DUNGEON_FATIGUE.reachedFinalRoom;
      addFatigue(fatigueGain);

      const label = result === "complete" ? "cleared" : result === "partial" ? "partially cleared" : "not cleared";
      pushLog([
        `[System]: Dungeon ${label} — ${domain.label} (${tier.label}).${debugForced ? " [debug]" : ""}`,
        result === "fail"
          ? `[System]: No reward. +${fatigueGain} Fatigue.`
          : `[System]: +${xp} XP, +${gold} Gold, +${stat} ${domain.label} stat, +${fatigueGain} Fatigue.`,
        ...(lootboxBanked ? ["[System]: Dungeon Lootbox banked — open it from Inventory."] : []),
      ]);

      return { ...prev, phase: "result", result, rewardXp: xp, rewardGold: gold, rewardStat: stat, rewardLootboxBanked: lootboxBanked };
    });
  }

  // are attemptable immediately). Domain stats are independently randomized per domain
  // rather than one fixed number across all 6 — there's no formal "expected stat total at
  // level 30" formula anywhere else in the app to derive this from, so this is a first-pass,

  // into genuine Adept territory (Adept unlocks at Level 20/stat 2) without being Elite-ready.
  function quickStartRandomDomainStats() {
    return Object.fromEntries(DOMAINS.map((d) => [d.key, 8 + Math.floor(Math.random() * 23)]));

    setAvatarLocked(true);

  // so Shop's Upper/Lower slots can recolor them independently. Per-gender coordinates are
  // hand-picked to roughly match the original single-piece torso shape, split at the waist.
  function getAvatarBodyPaths(gender) {
    if (gender === "Female") {
      return {
        upper: "M 72 165 L 128 165 L 125 195 L 75 195 Z",
        lower: "M 75 195 L 125 195 L 122 225 L 78 225 Z",

  function renderAvatarSVG(className) {
    // Per-base position correction — see BODY_HEAD_OFFSETS above for why this exists.
    const genderKey = avatar.gender?.toLowerCase();
    const offset =
      (BODY_HEAD_OFFSETS[genderKey] && BODY_HEAD_OFFSETS[genderKey][avatar.skinTone]) ||
      { dx: 0, dy: 0 };

    // Head-mapping transform for hair/headgear — still authored in the OLD 200x240
    // coordinate space (old head: center 100,95, r=38), mapped onto the REAL head's
    // measured position (61,78 for the reference base, offset per-base above) so hair
    // doesn't break/mis-render during the transition. Reasonable estimate, not
    // composite-verified the way body+eyes were.
    const headTransform = `translate(${61 + offset.dx},${78 + offset.dy}) scale(0.947) translate(-100,-95)`;

    return (
      <svg viewBox={`0 0 ${BODY_WIDTH} ${BODY_HEIGHT}`} className={className}>
        {/* Aura/accessory positions below are proportional estimates in the new

        <image

        <image

        )}

    );

  // Appends one penalty entry to penaltyQueue. If the queue was empty, this becomes
  // the active (front) penalty and its countdown starts immediately; otherwise it
  // queues silently behind whatever's already active. `source` ("daily" | "emergency")
  // just lets clearPenalty's log line be accurate about what's being cleared.
  function queuePenalty(challenge, tier, source) {
    const durationSeconds = Math.round(challenge.baseSeconds * (tier === 2 ? ESCALATION_MULTIPLIER : 1));
    setPenaltyQueue((prev) => {
      const wasEmpty = prev.length === 0;
      if (wasEmpty) setPenaltyDeadline(Date.now() + durationSeconds * 1000);
      return [...prev, { challenge, tier, durationSeconds, source }];
    });
  }

  function triggerPenalty() {
    endCycle({ awardPoints: false }); // cycle ends in failure — HV/neglect still update, no points awarded

    const nextMissCount = missCount + 1;
    const tier = nextMissCount >= ESCALATION_THRESHOLD ? 2 : 1;
    const challenge = PENALTY_POOL[Math.floor(Math.random() * PENALTY_POOL.length)];

    setMissCount(nextMissCount);
    setCurrentStreak(0); // any miss breaks the streak Dungeon's streak-gate checks
    queuePenalty(challenge, tier, "daily");

    pushLog([
      "[System]: Daily Quest failed.",
      `[System]: App locked. Penalty assigned: ${challenge.label}.`,
      tier === 2
        ? `[System]: Escalation Tier 2 — ${nextMissCount} consecutive misses.`
        : "[System]: Complete the challenge to restore access.",
    ]);
  }

  // Emergency Quest failure — flat Tier 2 regardless of missCount, and deliberately
  // does NOT increment missCount: fully separate from Daily Quest's escalation system.
  // Appends (never interrupts an in-progress penalty).
  function failEmergencyQuest(quest) {
    setActiveEmergencyQuests((prev) => prev.filter((q) => q.id !== quest.id));
    const challenge = PENALTY_POOL[Math.floor(Math.random() * PENALTY_POOL.length)];
    queuePenalty(challenge, 2, "emergency");
    pushLog([
      `[System]: Emergency Quest failed — ${quest.label}`,
      `[System]: App locked. Penalty queued: ${challenge.label} (Tier 2).`,
    ]);
  }

  // Clears the FRONT penalty and, if another is queued behind it, immediately starts
  // that one's countdown fresh — back-to-back, no gap. App stays fully locked until
  // the whole queue is empty.
  function clearPenalty() {
    if (!canClearPenalty) return;
    const clearedSource = penaltyQueue.length > 0 ? penaltyQueue[0].source : null;
    setPenaltyQueue((prev) => {
      const next = prev.slice(1);
      setPenaltyDeadline(next.length > 0 ? Date.now() + next[0].durationSeconds * 1000 : null);
      return next;
    });
    pushLog([
      "[System]: Challenge verified complete.",
      "[System]: App access restored.",
      ...(clearedSource === "daily" ? ["[System]: Daily Quest reset."] : []),
    ]);
  }

  function toggleTask(task) {
    if (questComplete || penaltyActive) return;
    setChecked((prev) => ({ ...prev, [task.id]: !prev[task.id] }));

  useEffect(() => {
    const allDone = DAILY_TASKS.every((t) => checked[t.id]);
    if (allDone && !questComplete) {
      completeQuest();

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [checked]);

  function completeQuest() {
    setQuestComplete(true);
    const baseXp = 100; // XP doubling pass (v39) — Daily 50 -> 100
    const grantedXp = grantXp(baseXp); // called first so the log/popup can show the real (boosted) amount

    pushLog([
      "[System]: Daily Quest complete.",
      `[System]: +${grantedXp} XP, +50 Gold.`,
      "[System]: +1 Mystery Box.",
    ]);
    setMissCount(0);
    setCurrentStreak((prev) => prev + 1); // consecutive full passes — Dungeon's streak-gate reads this
    endCycle({ awardPoints: true }); // full pass — HV grows for all 6, +1 manual stat point banked
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes + 1, gold: prev.gold + 50 }));
    setDailyQuestsDoneTag(true); // OneSignal — same point the app detects "all done for today"
    setQuestCompletePopup({

      label: null,

  const dailyTimeLeft =
    dailyQuestDeadline !== null ? Math.max(0, Math.round((dailyQuestDeadline - nowTick) / 1000)) : 0;
  const penaltyTimeLeftDerived =
    penaltyDeadline !== null ? Math.max(0, Math.round((penaltyDeadline - nowTick) / 1000)) : 0;
  const canClearPenalty = penaltyDeadline !== null && nowTick >= penaltyDeadline;
