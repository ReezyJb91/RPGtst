                  key={c}
                  onClick={() => setAvatarField("hairColor", c)}
                  className="w-8 h-8 rounded-full border-2 transition"
                  style={{
                    backgroundColor: c,
                    borderColor: avatar.hairColor === c ? "#3DDBD9" : "transparent",
                  }}
                />
              ))}
            </div>
          </div>

          <button
            onClick={confirmAvatar}
            className="mono text-xs px-5 py-2.5 rounded transition"
            style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
          >
            CONFIRM AVATAR
          </button>
        </div>
      </div>
    );
  }

  // Full app lockout — this replaces the entire interface, no nav, no bypass,
  // until the assigned challenge's minimum duration has elapsed and it's marked complete.
  if (penaltyActive) {
    const domainMeta = activeChallenge && DOMAINS.find((d) => d.key === activeChallenge.domain);
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg flex flex-col items-center justify-center text-center relative"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>

        <button
          onClick={() => setShowDebug((s) => !s)}
          className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4"
          style={{ border: "1px solid #1E2430", color: "#5A6272" }}
        >
          DEBUG
        </button>
        {showDebug && (
          <div
            className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
            style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
          >
            {!resetArmed ? (
              <button
                onClick={() => setResetArmed(true)}
                className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                style={{ border: "1px solid #E5484D", color: "#E5484D" }}
              >
                RESET ALL PROGRESS
              </button>
            ) : (
              <div className="flex flex-col gap-1.5">
                <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                  Wipes save + all state. Confirm?
                </span>
                <div className="flex gap-1.5">
                  <button
                    onClick={debugReset}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #E5484D", backgroundColor: "#E5484D", color: "#0B0D12" }}
                  >
                    YES
                  </button>
                  <button
                    onClick={() => setResetArmed(false)}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                  >
                    CANCEL
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        <ShieldAlert size={36} color="#E5484D" />
        <div className="mono text-[#E5484D] text-sm tracking-widest mt-4">
          APP LOCKED{challengeTier === 2 ? " — ESCALATION TIER 2" : ""}
        </div>
        <div className="mono text-[10px] text-[#8B94A3] mt-1">
          {missCount} consecutive miss{missCount !== 1 ? "es" : ""}
        </div>
        {penaltyQueue.length > 1 && (
          <div className="mono text-[10px] mt-1" style={{ color: "#F2A93B" }}>
            Penalties remaining: {penaltyQueue.length - 1}
          </div>
        )}

        <div className="mt-6 border border-[#2A1518] bg-[#160D0F] rounded-md px-6 py-5 max-w-sm w-full">
          <div className="flex items-center justify-center gap-2 mb-2">
            <Lock size={14} color={domainMeta?.color || "#E5484D"} />
            <span
              className="mono text-[10px] tracking-widest"
              style={{ color: domainMeta?.color || "#E5484D" }}
            >
              {domainMeta?.label}
            </span>
          </div>
          <div className="text-[#EDEFF3] text-sm">{activeChallenge?.label}</div>
        </div>

        <div className="mt-6 mono text-xs text-[#8B94A3]">
          {canClearPenalty
            ? "Minimum duration met."
            : `Locked for ${formatCountdown(penaltyTimeLeftDerived)} minimum`}
        </div>
        {!canClearPenalty && (
          <div className="w-full max-w-xs h-1.5 bg-[#1E2430] rounded-full overflow-hidden mt-3">
            <div
              className="h-full bg-[#E5484D] transition-all duration-1000"
              style={{
                width: `${
                  activeChallenge
                    ? ((Math.round(
                        activeChallenge.baseSeconds *
                          (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                      ) -
                        penaltyTimeLeftDerived) /
                        Math.round(
                          activeChallenge.baseSeconds *
                            (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                        )) *
                      100
                    : 0
                }%`,
              }}
            />
          </div>
        )}

        <button
          onClick={clearPenalty}
          disabled={!canClearPenalty}
          className="mono text-xs mt-6 px-5 py-2.5 rounded border border-[#2A3140] bg-[#12151C] text-[#D6DCE5] disabled:opacity-40 disabled:cursor-not-allowed hover:border-[#3DDBD9] transition"
        >
          MARK CHALLENGE COMPLETE
        </button>

        {inventory.teleportStones > 0 && (
          <button
            onClick={() => useTeleportStoneBatch(1)}
            className="mono text-xs mt-3 px-5 py-2.5 rounded border border-[#3DDBD9] bg-[#0F1218] text-[#3DDBD9] hover:bg-[#12151C] transition"
          >
            USE TELEPORTATION STONE ({inventory.teleportStones}) — SKIP PENALTY
          </button>
        )}

        <div className="mono text-[9px] text-[#5A6272] mt-3 max-w-xs">
          Prototype note: self-reported. Real build needs an honest completion
          signal — a linked workout log, timer app, or similar — or this button
          defeats the whole mechanic.
        </div>
      </div>
    );
  }

  return (
    <div
      className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg"
      style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
    >
      <style>{`
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      `}</style>

      {/* Level Up popup — overlays the current view, dismissible, doesn't lock anything */}
      {/* Suppressed while questCompletePopup is up — both can become true in the same
          batch (a quest completion that also triggers a level-up), and without this
          they'd render as two stacked full-screen overlays at once. Quest popup shows
          first; dismissing it (setQuestCompletePopup(null)) re-renders with this
          condition now true, so Level Up appears right after, never simultaneously. */}
      {levelUpNotification && !questCompletePopup && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-xs w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <Zap size={28} color="#3DDBD9" className="mx-auto mb-2" />
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              LEVEL UP
            </div>
            <div className="mono text-lg mb-4" style={{ color: "#EDEFF3" }}>
              Level: {levelUpNotification.fromLevel} → {levelUpNotification.toLevel}
            </div>
            <div className="space-y-1 mb-5">
              {DOMAINS.filter((d) => levelUpNotification.gains[d.key]).map((d) => (
                <div key={d.key} className="flex items-center justify-between mono text-xs">
                  <span style={{ color: d.color }}>{d.label}</span>
                  <span style={{ color: "#D6DCE5" }}>
                    {levelUpNotification.gains[d.key].before} → {levelUpNotification.gains[d.key].after}
                  </span>
                </div>
              ))}
              {Object.keys(levelUpNotification.gains).length === 0 && (
                <div className="mono text-xs" style={{ color: "#5A6272" }}>
                  No eligible domain for stat gain.
                </div>
              )}
            </div>
            <button
              onClick={() => setLevelUpNotification(null)}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Main Quest SMART setup — a focused, single-purpose popup rather than an inline
          form, so setting a Main Quest feels like a deliberate commitment, not a text
          field you can absent-mindedly fill in. Specific + Measurable are required;
          Relevant and Target Date are encouraged but optional (informational only —
          the system doesn't enforce the date, only the 48h post-set completion lock). */}
      {mainQuestSetupDomain && (() => {
        const domain = DOMAINS.find((d) => d.key === mainQuestSetupDomain);
        return (
          <MainQuestSetupModal
            domain={domain}
            onCancel={() => setMainQuestSetupDomain(null)}
            onSubmit={(fields) => submitMainQuestSetup(mainQuestSetupDomain, fields)}
          />
        );
      })()}

      {/* Encounter popup — engage/decline, single-roll resolution shown immediately on
          engage. No countdown/window to expire against (unlike Urgent Quest), so
          Decline (or just not engaging) simply clears it with zero effect. */}
      {activeEncounter && (() => {
        const { encounter, result } = activeEncounter;
        const domain = DOMAINS.find((d) => d.key === encounter.domain);
        const tierColor =
          result?.tier === "win" ? "#3DDBD9" : result?.tier === "closeCall" ? "#F2A93B" : "#E5484D";
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-50 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full text-center"
              style={{ border: `1px solid ${domain.color}`, backgroundColor: "#12151C" }}
            >
              <div className="mono text-xs tracking-widest mb-1" style={{ color: domain.color }}>
                ENCOUNTER — {encounter.label.toUpperCase()}
              </div>
              {activeEncounter.isMainQuest && (
                <div className="mono text-[9px] tracking-widest mb-1" style={{ color: "#F2C94C" }}>
                  MAIN QUEST ENCOUNTER — 2x GOLD/FATIGUE, 3x XP
                </div>
              )}
              <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                {encounter.flavor}
              </div>

              {!result ? (
                <div className="space-y-2">
                  {ENCOUNTER_CHOICE_ORDER.map((choiceKey) => {
                    const choiceInfo = ENCOUNTER_CHOICE_LABELS[encounter.domain][choiceKey];
                    return (
                      <button
                        key={choiceKey}
                        onClick={() => engageEncounter(choiceKey)}
                        className="w-full text-left mono px-3 py-2 rounded border transition"
                        style={{ borderColor: domain.color, color: domain.color }}
                      >
                        <div className="text-xs">{choiceInfo.label}</div>
                        <div className="text-[10px]" style={{ color: "#8B94A3" }}>
                          {choiceInfo.flavor}
                        </div>
                      </button>
                    );
                  })}
                  <button
                    onClick={declineEncounter}
                    className="w-full mono text-[10px] px-3 py-1.5 rounded border transition"
                    style={{ borderColor: "#2A3140", color: "#8B94A3" }}
                  >
                    DECLINE
                  </button>
                </div>
              ) : (
                <>
                  <div className="mono text-[9px] mb-1" style={{ color: domain.color }}>
                    {ENCOUNTER_CHOICE_LABELS[encounter.domain][result.choice].label}
                  </div>
                  <div className="mono text-xs mb-3" style={{ color: tierColor }}>
                    {result.tier === "win" ? "WIN" : result.tier === "closeCall" ? "CLOSE CALL" : "LOSS"}
                  </div>
                  <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                    {result.text}
                  </div>
                  <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                    {result.itemReward
                      ? `Received: ${result.itemReward.label}`
                      : `${result.goldChange >= 0 ? "+" : ""}${result.goldChange} Gold`}
                    {result.xpGranted > 0 && ` · +${result.xpGranted} XP`}
                    {" "}· +{result.fatigueChange} Fatigue
                  </div>
                  <button
                    onClick={() => setActiveEncounter(null)}
                    className="mono text-xs px-5 py-2 rounded transition"
                    style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                  >
                    CONTINUE
                  </button>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Quest Complete popup — the questCompletePopup state and its two Daily/Urgent
          set-calls already existed; this adds the missing Manual/Main set-calls and
          the render itself, since nothing previously displayed it at all. */}
      {questCompletePopup && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-1" style={{ color: "#3DDBD9" }}>
              {questCompletePopup.type.toUpperCase()} COMPLETE
            </div>
            {questCompletePopup.label && (
              <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                {questCompletePopup.label}
              </div>
            )}
            <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
              {questCompletePopup.lines.map((line, i) => (
                <div key={i}>{line}</div>
              ))}
            </div>
            <button
              onClick={() => setQuestCompletePopup(null)}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Gear Purchase — Confirmation step. Tapping a Shop gear item opens this instead
          of buying immediately. No gold has moved yet; Cancel returns to the shop with
          zero changes, Confirm executes the purchase and opens the Completion step. */}
      {gearPurchaseConfirm && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              CONFIRM PURCHASE
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#D6DCE5" }}>
              {equipmentItemLabel(gearPurchaseConfirm.item)}
              <br />
              <span style={{ color: "#F2C94C" }}>{gearPurchaseConfirm.cost} Gold</span>
            </div>
            <div className="flex gap-2 justify-center">
              <button
                onClick={confirmGearPurchase}
                className="mono text-xs px-4 py-2 rounded transition"
                style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
              >
                CONFIRM
              </button>
              <button
                onClick={cancelGearPurchase}
                className="mono text-xs px-4 py-2 rounded border transition"
                style={{ borderColor: "#2A3140", color: "#8B94A3" }}
              >
                CANCEL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Gear Purchase — Completion step. Shown after Confirm; gold has already been
          deducted and the item added to gearInventory by this point. Continue just
          dismisses back to the shop — equipping happens separately in the Gear tab. */}
      {gearPurchaseComplete && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              PURCHASE COMPLETE
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
              {equipmentItemLabel(gearPurchaseComplete.item)}
              <br />
              −{gearPurchaseComplete.cost} Gold
            </div>
            <button
              onClick={closeGearPurchaseComplete}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Dungeon Key Confirmation — shown right before a run starts, whenever a key
          would actually be consumed (i.e. every non-debug entry). Cancel returns to the
          Dungeon select screen with zero changes; Confirm hands off to the existing
          startDungeonRun key-consumption + entry logic, unchanged. */}
      {pendingDungeonEntry && (() => {
        const { domainKey, tier } = pendingDungeonEntry;
        const domain = DOMAINS.find((d) => d.key === domainKey);
        const preview = dungeonKeySpendPreview(domainKey, tier);
        const spendLines = [];
        if (preview.fromDomain > 0) {
          spendLines.push({
            label: `${DUNGEON_LOCATIONS[domainKey]} Key × ${preview.fromDomain}`,
            remaining: `${preview.domainRemainingAfter} left`,
          });
        }
        if (preview.fromUniversal > 0) {
          spendLines.push({
            label: `Universal Key × ${preview.fromUniversal}`,
            remaining: `${preview.universalRemainingAfter} left`,
          });
        }
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-50 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full text-center"
              style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
            >
              <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
                CONFIRM DUNGEON ENTRY
              </div>
              <div className="mono text-[10px] mb-1" style={{ color: domain.color }}>
                {DUNGEON_LOCATIONS[domainKey]} — {tier.label}
              </div>
              <div className="mono text-[10px] mb-4" style={{ color: "#D6DCE5" }}>
                {spendLines.map((l, i) => (
                  <div key={i}>
                    {l.label} <span style={{ color: "#5A6272" }}>({l.remaining} after)</span>
                  </div>
                ))}
              </div>
              {CONSUMABLE_BOOST_TYPES.some((t) =>
                CONSUMABLE_BOOST_TIERS.some((tier) => inventory.consumableBoosts[t.key][tier] > 0)
              ) && (
                <div className="mb-4 text-left">
                  <div className="mono text-[9px] tracking-widest mb-1" style={{ color: "#8B94A3" }}>
                    CONSUMABLE BOOSTS — OPTIONAL, ONE PER TYPE
                  </div>
                  {CONSUMABLE_BOOST_TYPES.map((t) => {
                    const ownedTiers = CONSUMABLE_BOOST_TIERS.filter(
                      (tier) => inventory.consumableBoosts[t.key][tier] > 0
                    );
                    if (ownedTiers.length === 0) return null;
                    return (
                      <div key={t.key} className="flex items-center gap-1 mb-1 flex-wrap">
                        <span className="mono text-[9px] w-24 shrink-0" style={{ color: "#D6DCE5" }}>
                          {t.label}
                        </span>
                        {ownedTiers.map((tier) => (
                          <button
                            key={tier}
                            onClick={() => selectDungeonBoostTier(t.key, tier)}
                            className="mono text-[9px] px-2 py-0.5 rounded border transition"
                            style={
                              dungeonBoostSelection[t.key] === tier
                                ? { border: "1px solid #3DDBD9", color: "#3DDBD9" }
                                : { border: "1px solid #2A3140", color: "#8B94A3" }
                            }
                          >
                            {CONSUMABLE_BOOST_TIER_LABELS[tier]} ({inventory.consumableBoosts[t.key][tier]})
                          </button>
                        ))}
                      </div>
                    );
                  })}
                </div>
              )}
              <div className="flex gap-2 justify-center">
                <button
                  onClick={confirmDungeonEntry}
                  className="mono text-xs px-4 py-2 rounded transition"
                  style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                >
                  CONFIRM
                </button>
                <button
                  onClick={cancelDungeonEntry}
                  className="mono text-xs px-4 py-2 rounded border transition"
                  style={{ borderColor: "#2A3140", color: "#8B94A3" }}
                >
                  CANCEL
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Dungeon Key Purchase — Confirmation step. Shown after tapping BUY on either
          the Universal or the rotating domain-specific key line. No gold has moved yet;
          Cancel returns to the Shop with zero changes. Same visual pattern as Gear's
          purchase confirm. */}
      {keyPurchaseConfirm && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              CONFIRM PURCHASE
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#D6DCE5" }}>
              {keyPurchaseConfirm.label} × {keyPurchaseConfirm.qty}
              <br />
              <span style={{ color: "#F2C94C" }}>{keyPurchaseConfirm.totalCost} Gold</span>
              <br />
              <span style={{ color: "#5A6272" }}>
                {keyPurchaseConfirm.remainingAfter}/{KEY_DAILY_PURCHASE_CAP} left today after this
              </span>
            </div>
            <div className="flex gap-2 justify-center">
              <button
                onClick={confirmKeyPurchase}
                className="mono text-xs px-4 py-2 rounded transition"
                style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
              >
                CONFIRM
              </button>
              <button
                onClick={cancelKeyPurchase}
                className="mono text-xs px-4 py-2 rounded border transition"
                style={{ borderColor: "#2A3140", color: "#8B94A3" }}
              >
                CANCEL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Dungeon Key Purchase — Completion step. Shown after Confirm; gold has already
          been deducted and the keys added to inventory by this point. Continue just
          dismisses back to the shop. Same visual pattern as Gear's purchase complete. */}
      {keyPurchaseComplete && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              PURCHASE COMPLETE
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
              {keyPurchaseComplete.label} × {keyPurchaseComplete.qty}
              <br />
              −{keyPurchaseComplete.totalCost} Gold
            </div>
            <button
              onClick={closeKeyPurchaseComplete}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Consumable + Lootbox Usage — Confirmation step. Shared by every item in the
          Inventory panel's usage flow (Mystery Box, Dungeon Lootbox, HV Catalyst,
          Bonus Stat Point, Teleport Stone, XP Booster, Hairstyle Change). Nothing
          consumed yet; Cancel returns to Inventory with zero changes. */}
      {usageConfirm && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              CONFIRM {usageConfirm.label.toUpperCase()}
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#D6DCE5" }}>
              {usageConfirm.previewLines.map((l, i) => (
                <div key={i}>{l}</div>
              ))}
            </div>
            <div className="flex gap-2 justify-center">
              <button
                onClick={confirmUsageAction}
                className="mono text-xs px-4 py-2 rounded transition"
                style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
              >
                CONFIRM
              </button>
              <button
                onClick={cancelUsage}
                className="mono text-xs px-4 py-2 rounded border transition"
                style={{ borderColor: "#2A3140", color: "#8B94A3" }}
              >
                CANCEL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Consumable + Lootbox Usage — Completion step. Each roll/application is listed
          separately (not merged into one line), matching "resolved on its own" for
          lootboxes. Continue dismisses back to Inventory. */}
      {usageComplete && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              {usageComplete.label.toUpperCase()} × {usageComplete.qty} — RESULTS
            </div>
            <div className="mono text-[10px] mb-4 space-y-0.5" style={{ color: "#8B94A3" }}>
              {usageComplete.resultLines.map((l, i) => (
                <div key={i}>{l}</div>
              ))}
            </div>
            <button
              onClick={closeUsageComplete}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Gear Sell — Confirmation step. Only ever opened for an unequipped owned item.
          No gold has moved yet; Cancel returns to the Gear tab with zero changes. */}
      {gearSellConfirm && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              CONFIRM SELL
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#D6DCE5" }}>
              {equipmentItemLabel(gearSellConfirm.item)}
              <br />
              <span style={{ color: "#F2C94C" }}>+{gearSellConfirm.sellPrice} Gold</span>
            </div>
            <div className="flex gap-2 justify-center">
              <button
                onClick={confirmGearSell}
                className="mono text-xs px-4 py-2 rounded transition"
                style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
              >
                CONFIRM
              </button>
              <button
                onClick={cancelGearSell}
                className="mono text-xs px-4 py-2 rounded border transition"
                style={{ borderColor: "#2A3140", color: "#8B94A3" }}
              >
                CANCEL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Gear Sell — Completion step. Shown after Confirm; the item has already been
          removed from gearInventory and gold added by this point. */}
      {gearSellComplete && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-sm w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              SALE COMPLETE
            </div>
            <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
              {equipmentItemLabel(gearSellComplete.item)}
              <br />
              +{gearSellComplete.sellPrice} Gold
            </div>
            <button
              onClick={closeGearSellComplete}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Dungeon — full multi-phase run in one popup: Regular Rooms (hidden-cost
          domain choices) -> Final Room (hearts-based triangle) -> Result. See
          dungeon-spec.md for the complete design this implements. */}
      {activeDungeonRun && (() => {
        const run = activeDungeonRun;
        const domain = DOMAINS.find((d) => d.key === run.domainKey);
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-50 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full text-center"
              style={{ border: `1px solid ${domain.color}`, backgroundColor: "#12151C" }}
            >
              <div className="mono text-xs tracking-widest mb-3" style={{ color: domain.color }}>
                {domain.label.toUpperCase()} DUNGEON — {run.tier.label.toUpperCase()}
                {run.debugForced ? " [DEBUG]" : ""}
              </div>

              {run.phase === "rooms" && (
                <>
                  <div className="mono text-[10px] mb-1" style={{ color: "#8B94A3" }}>
                    Room {run.roomIndex + 1} / {run.totalRooms}
                  </div>
                  <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                    Resolve: {run.resolve} / {run.resolveMax}
                  </div>

                  {run.pickedCost === null ? (
                    <>
                      <div className="mono text-xs mb-3" style={{ color: "#D6DCE5" }}>
                        {run.prompt}
                      </div>
                      <div className="space-y-2 mb-3">
                        {run.choices.map((c, i) => {
                          const cDomain = DOMAINS.find((d) => d.key === c.domainKey);
                          return (
                            <button
                              key={i}
                              onClick={() => pickDungeonRoomChoice(c.domainKey, c.quality)}
                              className="w-full mono text-[10px] px-3 py-2 rounded border transition text-left"
                              style={{ borderColor: cDomain.color, color: cDomain.color }}
                            >
                              {c.text}
                            </button>
                          );
                        })}
                      </div>
                      <button
                        onClick={retreatFromDungeon}
                        className="mono text-[9px] px-3 py-1.5 rounded border transition"
                        style={{ borderColor: "#2A3140", color: "#8B94A3" }}
                      >
                        RETREAT
                      </button>
                    </>
                  ) : (
                    <>
                      <div className="mono text-xs mb-4" style={{ color: "#D6DCE5" }}>
                        Cost you {run.pickedCost} Resolve.
                      </div>
                      <button
                        onClick={continueAfterDungeonRoom}
                        className="mono text-xs px-5 py-2 rounded transition"
                        style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                      >
                        CONTINUE
                      </button>
                    </>
                  )}
                </>
              )}

              {run.phase === "finalRoomIntro" && (
                <>
                  <div className="mono text-xs mb-5" style={{ color: "#D6DCE5" }}>
                    {run.introText}
                  </div>
                  <div className="mono text-[10px] mb-5" style={{ color: "#8B94A3" }}>
                    You: {"●".repeat(run.playerHearts)}
                    {"   "}Opponent: {run.opponentHearts} / {run.totalRooms}
                  </div>
                  <button
                    onClick={continueFromDungeonIntro}
                    className="mono text-xs px-5 py-2 rounded transition"
                    style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                  >
                    START BATTLE
                  </button>
                </>
              )}

              {run.phase === "finalRoom" && (
                <>
                  <div className="mono text-[10px] mb-1" style={{ color: "#8B94A3" }}>
                    You face {dungeonBossDisplayName(run.boss)}.
                  </div>
                  <div className="mono text-[10px] mb-1" style={{ color: "#8B94A3" }}>
                    You: {"●".repeat(run.playerHearts)}
                    {"○".repeat(run.maxPlayerHearts - run.playerHearts)}
                    {"   "}Opponent: {run.opponentHearts} / {run.totalRooms}
                  </div>

                  {!run.lastRoundOutcome ? (
                    <>
                      <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                        {run.tellRevealed ? run.tellCue : "Pick your move."}
                      </div>
                      <div className="flex gap-2">
                        {["heavy", "fast", "counter"].map((m) => (
                          <button
                            key={m}
                            onClick={() => pickDungeonFinalRoomMove(m)}
                            className="flex-1 mono text-[10px] px-2 py-2 rounded border transition"
                            style={{ borderColor: domain.color, color: domain.color }}
                          >
                            {m.toUpperCase()}
                          </button>
                        ))}
                      </div>
                    </>
                  ) : (
                    <>
                      <div
                        className="mono text-xs mb-2"
                        style={{
                          color:
                            run.lastRoundOutcome === "win"
                              ? "#3DDBD9"
                              : run.lastRoundOutcome === "lose"
                              ? "#E5484D"
                              : "#8B94A3",
                        }}
                      >
                        {run.lastRoundOutcome === "win"
                          ? "YOU LANDED IT"
                          : run.lastRoundOutcome === "lose"
                          ? "THEY GOT THROUGH"
                          : "CLASH — NO ADVANTAGE"}
                      </div>
                      {run.protectionProcced && (
                        <div className="mono text-xs mb-2" style={{ color: "#3DDBD9" }}>
                          Your armor absorbed the hit — no heart lost.
                        </div>
                      )}
                      <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                        You: {run.playerMove.toUpperCase()} · Them: {run.opponentMove.toUpperCase()}
                      </div>
                      <button
                        onClick={continueAfterDungeonRound}
                        className="mono text-xs px-5 py-2 rounded transition"
                        style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                      >
                        CONTINUE
                      </button>
                    </>
                  )}
                </>
              )}

              {run.phase === "result" && (
                <>
                  <div
                    className="mono text-xs mb-3"
                    style={{
                      color:
                        run.result === "complete"
                          ? "#3DDBD9"
                          : run.result === "partial"
                          ? "#F2A93B"
                          : "#E5484D",
                    }}
                  >
                    {run.result === "complete"
                      ? "DUNGEON CLEARED"
                      : run.result === "partial"
                      ? "REACHED THE FINAL ROOM — NOT CLEARED"
                      : "DID NOT CLEAR"}
                  </div>
                  <div className="mono text-[10px] mb-4" style={{ color: "#8B94A3" }}>
                    {run.result === "fail"
                      ? "No reward."
                      : `+${run.rewardXp} XP, +${run.rewardGold} Gold, +${run.rewardStat} ${domain.label} stat.`}
                    {" "}+
                    {run.result === "fail" ? DUNGEON_FATIGUE.retreatOrFail : DUNGEON_FATIGUE.reachedFinalRoom} Fatigue
                    {run.rewardLootboxBanked && (
                      <>
                        <br />
                        <span style={{ color: "#3DDBD9" }}>Dungeon Lootbox banked — open it from Inventory.</span>
                      </>
                    )}
                  </div>
                  <button
                    onClick={closeDungeonRun}
                    className="mono text-xs px-5 py-2 rounded transition"
                    style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                  >
                    CLOSE
                  </button>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Urgent Quest semi-lock — a modal overlay, not a full app-replace like the Penalty
          Zone. Everything else stays visible underneath but non-interactive. Only the
          focused quest and Inventory (toggled via urgentPopupView) are reachable. Persists
          until the quest completes, fails (timer runs out), or a debug reset clears it. */}
      {/* Suppressed while an Emergency Quest is focused — Emergency takes priority since
          it's the higher-stakes system (failure locks the app via the penalty queue).
          Both being active simultaneously is rare (Emergency rolling first each cycle
          means Urgent usually doesn't even get a chance to fire the same cycle), but an
          Urgent quest already active from a PREVIOUS cycle could still overlap with a
          freshly-fired Emergency one, so this guard matters. */}
      {focusedUrgentQuest && !focusedEmergencyQuest && (() => {
        const domain = DOMAINS.find((d) => d.key === focusedUrgentQuest.domain);
        const severityColor =
          focusedUrgentQuest.severity === "severe"
            ? "#E5484D"
            : focusedUrgentQuest.severity === "moderate"
            ? "#F2A93B"
            : "#D6DCE5";
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-40 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.8)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full relative"
              style={{ border: "1px solid #F2A93B", backgroundColor: "#12151C" }}
            >
              <button
                onClick={() => setShowDebug((s) => !s)}
                className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4"
                style={{ border: "1px solid #1E2430", color: "#5A6272" }}
              >
                DEBUG
              </button>
              {showDebug && (
                <div
                  className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
                  style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
                >
                  {!resetArmed ? (
                    <button
                      onClick={() => setResetArmed(true)}
                      className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                      style={{ border: "1px solid #E5484D", color: "#E5484D" }}
                    >
                      RESET ALL PROGRESS
                    </button>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                        Wipes save + all state. Confirm?
                      </span>
                      <div className="flex gap-1.5">
                        <button
                          onClick={debugReset}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{
                            border: "1px solid #E5484D",
                            backgroundColor: "#E5484D",
                            color: "#0B0D12",
                          }}
                        >
                          YES
                        </button>
                        <button
                          onClick={() => setResetArmed(false)}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                        >
                          CANCEL
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {urgentPopupView === "quest" ? (
                <>
                  <div className="flex items-center gap-2 mb-3">
                    <ShieldAlert size={20} color="#F2A93B" />
                    <span className="mono text-xs tracking-widest" style={{ color: "#F2A93B" }}>
                      URGENT QUEST{activeUrgentQuests.length > 1 ? ` (1 of ${activeUrgentQuests.length})` : ""}
                    </span>
                  </div>

                  <div className="flex items-center gap-2 mb-2">
                    <span
                      className="mono text-[9px] tracking-widest px-1.5 py-0.5 rounded"
                      style={{ color: severityColor, border: `1px solid ${severityColor}` }}
                    >
                      {focusedUrgentQuest.severity.toUpperCase()}
                    </span>
                    <span className="mono text-[10px] tracking-wide" style={{ color: domain.color }}>
                      {domain.label}
                    </span>
                  </div>

                  <div className="text-sm mb-4" style={{ color: "#EDEFF3" }}>
                    {focusedUrgentQuest.label}
                  </div>

                  <div className="mono text-xs mb-4" style={{ color: "#F2A93B" }}>
                    {formatCountdown(urgentTimeLeft)} remaining
                  </div>

                  <div className="flex gap-2 flex-wrap">
                    <button
                      onClick={() => resolveUrgentQuest(focusedUrgentQuest)}
                      className="mono text-xs px-4 py-2 rounded transition"
                      style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                    >
                      RESOLVE
                    </button>
                    <button
                      onClick={() => setUrgentPopupView("inventory")}
                      className="mono text-xs px-4 py-2 rounded transition"
                      style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                    >
                      INVENTORY
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <div className="flex items-center justify-between mb-3">
                    <span className="mono text-xs tracking-widest" style={{ color: "#8B94A3" }}>
                      INVENTORY
                    </span>
                    <button
                      onClick={() => setUrgentPopupView("quest")}
                      className="mono text-[10px] px-3 py-1.5 rounded transition"
                      style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                    >
                      BACK
                    </button>
                  </div>
                  {renderInventoryPanel()}
                  {inventory.mysteryBoxes === 0 &&
                    inventory.teleportStones === 0 &&
                    inventory.bonusStatPoints === 0 &&
                    inventory.xpBoosterSmall === 0 &&
                    inventory.xpBoosterLarge === 0 &&
                    inventory.hvCatalysts === 0 &&
                    inventory.gold === 0 && (
                      <div className="mono text-[10px]" style={{ color: "#5A6272" }}>
                        Inventory is empty.
                      </div>
                    )}
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Emergency Quest modal — same shell as Urgent above (severity badge, domain,
          label, countdown, RESOLVE/INVENTORY), but red accent throughout, a stationary
          siren/beacon icon (not rotating), and a flashing icon+label + pulsing glow —
          visual severity signal for "failure locks the app," unlike Urgent's no-penalty
          failure. Flash is a gentle opacity fade (1 -> 0.35 -> 1, ease-in-out), NOT a
          hard strobe — photosensitivity consideration from the spec. */}
      {focusedEmergencyQuest && (() => {
        const domain = DOMAINS.find((d) => d.key === focusedEmergencyQuest.domain);
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-40 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.85)" }}
          >
            <style>{`
              @keyframes emergencyFlash {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.35; }
              }
              @keyframes emergencyGlow {
                0%, 100% { opacity: 0.15; transform: scale(0.94); }
                50% { opacity: 0.45; transform: scale(1.06); }
              }
              .emergency-flash { animation: emergencyFlash 1.2s ease-in-out infinite; }
              .emergency-glow { animation: emergencyGlow 1.6s ease-in-out infinite; }
            `}</style>
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full relative overflow-hidden"
              style={{ border: "1px solid #E5484D", backgroundColor: "#12151C" }}
            >
              {/* Pulsing red radial glow behind the header — loosely synced with the
                  flash (different cycle length on purpose, 1.6s vs 1.2s, so they drift
                  in and out of phase rather than looking mechanically locked together). */}
              <div
                className="emergency-glow absolute pointer-events-none"
                style={{
                  top: "-40px",
                  left: "50%",
                  transform: "translateX(-50%)",
                  width: "260px",
                  height: "160px",
                  background: "radial-gradient(ellipse at center, rgba(229,72,77,0.6) 0%, rgba(229,72,77,0) 70%)",
                }}
              />

              <button
                onClick={() => setShowDebug((s) => !s)}
                className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4 z-10"
                style={{ border: "1px solid #1E2430", color: "#5A6272" }}
              >
                DEBUG
              </button>
              {showDebug && (
                <div
                  className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
                  style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
                >
                  {!resetArmed ? (
                    <button
                      onClick={() => setResetArmed(true)}
                      className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                      style={{ border: "1px solid #E5484D", color: "#E5484D" }}
                    >
                      RESET ALL PROGRESS
                    </button>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                        Wipes save + all state. Confirm?
                      </span>
                      <div className="flex gap-1.5">
                        <button
                          onClick={debugReset}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{
                            border: "1px solid #E5484D",
                            backgroundColor: "#E5484D",
                            color: "#0B0D12",
                          }}
                        >
                          YES
                        </button>
                        <button
                          onClick={() => setResetArmed(false)}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                        >
                          CANCEL
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {emergencyPopupView === "quest" ? (
                <>
                  <div className="emergency-flash flex items-center gap-2 mb-3 relative z-10">
                    {/* Stationary siren/beacon — dome + base + light, not rotating. */}
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                      <path d="M12 4a6 6 0 0 1 6 6v4H6v-4a6 6 0 0 1 6-6z" fill="#E5484D" />
                      <rect x="4" y="14" width="16" height="3" rx="1" fill="#E5484D" />
                      <circle cx="12" cy="4" r="1.5" fill="#E5484D" />
                    </svg>
                    <span className="mono text-xs tracking-widest" style={{ color: "#E5484D" }}>
                      EMERGENCY QUEST
                      {activeEmergencyQuests.length > 1 ? ` (1 of ${activeEmergencyQuests.length})` : ""}
                    </span>
                  </div>

                  <div className="flex items-center gap-2 mb-2 relative z-10">
                    <span
                      className="mono text-[9px] tracking-widest px-1.5 py-0.5 rounded"
                      style={{ color: "#E5484D", border: "1px solid #E5484D" }}
                    >
                      {focusedEmergencyQuest.severity.toUpperCase()}
                    </span>
                    <span className="mono text-[10px] tracking-wide" style={{ color: domain.color }}>
                      {domain.label}
                    </span>
                  </div>

                  <div className="text-sm mb-4 relative z-10" style={{ color: "#EDEFF3" }}>
                    {focusedEmergencyQuest.label}
                  </div>

                  <div className="mono text-xs mb-4 relative z-10" style={{ color: "#E5484D" }}>
                    {formatCountdown(emergencyTimeLeft)} remaining — failure locks the app
                  </div>

                  <div className="mono text-[10px] mb-4 relative z-10" style={{ color: "#8B94A3" }}>
                    A failure results in a penalty. Penalty for incomplete daily tasks will stack.
                  </div>

                  <div className="flex gap-2 flex-wrap relative z-10">
                    <button
                      onClick={() => resolveEmergencyQuest(focusedEmergencyQuest)}
                      className="mono text-xs px-4 py-2 rounded transition"
                      style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                    >
                      RESOLVE

                    { domain: DOMAINS[1], severity: "moderate" },
                    { domain: DOMAINS[2], severity: "mild" },
                  ])
                }
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                3 Eligible (Mixed)
              </button>
              <button
                onClick={() =>
                  runUrgentTriggerSimulation(
                    "6 eligible (all severe)",
                    DOMAINS.map((d) => ({ domain: d, severity: "severe" }))
                  )
                }
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                6 Eligible (All Severe)
              </button>
            </div>

            {simResults && (
              <div className="mono text-[10px] text-[#D6DCE5] bg-[#0F1218] border border-[#1E2430] rounded px-3 py-2 space-y-1">
                <div className="text-[#8B94A3]">{simResults.scenarioLabel}</div>
                <div>
                  Fired: {simResults.firedCount}/{simResults.iterations} (
                  {((simResults.firedCount / simResults.iterations) * 100).toFixed(1)}% — target ~
                  {(URGENT_TRIGGER_CHANCE * 100).toFixed(0)}%)
                </div>
                {simResults.eligible.length > 0 && simResults.firedCount > 0 && (
                  <div className="pt-1 space-y-0.5">
                    {simResults.eligible.map((e) => {
                      const count = simResults.pickCounts[e.domain.key] || 0;
                      const totalWeight = simResults.eligible.reduce(
                        (sum, x) => sum + SEVERITY_WEIGHT[x.severity],
                        0
                      );
                      const expectedPct = ((SEVERITY_WEIGHT[e.severity] / totalWeight) * 100).toFixed(1);
                      const actualPct = ((count / simResults.firedCount) * 100).toFixed(1);
                      return (
                        <div key={e.domain.key} className="flex justify-between">
                          <span style={{ color: e.domain.color }}>
                            {e.domain.label} ({e.severity})
                          </span>
                          <span className="text-[#5A6272]">
                            {count} picks — {actualPct}% actual / {expectedPct}% expected
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* ============ VERSION / PATCH NOTES SECTION ============ */}
          <div className="mt-4 pt-3 border-t border-[#2A2010]">
            <div className="mono text-[10px] tracking-widest text-[#F2A93B] mb-2">
              VERSION / PATCH NOTES
            </div>
          </div>

          {/* Version Number & Patch Notes Display — queued feature, locked. Debug tab
              only, read-only. APP_VERSION is updated manually each build; PATCH_NOTES_TEXT
              is the full embedded patch-notes.md content (see constants near top of file).
              No changes here per the Debug Tab Overhaul spec — stays exactly as-is, not
              grouped into dropdown style like the other sections above. */}
          <div className="mt-2">
            <div className="mono text-[10px] text-[#8B94A3] mb-2">
              BUILD VERSION: <span style={{ color: "#3DDBD9" }}>{APP_VERSION}</span>
            </div>
            <div className="mono text-[10px] text-[#8B94A3] mb-2">PATCH NOTES</div>
            <pre
              className="mono text-[9px] text-[#D6DCE5] bg-[#0F1218] border border-[#1E2430] rounded px-3 py-2 whitespace-pre-wrap"
              style={{ maxHeight: "300px", overflowY: "auto" }}
            >
              {PATCH_NOTES_TEXT}
            </pre>
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<SystemEngine />);
} catch (err) {
  const diag = document.getElementById("diag");
  diag.style.display = "block";
  diag.textContent += "[render error] " + (err && err.message ? err.message : err) + "\n" + (err && err.stack ? err.stack : "") + "\n\n";
}
</script>

<!-- The app source above sits inert (type="text/plain") so the browser never tries to run
     it directly. We pull the text out, transform it ourselves with the CLASSIC JSX runtime
     explicitly forced — Babel's default "automatic" runtime injects a real `import` line
     into its output, which breaks when the transformed code is later appended as a plain
     script. This was the actual root cause of every "Cannot use import statement outside a
     module" error hit while getting this deployed — confirmed and fixed via this exact
     pattern in a minimal test file first. -->
<script>
  try {
    const source = document.getElementById("app-source").textContent;
    const output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    const script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  } catch (err) {
    const diag = document.getElementById("diag");
    diag.style.display = "block";
    diag.textContent += "[transform error] " + (err && err.message ? err.message : err) + "\n";
  }
</script>
</body>
</html>
