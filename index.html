<script>
  // Diagnostic error surface — if anything fails (Babel parse error, a runtime error in
  // the app, a failed CDN load), show it as visible text instead of a silent blank page.
  (function () {
    const diag = document.getElementById("diag");
    function showError(msg) {
      diag.style.display = "block";
      diag.textContent += msg + "\n\n";
    }
    window.addEventListener("error", function (e) {
      showError("[error] " + (e.message || e) + (e.filename ? "\n  at " + e.filename + ":" + e.lineno + ":" + e.colno : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showError("[unhandled promise rejection] " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // If nothing has rendered into #root after 6 seconds, say so explicitly rather than
    // leaving a blank screen with no clue anything went wrong.
    setTimeout(function () {
      const root = document.getElementById("root");
      if (root && root.children.length === 0 && diag.style.display === "none") {
        showError("[diagnostic] Nothing rendered into #root after 6s, and no JS error was caught either. Likely a CDN script (React/Babel/Tailwind) failed to load — check your connection or try reloading.");
      }
    }, 6000);
  })();
</script>

<script>
  // window.storage polyfill — the original app was built against Claude's artifact
  // persistence API, which doesn't exist in a normal browser. This mirrors the same
  // async, Promise-based shape using localStorage, so the app code needed zero changes.
  (function () {
    const PREFIX = "system-engine:";
    window.storage = {
      get: async (key) => {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw };
      },
      set: async (key, value) => {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      },
      delete: async (key) => {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith(PREFIX + (prefix || "")))
          .map((k) => k.slice(PREFIX.length));
        return { keys, prefix };
      },
    };
  })();
</script>

## v38 (TEMP DEBUG carried over — see note below)

**Dungeon Rework — Full Spec (Resolve-Based XP, Costs, Room Counts, Resolve
Pool)**
- **XP formula replaced.** The old flat \`Math.random()\` roll between a
  tier's min/max % is gone — XP is now \`pMin + (pMax-pMin) × resolvePercent\`,
  using the exact same entry-snapshotted resolve/resolveMax the Final Room
  Hearts bonus already reads (now also stored on \`activeDungeonRun\` as
  \`resolvePercentAtEntry\` so \`finishDungeonRun\` can read it later). Partial
  still applies its existing separate 0.5x on top. New tier ranges: Novice
  3–4% / Adept 6–9% / Elite 10–14% (down from 8–13/18–25/30–40, since the
  formula itself is no longer uniform-random).
- **Room cost constants retuned:** \`DUNGEON_ROOM_COST_FLOOR\` 5→10,
  \`DUNGEON_ROOM_COST_REDUCTION\` 1→0.5 per stat point,
  \`DUNGEON_QUALITY_COST_MULT\` {best:0.7, ok:1.0, worst:1.4} → {best:0.4,
  ok:1.3, worst:3.0}. BASE (15) and TIER_MULT unchanged.
- **Room count ranges widened ~20% (rounded up):** Novice [2,3]→[3,4], Adept
  [5,7]→[6,9], Elite [10,15]→[12,18].
- **Resolve pool formula changed — "dedication vs. breadth."**
  \`resolveMax\` was \`sum(all 6 domain stats) + level×2\`; it's now
  \`domainStats[relevantDomain] + level×2\` — no floor, no blending with the
  other 5 domains. A neglected domain now carries real risk into its own
  dungeon regardless of how strong the other domains are, matching the
  existing Neglect/Stagnation design language.
- Validated via the spec's own simulation summary across levels 15/30/70/100
  — Elite stays the genuine top challenge through the level cap (12–16%
  fail at 100, average clear resolve ~27–29%, below the 50% "mastery"
  threshold for full Hearts bonus) rather than trivializing early; Novice/
  Adept intentionally trivialize once leveled well past their "home" range.

**Encounter Choice System — Three-Option Mechanic**
- Every Encounter (Manual/Urgent/Main Quest) now presents 3 domain-flavored
  choices before resolving — Defensive/Aggressive/Balanced, same 3
  underlying mechanics across all 6 domains, only the label/flavor text
  differs per domain (full 18-line table implemented in
  \`ENCOUNTER_CHOICE_LABELS\`).
- Modifiers apply on top of the existing \`lossThreshold\`/\`winThreshold\`
  formula (stage1Bonus/stage2Bonus/equipmentEnchantBonus all still baked in
  first), immediately before the roll:
  - Defensive: \`lossThreshold -= min(15, stat×0.15)\`
  - Aggressive: \`winThreshold -= min(25, stat×0.25)\`; \`lossThreshold += 15\`;
    then if \`winThreshold < lossThreshold + 10\`, clamps
    \`lossThreshold = winThreshold - 10\` (protects the win-bonus, caps the
    flat risk instead of letting a low-stat pick invert the thresholds).
  - Balanced: \`scale = min(5, stat×0.05)\`; both thresholds move by
    \`-(5 + scale)\`.
- \`resolveEncounter\` takes a new \`opts.choice\` and \`engageEncounter\` now
  requires a choice argument (\`"defensive"|"aggressive"|"balanced"\`) rather
  than taking no arguments — the single ENGAGE button was replaced with 3
  stacked choice buttons (label + flavor text), DECLINE unchanged below
  them. The result screen now shows which stance was taken above the WIN/
  CLOSE CALL/LOSS line.
- **Flagging a balance observation, not a build discrepancy:** spot-checked
  the "no strict dominance except at stat=0" claim at stat=50 (no equipment
  bonus) — Defensive lands at Win 45% / Loss 17.5%, Balanced lands at Win

  weakly dominating Defensive at that stat value specifically. Built exactly
  to the given formulas either way (they're what's specified as "ready to

- \`DUNGEON_LOOTBOX_CHANCE\`: 0.15 → 1.0 — every Dungeon Complete now banks a
  Dungeon Lootbox (still Complete-only, not Partial/Fail).
- **Resolve-on-open, not resolve-on-Complete** (the dependency the spec
  flagged): a Complete now pushes an UNOPENED box into a new
  \`unopenedDungeonLootboxes\` array — each entry remembers its own
  \`domainKey\`/\`tierKey\`/\`gearChance\` — rather than immediately rolling and
  granting a gear item. Gear vs. Consumable is decided later, when the
  player actually opens it from Inventory.
- **Gear/Consumable split**, resolved at open time: 30% baseline resolves to
  gear via the existing \`DUNGEON_LOOTBOX_TIER_WEIGHTS\`/\`buildDungeonLootboxItem\`
  path (fully unchanged — Novice/Adept/Elite odds, Named-Elite-only all
  intact), 70% resolves to a Consumable Boost instead. Net gear-per-clear
  baseline is now 100% box × 30% gear = 30% (2x the old 15%), before any
  Drop Rate Boost.
- **12 new Consumable Boosts** (4 types × 3 tiers — Minor/Major/Superior):
  Tell Chance Boost (+15/+30/+50% Final Room tell reveal), Resolve Boost
  (+25/+50/+100% Resolve pool for that run), Hearts Boost (+1/+2/+3 flat
  Final Room hearts), Drop Rate Boost (30%→45/60/100% gear chance —
  self-referential, only affects the box from the run it's used on). All
  four are single-use, universal (any dungeon), and applied to exactly one
  upcoming run.
- **Application flow**: boosts are selected in the Dungeon Key confirmation
  screen (new \`dungeonBoostSelection\` state — one tier max per type,
  picking the same tier again deselects it), consumed atomically alongside
  the key spend on Confirm. \`startDungeonRun\` stores the run's selection on
  \`activeDungeonRun.boosts\`; Resolve Boost applies to \`resolveMax\` at entry,
  Tell Chance Boost adds into \`startDungeonFinalRoomRound\`'s tell calc
  alongside the existing equipment bonus (same 100% cap), Hearts Boost adds
  flat onto the Two-Pronged hearts total at Final Room entry, Drop Rate
  Boost is stored on that run's own banked box and overrides its
  \`gearChance\` at open time.
- **12-item weighted roll** within the 70% consumable slice (conditional,
  sums to 1.0 on its own): Minor 15% each / Major 7% each / Superior 3%
  each — matches spec exactly.
- Inventory: \`inventory.consumableBoosts\` (12 nested counters, 2-level-deep
  save/load migration so old saves don't lose individual counters).
- Debug tab: added "Dungeon Lootbox — Bank Unopened" to test the open flow
  without a full dungeon run, alongside the existing direct gear-roll
  debug buttons (left untouched — they still test the gear table directly).

**Consumable + Lootbox Usage — Confirmation + Amount Selector**
- Universal Confirm → Complete flow (same pattern as Gear/Key purchases)
  now applies to: Mystery Box, Dungeon Lootbox, HV Catalyst, Bonus Stat
  Point, and Teleport Stone. Each gets a quantity stepper capped at however
  many are owned (Teleport Stone additionally capped at the current
  \`penaltyQueue\` length, since using more than that has no effect).
- Consumables apply as N SEPARATE applications (e.g. 3x HV Catalyst = 3
  separate +2 HV grants); lootboxes resolve as N INDEPENDENT rolls, each
  against its own odds/table, never a single roll scaled up — verified for
  Mystery Box's Auto Level Up case specifically (multiple triggers in one
  batch now produce correctly-sequenced separate \`pendingLevelUps\` entries
  instead of a race).
- Mystery Box's single-roll logic was refactored into a pure
  \`rollMysteryBoxOnce()\` resolver + \`openMysteryBoxesBatch(qty)\`, and
  Dungeon Lootbox got the equivalent \`resolveDungeonLootboxBox()\` +

## v26

**XP Rebalance (Manual & Main)**
- Manual Quest completion: 30 XP (was flat 25).
- Main Quest completion: 150 XP (was flat 25) — a real milestone reward now,
  distinct from Manual's routine-level payout.

**Bug investigation — Manual Quest XP not granted (reported twice)**
- Traced the full \`completeManualQuest()\` → \`grantXp()\`/\`grantHV()\` call path.
  Found no early-return or guard that could skip XP while still posting the
  log line and removing the quest — the log write happens *after* \`grantXp\`
  in the code, so a thrown exception there would also have blocked the log,
  which wasn't observed.
- What I did find and fix: \`grantXp\`'s level-up math read the render-scoped
  \`level\` variable directly inside its \`setXp\` updater. Since
  \`completeManualQuest\` calls \`grantXp\` twice in the same synchronous handler
  (once directly, once via \`grantHV\`), both calls closed over the same stale
  \`level\` snapshot. Refactored to a \`useRef\`-backed running xp/level total
  that updates synchronously with each call, so multiple \`grantXp\` calls in
  one handler now correctly chain off each other's pending result instead of
  a shared stale closure.
- Also added a missing completion guard to \`completeManualQuest\` (it never
  had one, unlike \`completeMainQuest\`) as defensive hardening against a
  double-fire silently double-granting rewards.
- Not confirmed as the exact root cause without live reproduction, but a
  real correctness fix regardless.

**Main Quest Encounters (new, revised to 3x XP)**
- Main Quest completion now rolls for an Encounter using its own dedicated
  30% trigger rate (\`MAIN_QUEST_ENCOUNTER_CHANCE\`) — 3x the shared 10%
  \`ENCOUNTER_CHANCE\` used by Manual/Urgent, and checked directly in
  \`completeMainQuest()\` rather than through \`maybeRollEncounter()\`.
- Once triggered, resolves through the same \`resolveEncounter()\` as any
  other Encounter — no separate resolution logic. Added an \`isMainQuest\`
  flag param that scales rewards: Gold and Fatigue 2x, XP 3x (Win 25→75,
  Close Call 10→30, Loss XP unchanged at 0).
- Financial Win uses a new \`MAIN_QUEST_FINANCIAL_ITEM_POOL\`, derived
  programmatically from the base pool: Equipment Lootbox's weight doubles
  (10%→20%), pulled proportionally from the other four items rather than
  just added on top, so weights still sum to 1.0. Still item-only, no XP.
- Encounter modal shows a small "MAIN QUEST ENCOUNTER — 2x GOLD/FATIGUE, 3x
  XP" label when applicable.

**Version Number & Patch Notes Display**
- New read-only section at the bottom of the Debug tab: a static
  \`APP_VERSION\` line (updated manually each build) and the full patch notes
  content embedded in-app as \`PATCH_NOTES_TEXT\`, shown in a scrollable
  read-only block. Needs to be manually kept in sync with this file on every
  future version.

## v25

**Debug Lootbox Triggers**
- Four new Debug tab buttons, each forcing exactly one on-demand roll:
  1. Mystery Box — forces a guaranteed grant (bypasses the normal chance gate).
  2. Equipment Lootbox — forces a guaranteed roll (normal tier-weighted odds for
     which item comes out).
  3. Dungeon-Specific Lootbox — uses the existing domain selector from the
     Level/Stat debug tool; rolls that dungeon's table using Elite odds
     (35% T1 / 45% T2 / 15% T3 / 5% Named).
  4. Named Drop (dedicated) — same domain selector, forces a guaranteed
     Named-tier item from that dungeon's fixed slot.
- Under the hood: split \`maybeGrantMysteryBox\`/\`maybeGrantEquipmentDrop\` into
  a probability gate + a separate grant function, so Debug can call the grant
  directly without duplicating logic. Refactored \`rollDungeonLootbox\` to
  share a \`buildDungeonLootboxItem\` helper with the new forced-Named path.

**Hide HV Display Line — Quest Completion Popup**
- Removed "+1 HV" from the Manual Quest completion popup.
- Checked Main Quest as flagged open — it had the same issue ("+3 HV"),
  fixed there too. The underlying \`grantHV()\` calls are unaffected; only the
  popup's visible reward line changed. Urgent Quest was unaffected (its
  popup shows a stat point, not an HV line, so nothing there needed fixing).

**Sell Option**
- New Confirm → Complete sell flow in the Gear tab (name, tier, bonus %,
  sell price shown before confirming). Sell price is 50% of a reference
  value — T1/T2 use their real Shop price; T3/Named have no real purchase
  price to derive from (never sold), so their reference values are a
  flagged first-pass extrapolation.
- Equipped gear cannot be sold — the Sell button is only shown on
  unequipped owned items, matching "must unequip first."

**Gear Card Display Redo**
- The Gear tab's owned-item cards now show the full structured template:
  Primary line, Secondary line (T3/Named only), and 0–2 Enchant lines,
  omitting any line that doesn't apply rather than showing it blank.
- No domain labels anywhere in the card (there never were any, post the
  domain-agnostic rework, but confirmed explicitly here).

**Armor Protection Chance**
- Replaces Armor's old T3+ secondary (the generic Resolve-cost cut) —
  Armor's Secondary slot is now Protection Chance instead: T3 10%, Named
  20%, checked per hit in the Final Room. On proc, fully negates that hit's
  heart loss; a "Your armor absorbed the hit" message shows in the round
  result. Weapon and Trinket secondaries are unchanged (still the T3-only
  Resolve-cost cut, Armor-only change).
- As part of this, discovered Named items are actually supposed to carry
  enchants (guaranteed 1st + 15% chance at a 2nd, different-type enchant) —
  this supersedes the "Named never enchants" assumption from the v23
  Dungeon Lootbox build. Migrated the whole enchant system from a single
  \`item.enchant\` field to an \`item.enchants\` array to support up to 2.
  Named enchant magnitudes weren't specified in the queue message, so
  they're a flagged first-pass extrapolation (~1.5x the T3 values).

## v24

**Shop Purchase Confirmation + Completion Flow**
- Tapping a Shop gear item no longer buys it immediately. It now opens a
  Confirmation step showing the item name, tier, exact pre-rolled bonus %,
  and Gold cost, with CONFIRM / CANCEL buttons. Cancel returns to the shop
  with zero changes.
- On Confirm, the purchase executes (gold deducted, item added) and a
  Completion screen acknowledges it before returning to the shop.

**Tier Gating fix — Shop daily rotation**
- Found and fixed a real gap: the Shop's daily gear listing was rolling T1/T2
  at a flat 60/40 split regardless of player level, even though *equipping*
  T2 was already correctly gated at Level 20. A sub-20 player could see and
  buy T2 gear in the shop, just couldn't wear it yet.
- Fixed: the daily roll now forces every slot to T1 until the player reaches
  the level required to equip T2 (\`EQUIPMENT_EQUIP_LEVEL_REQ.t2\`); T2 only
  enters the rotation's normal 60/40 odds once that level is hit.
- T3 doesn't currently roll into Shop stock at all (no T3 shop tier exists
  yet — it's drop/Lootbox-only), so there's nothing to gate there yet. Left a
  comment marking exactly where to extend the same check if T3 is ever added
  to the shop rotation.

## v21

**XP Rebalance**
- Manual / Main / Urgent quest completion XP unified to a flat 25 (previously
  10 / 60 / 15).
- New Encounter XP layer: Win 25 / Close Call 10 / Loss 0. Financial Win is
  excluded (item-only, no XP); Financial's own Close Call/Loss still get XP
  normally.

**Financial Encounter Win rework**
- Item pool changed from uniform-random to weighted: HV Catalyst 35%, Bonus
  Stat Point 20%, XP Booster 20%, Hairstyle Change 15%, Equipment Lootbox 10%.
- Teleportation Stone removed from this pool.
- New **Equipment Lootbox** reward (Financial Win only) — its own dedicated
  tier table (T1 55% / T2 40% / T3 5%), separate from the quest-drop tier
  weights, feeding the same item-creation pipeline.

**Boss Tell System**
- Removed the explicit "You sense they're about to use: HEAVY/FAST/COUNTER"
  callout. The vague/atmospheric cue line is now the only signal the player
  gets. Tier-based cue visibility (Novice 1 line / Adept 2 / Elite 3)
  unchanged.

**Shop/Gear Merge (final)**
- Gear Shop purchasing merged into the main Shop tab; Gear tab is now
  view/equip-only.
- Shop shows exactly ONE pre-rolled item per slot (Weapon/Armor/Trinket) at a
  time — name, tier, and exact bonus % fixed and visible before buying.
- Shop listing rerolls once per real day, on the same daily-reset boundary as
  the Daily Quest/Fatigue cycle.
- Level gating moved from **purchase time** to **equip time** — a player can
  now own gear above their level, they just can't wear it yet.

// uniform-random draft): weights replace the flat 20% each; Teleportation Stone is
// dropped from this pool entirely; Equipment Lootbox is new — see
// rollEquipmentLootbox() below for what that actually generates. Weights sum to 1.0.
// Validated via a 100-roll sim: 55/40/5 target vs 54/41/5 observed (see queued spec).
const ENCOUNTER_ITEM_POOL = [
  { field: "hvCatalysts", label: "HV Catalyst", weight: 0.35 },
  { field: "bonusStatPoints", label: "Bonus Stat Point", weight: 0.20 },
  // XP Booster split (v39) — old flat 20% xpBoosters entry replaced by two tiers,
  // 14%/6% (7:3 ratio), summing to the same 20% the single item used to occupy.
  { field: "xpBoosterSmall", label: "XP Booster (Small)", weight: 0.14 },
  { field: "xpBoosterLarge", label: "XP Booster (Large)", weight: 0.06 },

  { field: "equipmentLootbox", label: "Equipment Lootbox", weight: 0.10 },
];

// Main Quest Encounter's own Financial-Win pool — same 6 items (was 5 before the v39
// XP Booster split), Equipment Lootbox's weight boosted from the base pool's 10% up
// to 25% (was 20% before that batch — see patch notes). The +5pt bump from 20%->25%
// comes entirely out of HV Catalyst rather than proportionally from all remaining
// items, which is an intentional break from this pool's originally fully-programmatic
// "no drift" design: HV Catalyst's weight below is computed from its old proportional
// share (what it was at boostedWeight=0.20, i.e. 0.3111) minus the flat 0.05 that
// moved to Equipment Lootbox. Bonus Stat Point / XP Booster (both tiers) / Hairstyle
// Change still derive proportionally from ENCOUNTER_ITEM_POOL exactly as before —
// confirmed numerically that the v39 split lands at the queued spec's flagged
// assumption exactly (Small 12.44%, Large 5.33%, 7:3 ratio preserved) — only HV
// Catalyst is a hardcoded override.
const MAIN_QUEST_FINANCIAL_ITEM_POOL = (() => {
  const boostedWeight = 0.25;
  const others = ENCOUNTER_ITEM_POOL.filter(
    (e) => e.field !== "equipmentLootbox" && e.field !== "hvCatalysts"
  );
  const hvBase = ENCOUNTER_ITEM_POOL.find((e) => e.field === "hvCatalysts");
  const oldScale = 0.8 / 0.9; // the scale factor this pool used before this batch (boostedWeight was 0.20)
  const hvCatalystWeight = hvBase.weight * oldScale - 0.05; // 0.3111 -> 0.2611
  const othersOriginalSum = others.reduce((sum, e) => sum + e.weight, 0);
  const scale = (1 - boostedWeight - hvCatalystWeight) / othersOriginalSum;
  return [
    { field: "hvCatalysts", label: "HV Catalyst", weight: hvCatalystWeight },
    ...others.map((e) => ({ ...e, weight: e.weight * scale })),
    { field: "equipmentLootbox", label: "Equipment Lootbox", weight: boostedWeight },
  ];
})();

// ============================================================================
// ONESIGNAL PUSH NOTIFICATIONS — Settings toggle + Daily Quest tag (queued spec).
// The SDK loads async via a <script defer> tag in <head> and queues init through
// window.OneSignalDeferred; that init block is untouched by this feature. Since app
// code can run before the SDK has finished loading, every call here goes through
// oneSignalCall, which either runs immediately (SDK already ready) or queues onto
// the SAME OneSignalDeferred array the init script uses, so it always eventually
// fires once in order, regardless of load timing.
// ============================================================================
function oneSignalCall(fn) {
  if (window.OneSignal && window.OneSignal.User) {
    fn(window.OneSignal);
  } else if (window.OneSignalDeferred) {
    window.OneSignalDeferred.push(fn);
  }
}

// Daily Quest completion tag — string "true"/"false" per spec (not a real boolean).
// Set to "true" at the same point the app detects all Daily Quests done for the day
// (completeQuest); set to "false" at the existing daily rollover point (the
// dailyQuestDeadline effect), regardless of whether that rollover was a clean
// completion or a penalty. All scheduling/message logic lives in the OneSignal
// dashboard — nothing here decides WHEN to actually send anything.
function setDailyQuestsDoneTag(done) {
  oneSignalCall((OneSignal) => {
    OneSignal.User.addTag("dailyQuestsDoneToday", done ? "true" : "false");
  });
}

function pickWeighted(pool) {
  const r = Math.random();
  let cumulative = 0;
  for (const entry of pool) {
    cumulative += entry.weight;
    if (r < cumulative) return entry;
  }
  return pool[pool.length - 1]; // floating-point safety net, should be unreachable
}

// Final Room hearts — Two-Pronged Bonus System (settled 2026-09-05, supersedes the
// earlier "Round Ward" / flat-3 approach). Base is flat 3 across all tiers; total
// hearts are computed once, at Final Room entry, from two independent bonuses:
//   1. Equipment tier bonus — Armor slot only. +1/+2/+3 hearts for T1/T2/T3 Armor
//      equipped. Enchantments may alter this later (not yet designed).
//   2. Resolve-efficiency bonus — a reward for being appropriately geared/leveled,
//      not a survival safety net. Calculated off % of resolveMax remaining at the
//      moment the Final Room is entered, applied to (base + gear) and rounded up:
//        50-100% Resolve left -> +50% of (base+gear)
//        25-50%  Resolve left -> +25% of (base+gear)
//        <25%    Resolve left -> +0
//      Running low on Resolve means the dungeon was above the player's current
//      preparation, so a reduced/missing bonus is a direct consequence, not a
//      punishment layered on top. Example: T3 gear + 80% Resolve left -> 3+3=6,
//      +50% (3) = 9 hearts. No gear + <25% Resolve left -> 3+0+0 = 3 (old baseline).
const DUNGEON_PLAYER_HEARTS = 3; // base, before either bonus
const DUNGEON_ARMOR_HEART_BONUS = { none: 0, t1: 1, t2: 2, t3: 3, named: 4 }; // named added for Dungeon Lootbox

// Computes total Final Room hearts at the moment of entry. resolvePercent is the
// run's resolve/resolveMax ratio AT ENTRY (captured once, not re-checked per round —
// per design, this is a one-time snapshot reward, not a live-updating buff). armorTier
// is read by the caller (inside the component, where `equipment` state lives) and
// passed in as "none"/"t1"/"t2"/"t3".
function dungeonComputeFinalRoomHearts(armorTier, resolvePercent) {
  const gearBonus = DUNGEON_ARMOR_HEART_BONUS[armorTier] || 0;
  const subtotal = DUNGEON_PLAYER_HEARTS + gearBonus;
  let resolveBonus = 0;
  if (resolvePercent >= 0.5) {
    resolveBonus = Math.ceil(subtotal * 0.5);
  } else if (resolvePercent >= 0.25) {
    resolveBonus = Math.ceil(subtotal * 0.25);
  }
  return subtotal + resolveBonus;
}

// Gear/Consumable split — resolved at OPEN time (not Complete time). 30% baseline

// consumable, if applied to a specific run before it starts, overrides this baseline
// for that run's own box only — see dungeonBoostSelection / CONSUMABLE_BOOST_EFFECTS.
const DUNGEON_LOOTBOX_GEAR_CHANCE = 0.30;
const DUNGEON_LOOTBOX_TIER_WEIGHTS = {

// Weapon/Trinket primary stat roll range — slightly stronger than the Shop/Quest-drop

// Fixed item pool — 18 normal items (3 tiers x 3 slots x 6 dungeons) + 6 Named items

// Keyed by domain (matches each dungeon's existing domainKey). Slot arrays are

const DUNGEON_LOOTBOX_TIER_INDEX = { t1: 0, t2: 1, t3: 2 };

// Builds one Dungeon Lootbox item for a given domain + already-resolved tier. Shared
// by the normal weighted roll (rollDungeonLootbox) and the forced-Named debug/roll
// path (rollDungeonNamedItem) so both stay in sync automatically.
function buildDungeonLootboxItem(domainKey, tier) {
  const pool = DUNGEON_LOOTBOX_ITEMS[domainKey];
  let slot, name;
  if (tier === "named") {
    slot = pool.namedSlot;
    name = pool.namedName;
  } else {
    slot = EQUIPMENT_SLOTS[Math.floor(Math.random() * EQUIPMENT_SLOTS.length)];
    name = pool[slot][DUNGEON_LOOTBOX_TIER_INDEX[tier]];
  }
  const item = {
    id: equipmentNextId(),
    slot,
    tier,
    name,
    enchants: tier === "named" ? rollNamedEnchants() : [],
  };
  if (slot === "weapon" || slot === "trinket") {
    const [min, max] = DUNGEON_LOOTBOX_BONUS_RANGE[tier];
    item.bonus = min + Math.random() * (max - min);
  }
  return item;
}

// Rolls one Dungeon Lootbox item for a completed run. Quality tier comes from
// DUNGEON_LOOTBOX_TIER_WEIGHTS[dungeonTierKey]; Named (when rolled, Elite-only)
// uses that dungeon's fixed namedSlot instead of an equal-chance slot roll —
// "SLOT RESOLUTION (non-Named): equal-chance roll across Weapon/Armor/Trinket"
// only applies to t1/t2/t3.
function rollDungeonLootbox(domainKey, dungeonTierKey) {
  const tier = pickWeighted(DUNGEON_LOOTBOX_TIER_WEIGHTS[dungeonTierKey]).tier;
  return buildDungeonLootboxItem(domainKey, tier);
}

// Debug-only: forces a guaranteed Named-tier item from a dungeon's fixed slot,
// bypassing the tier-weighted roll entirely (Named Drop debug button).
function rollDungeonNamedItem(domainKey) {
  return buildDungeonLootboxItem(domainKey, "named");
}

// ============================================================================
// CONSUMABLE BOOSTS — 12 items (4 types × 3 tiers), the 70% non-gear slice of an
// opened Dungeon Lootbox (see DUNGEON_LOOTBOX_GEAR_CHANCE above). Single-use,
// universal (usable in any dungeon regardless of which dungeon dropped them), and
// applied to exactly one upcoming dungeon run — selected in the Dungeon Key
// confirmation screen (dungeonBoostSelection), not from a generic "use anytime"
// Inventory action, since their effect only means something in the context of a
// specific run. See patch notes for why this is a deliberate scope boundary against
// the otherwise-universal Confirm+Amount flow the rest of this batch adds.
// ============================================================================
const CONSUMABLE_BOOST_TYPES = [
  { key: "tellChance", label: "Tell Chance Boost" },
  { key: "resolve", label: "Resolve Boost" },
  { key: "hearts", label: "Hearts Boost" },
  { key: "dropRate", label: "Drop Rate Boost" },
];
const CONSUMABLE_BOOST_TIERS = ["minor", "major", "superior"];
const CONSUMABLE_BOOST_TIER_LABELS = { minor: "Minor", major: "Major", superior: "Superior" };
// tellChance: flat percentage points added onto that run's Final Room tell reveal
// chance (same 0-100 scale startDungeonFinalRoomRound already works in).
// resolve: fractional increase applied to that run's resolveMax at Dungeon entry.
// hearts: flat bonus hearts added on top of the existing Two-Pronged total.
// dropRate: REPLACES (not adds to) DUNGEON_LOOTBOX_GEAR_CHANCE for that run's own box.
const CONSUMABLE_BOOST_EFFECTS = {
  tellChance: { minor: 15, major: 30, superior: 50 },
  resolve: { minor: 0.25, major: 0.5, superior: 1.0 },
  hearts: { minor: 1, major: 2, superior: 3 },
  dropRate: { minor: 0.45, major: 0.6, superior: 1.0 },
};
// Conditional weights WITHIN the 70% consumable slice (i.e. given the open already
// resolved to "consumable" against DUNGEON_LOOTBOX_GEAR_CHANCE) — these 12 sum to 1.0
// on their own. Minor 15% each / Major 7% each / Superior 3% each, per spec.
const CONSUMABLE_BOOST_ROLL_POOL = CONSUMABLE_BOOST_TYPES.flatMap((t) => [
  { type: t.key, tier: "minor", weight: 0.15 },
  { type: t.key, tier: "major", weight: 0.07 },
  { type: t.key, tier: "superior", weight: 0.03 },
]);
function consumableBoostLabel(type, tier) {
  const typeLabel = CONSUMABLE_BOOST_TYPES.find((t) => t.key === type).label;
  return `${CONSUMABLE_BOOST_TIER_LABELS[tier]} ${typeLabel}`;
}
function defaultConsumableBoosts() {
  return Object.fromEntries(
    CONSUMABLE_BOOST_TYPES.map((t) => [t.key, { minor: 0, major: 0, superior: 0 }])
  );
}
let dungeonLootboxIdCounter = 0;
function dungeonLootboxNextId() {
  dungeonLootboxIdCounter += 1;
  return `dlb_${Date.now()}_${dungeonLootboxIdCounter}`;
}

// ============================================================================
// EQUIPMENT SYSTEM — settled design, first build pass (2026-09-05), revised
// 2026-09-05 (twice) to: (1) make every effect domain-agnostic — gear boosts
// its stat in ANY dungeon, not one fixed domain; (2) merge purchasing into the
// main Shop (Gear tab is now view/equip-only, no buying there); (3) replace
// fixed per-tier bonus magnitudes with a RANDOMIZED roll, independently per
// item, at the moment it's acquired (bought or dropped) — so two purchases of
// the same named T1 item can come out meaningfully different. 3 slots
// (weapon/armor/trinket), 3 tiers each (t1/t2/t3), each slot still carries a
// DISTINCT effect type:
//   Weapon  -> reduces Resolve cost, universally, in any Dungeon.
//   Armor   -> Final Room player hearts (see DUNGEON_ARMOR_HEART_BONUS above).
//              NOTE/ASSUMPTION: hearts stay the original FLAT +1/+2/+3 per
//              tier, NOT a randomized roll — hearts are small whole numbers
//              (base is only 3), so a 5-20% roll doesn't translate cleanly the
//              way it does for Weapon/Trinket's already-percentage effects.
//              Flag if you actually want Armor's heart bonus randomized too;
//              this was a judgment call to avoid quietly reworking the
//              already-locked Two-Pronged Hearts formula.
//   Trinket -> flat Tell Chance bonus (randomized roll), applied AFTER the
//              tier cap/multiplier so it can push Elite past its permanent
//              35% ceiling.
// T1/T2 are single-effect (their slot's primary only, randomized). T3 carries
// that same primary (large, randomized) PLUS a small FIXED secondary
// Resolve-cost reduction (universal, not itself randomized — the queued spec
// only described randomizing the slot's own primary stat). Quest-dropped T2/T3
// items also get a chance to roll one "enchant" from a shared exotic bonus
// pool — a placeholder/preview mechanic seeded from this, ahead of the real
// future Enchanting system (still idea-stage, unbuilt, and per the merge spec,
// still the only thing that will eventually carry domain flavor).
// Exactly ONE item may be equipped per slot at a time — equipping a new item
// replaces whatever was there, it never stacks two items in the same slot.
// Effects from the 3 DIFFERENT equipped slots (Weapon+Armor+Trinket) do
// combine simultaneously — that's 3 separate pieces of gear, not stacking.
// ============================================================================
const EQUIPMENT_SLOTS = ["weapon", "armor", "trinket"];
const EQUIPMENT_TIERS = ["t1", "t2", "t3"];
const EQUIPMENT_TIER_LABEL = { t1: "T1", t2: "T2", t3: "T3" };

// Randomized primary-bonus roll range per tier (locked naming conventions pass,
// 2026-09-05). Rolled fresh per item at acquisition (purchase or drop) — this
// replaces the old fixed EQUIPMENT_WEAPON_REDUCTION/EQUIPMENT_TRINKET_BONUS
// tables. Applies to Weapon (Resolve-cost reduction) and Trinket (Tell Chance
// bonus) — see the Armor note above for why hearts are excluded from the roll.
// Epic tier intentionally absent — TBD later, blocked on epic dungeon content.
const EQUIPMENT_BONUS_RANGE = { t1: [0.05, 0.09], t2: [0.10, 0.14], t3: [0.15, 0.20] };
function equipmentRollBonus(tier) {
  const [min, max] = EQUIPMENT_BONUS_RANGE[tier];
  return min + Math.random() * (max - min);
}

// T3-only secondary Resolve-cost reduction (universal, not domain-targeted, and
// NOT itself randomized — fixed, same as before this pass). Same magnitude
// regardless of slot (Weapon/Armor/Trinket) per the settled table.
// ARMOR EXCEPTION (added per queue): Armor no longer uses this at all — its
// Secondary slot is Protection Chance instead (see EQUIPMENT_ARMOR_PROTECTION_CHANCE
// below). This constant now only ever applies to Weapon/Trinket T3 items.
const EQUIPMENT_T3_SECONDARY_REDUCTION = 0.05;

// Armor's Secondary-slot effect, replacing the generic Resolve-cost reduction above
// (Armor-only — Weapon/Trinket secondaries are unchanged). Flat values, not rolled
// ranges. On proc, fully negates the heart loss for that hit — checked per hit in
// the Final Room round-resolution, not a flat damage-reduction percentage.
const EQUIPMENT_ARMOR_PROTECTION_CHANCE = { t3: 0.10, named: 0.20 };

// Naming conventions (locked 2026-09-05) — a few named items per slot per tier,
// pairing a tier-appropriate material with a slot-appropriate noun. Purely
// flavor text: two purchases of the same name still roll independently within
// EQUIPMENT_BONUS_RANGE, so buying the same name twice is a legitimate
// "reroll" rather than a wasted duplicate. Item count kept at 3 per slot per
// tier for now (matches "keep current count, expand later" from the queued
// spec) — T3 needs names too even though it's quest-loot only, for the drop
// popup/label. Domain flavor is explicitly NOT part of naming — per the merge
// spec, only future Enchantments will carry domain flavor.
const EQUIPMENT_NAMES = {
  t1: {
    weapon: ["Iron Sword", "Wooden Rod", "Chain Spear"],
    armor: ["Iron Armor", "Leather Armor", "Chain Armor"],
    trinket: ["Iron Charm", "Wooden Talisman", "Leather Ring"],
  },
  t2: {
    weapon: ["Steel Sword", "Ornate Rod", "Reinforced Spear"],
    armor: ["Steel Armor", "Ornate Armor", "Reinforced Armor"],
    trinket: ["Steel Charm", "Ornate Talisman", "Reinforced Ring"],
  },
  t3: {
    weapon: ["Titanium Sword", "Platinum Rod", "Elderwood Spear"],
    armor: ["Titanium Armor", "Platinum Armor", "Elderwood Armor"],
    trinket: ["Titanium Charm", "Platinum Talisman", "Elderwood Ring"],
  },
};

// Exotic bonus pool — rolled only on quest-dropped T2 (40% chance) or T3 (65%
// chance) items, magnitude scaling with which tier rolled it. First-pass numbers,
// same caveat as everything else here: needs real play data to tune.
// Named-tier (T4) magnitudes ADDED per the Debug Lootbox Triggers queue, which
// clarified that Named items DO get enchants after all (superseding the earlier
// "Named never enchants" assumption from the Dungeon Lootbox build): guaranteed
// 1st enchant + 15% chance at a 2nd, distinct type (see rollNamedEnchants below).
// The "named" column here wasn't specified in that queue message — extrapolated
// as roughly the same step-up from T3 that T3 was from T2 (~1.5x), flagged as an
// assumption pending confirmation, same as everything else marked first-pass.
const EQUIPMENT_ENCHANT_TYPES = ["encounterWinRate", "mysteryBoxRate", "xpGain", "hvGain"];
const EQUIPMENT_ENCHANT_MAGNITUDE = {
  encounterWinRate: { t2: -3, t3: -6, named: -9 }, // subtracted from Encounter winThreshold
  mysteryBoxRate: { t2: 0.03, t3: 0.06, named: 0.09 }, // added to QUEST_COMPLETION_BOX_CHANCE
  xpGain: { t2: 0.08, t3: 0.15, named: 0.22 }, // multiplier on grantXp
  hvGain: { t2: 0.08, t3: 0.15, named: 0.22 }, // multiplier on grantHV's HV amount
};
const EQUIPMENT_ENCHANT_ROLL_CHANCE = { t2: 0.40, t3: 0.65 };
const NAMED_SECOND_ENCHANT_CHANCE = 0.15;

// Named items always get exactly one enchant, plus a 15% chance at a second,
// DIFFERENT-type enchant (never the same type twice on one item — an assumption
// to avoid a visually redundant "double XP Gain" line; spec didn't say either way).
function rollNamedEnchants() {
  const type1 = EQUIPMENT_ENCHANT_TYPES[Math.floor(Math.random() * EQUIPMENT_ENCHANT_TYPES.length)];
  const enchants = [{ type: type1, magnitude: EQUIPMENT_ENCHANT_MAGNITUDE[type1].named, tier: "named" }];
  if (Math.random() < NAMED_SECOND_ENCHANT_CHANCE) {
    const remaining = EQUIPMENT_ENCHANT_TYPES.filter((t) => t !== type1);
    const type2 = remaining[Math.floor(Math.random() * remaining.length)];
    enchants.push({ type: type2, magnitude: EQUIPMENT_ENCHANT_MAGNITUDE[type2].named, tier: "named" });
  }
  return enchants;
}

// Quest-drop mechanic — separate roll from the enchant roll above. First a quest
// completion has this flat chance to drop ANY equipment at all; if it does, tier
// is weighted so T3 stays meaningfully rarer than T2 (matches "T3 quest-loot
// only, always rare" framing from the design chat). Settled at "moderate" per
// your call — first-pass number, easy to retune once you're seeing real frequency.
const EQUIPMENT_QUEST_DROP_CHANCE = 0.12;
const EQUIPMENT_DROP_TIER_WEIGHTS = { t2: 0.75, t3: 0.25 };

// Gear purchasing — merged into the main Shop (2026-09-05), then reworked again same
// day per the FINAL queued spec: the Shop no longer offers every name/tier at once.
// Instead it shows exactly ONE pre-rolled item per slot (weapon/armor/trinket) — name,
// tier, and exact bonus % all fixed and visible before buying — that rerolls once per
// day on the same real-midnight boundary the Daily Quest/Fatigue cycle already uses
// (see rollShopGearStock and the dailyQuestDeadline effect below). T3 never appears in
// shop stock — quest/lootbox drops only. Priced relative to that tier's own typical
// Dungeon gold reward (T1 ~= 1 Novice clear, T2 ~= 1 Adept clear).
// ASSUMPTION flagged: the spec didn't give a T1/T2 mix for the daily shop roll (unlike
// Equipment Lootbox's explicit 55/40/5) — went with 60/40 T1/T2 as a reasonable
// first-pass split, easy to retune.
const EQUIPMENT_SHOP_COST = { t1: 150, t2: 500 };
// Sell reference value — 50% of this is the actual sell price (Sell Option queue).
// T1/T2 reuse their real Shop price directly. T3/Named are never sold in the Shop at
// all, so they have no real purchase price to derive from — extrapolated here
// following the same ~3.3x-per-tier jump T1->T2 already uses, flagged as a first-pass
// assumption like everything else in this category. Applies regardless of how the
// item was actually acquired (bought, quest-dropped, or a Lootbox) — sell value is a
// function of tier only, not acquisition history, which nothing in this codebase
// tracks per-item anyway.
const EQUIPMENT_SELL_REFERENCE_VALUE = { t1: 150, t2: 500, t3: 1500, named: 5000 };
const EQUIPMENT_SELL_PERCENT = 0.5;
const SHOP_GEAR_TIER_WEIGHTS = [
  { tier: "t1", weight: 0.6 },
  { tier: "t2", weight: 0.4 },
];

// Level gating now applies to EQUIPPING, not acquiring — a low-level player can buy or
// drop a higher tier than they can use yet, they just can't equip it until they hit the
// requirement. Extended to cover T3 too (Elite's own gate), since drops/lootboxes can
// hand out T3 at any level. Replaces the old EQUIPMENT_SHOP_LEVEL_REQ, which only ever
// gated buying and only covered T1/T2.
const EQUIPMENT_EQUIP_LEVEL_REQ = { t1: 5, t2: 20, t3: 50, named: 50 }; // named matches Elite's own gate, since it's Elite-exclusive to drop in the first place

let equipmentIdCounter = 0;
function equipmentNextId() {
  equipmentIdCounter += 1;
  return `eq_${Date.now()}_${equipmentIdCounter}`;
}

// Builds one concrete item instance. `name` is a flavor label from
// EQUIPMENT_NAMES (or a fallback generic label for safety). Weapon/Trinket
// items get a freshly-rolled `bonus` (fraction) from EQUIPMENT_BONUS_RANGE;
// Armor doesn't carry a `bonus` field since its hearts value is read straight
// from DUNGEON_ARMOR_HEART_BONUS[tier] wherever it's needed (see note above).
// `enchants` is always an array (0, 1, or 2 entries) — see rollNamedEnchants
// for the only path that ever produces 2.
function equipmentCreateItem(slot, tier, name, opts) {
  opts = opts || {};
  const item = {
    id: equipmentNextId(),
    slot,
    tier,
    name: name || `${EQUIPMENT_TIER_LABEL[tier]} ${slot}`,
    enchants: opts.enchants || [],
  };
  if (slot === "weapon" || slot === "trinket") item.bonus = equipmentRollBonus(tier);
  return item;
}

// Rolls a fresh enchant for a quest-dropped T2/T3 item, per EQUIPMENT_ENCHANT_ROLL_CHANCE.
// Returns null if the roll fails (most of the time for T2, still over a third of the
// time for T3) — a quest-dropped item without an enchant is the common case, not a bug.
// (Named items use the separate rollNamedEnchants — guaranteed 1st + 15% 2nd — not this.)
function equipmentRollEnchant(tier) {
  if (tier === "t1") return null;
  if (Math.random() >= EQUIPMENT_ENCHANT_ROLL_CHANCE[tier]) return null;
  const type = EQUIPMENT_ENCHANT_TYPES[Math.floor(Math.random() * EQUIPMENT_ENCHANT_TYPES.length)];
  return { type, magnitude: EQUIPMENT_ENCHANT_MAGNITUDE[type][tier], tier };
}

// Generates one Equipment Lootbox item — a Financial-Encounter-Win-only reward.
// Uses EQUIPMENT_LOOTBOX_TIER_WEIGHTS (NOT EQUIPMENT_DROP_TIER_WEIGHTS, which is the
// separate quest-completion drop table), then feeds the same downstream pipeline as
// every other equipment source: random slot, that tier's name pool, a fresh rolled
// bonus (equipmentCreateItem), and the same enchant-roll odds (equipmentRollEnchant).
function rollEquipmentLootbox() {
  const tier = pickWeighted(EQUIPMENT_LOOTBOX_TIER_WEIGHTS).tier;
  const slot = EQUIPMENT_SLOTS[Math.floor(Math.random() * EQUIPMENT_SLOTS.length)];
  const namePool = EQUIPMENT_NAMES[tier][slot];
  const name = namePool[Math.floor(Math.random() * namePool.length)];
  const enchant = equipmentRollEnchant(tier);
  return equipmentCreateItem(slot, tier, name, { enchants: enchant ? [enchant] : [] });
}
// Single-box pure resolver — no domain/tier context needed (unlike Dungeon Lootbox),
// since rollEquipmentLootbox is a flat weighted tier + random slot roll. Kept as its
// own thin wrapper (rather than calling rollEquipmentLootbox directly at the batch
// call site) purely for naming symmetry with resolveDungeonLootboxBox.
function resolveEquipmentLootboxBox() {
  const item = rollEquipmentLootbox();
  return { item, logLine: `Equipment Lootbox — ${equipmentItemLabel(item)}.` };
}

// Rolls today's Shop gear stock — one pre-rolled item per slot, name+tier+bonus all
// fixed for the whole day. Called on load (if no stock yet) and on the same real-
// midnight boundary the Daily Quest/Fatigue cycle uses (see the dailyQuestDeadline
// effect). Shop items never carry an enchant — that's a drop/lootbox-only rarity.
// TIER GATING (added per queue): T2 can't roll into the daily stock at all until the
// player has reached the level required to EQUIP T2 gear (EQUIPMENT_EQUIP_LEVEL_REQ.t2)
// — below that, every slot is forced to T1 instead of using the normal 60/40 weights.
// This was previously missing entirely (stock rolled T1/T2 regardless of level); the
// existing equip-time gate meant a low-level player could buy T2 they couldn't wear
// yet, but the SHOP LISTING itself wasn't gated. T3 never rolls into shop stock at
// all currently (no T3 shop tier weight exists), so there's nothing to gate there yet
// — extend this same `playerLevel <` check against EQUIPMENT_EQUIP_LEVEL_REQ.t3 if/when
// T3 ever gets added to SHOP_GEAR_TIER_WEIGHTS.
function rollShopGearStock(playerLevel) {
  const canRollT2 = playerLevel >= EQUIPMENT_EQUIP_LEVEL_REQ.t2;
  const stock = {};
  EQUIPMENT_SLOTS.forEach((slot) => {
    const tier = canRollT2 ? pickWeighted(SHOP_GEAR_TIER_WEIGHTS).tier : "t1";
    const namePool = EQUIPMENT_NAMES[tier][slot];
    const name = namePool[Math.floor(Math.random() * namePool.length)];
    stock[slot] = equipmentCreateItem(slot, tier, name);
  });
  return stock;
}

// Shop's rotating domain-specific key line — one domain key type shown per day, never
// the same one two days running. excludeKey is yesterday's pick (or null on first
// roll); picks randomly among the remaining 5 domains. Rotates on the same daily
// boundary as rollShopGearStock — see the dailyQuestDeadline rollover effect.
function rollShopDomainKey(excludeKey) {
  const pool = DOMAINS.map((d) => d.key).filter((k) => k !== excludeKey);
  return pool[Math.floor(Math.random() * pool.length)];
}

// Buying takes a fresh COPY of today's stock listing (new id) rather than moving the
// listing item itself — the listing stays purchasable again (and by other future
// characters/saves) until the next daily reroll, so buying twice is legitimate.
// Shop items never carry an enchant, so this always resets to an empty array.
function equipmentClonePurchase(stockItem) {
  return { ...stockItem, id: equipmentNextId(), enchants: [] };
}

// A short, readable label for an owned/equipped item — used in the Shop, purchase/sell
// confirmation modals, dungeon result popup, and drop/purchase log lines (i.e. every
// SINGLE-LINE context). The Gear tab's owned-item cards use the richer, multi-line
// equipmentCardLines instead — see below. Shows the rolled bonus so two copies of the
// same named item are visibly distinguishable once acquired.
function equipmentItemLabel(item) {
  const parts = [item.tier === "named" ? `${item.name} (Named)` : item.name];
  if (item.slot === "weapon") parts.push(`${(item.bonus * 100).toFixed(1)}% Resolve cut`);
  if (item.slot === "trinket") parts.push(`+${(item.bonus * 100).toFixed(1)}% Tell Chance`);
  if (item.slot === "armor") parts.push(`+${DUNGEON_ARMOR_HEART_BONUS[item.tier]} Hearts`);
  if (item.slot === "armor" && (item.tier === "t3" || item.tier === "named")) {
    parts.push(`${Math.round(EQUIPMENT_ARMOR_PROTECTION_CHANCE[item.tier] * 100)}% Protection`);
  } else if (item.slot !== "armor" && item.tier === "t3") {
    // Weapon/Trinket secondary is UNCHANGED by the Protection Chance change (Armor-only)
    // — still t3-only, per "Weapon and Trinket secondaries are unaffected by this change."
    // Named Weapon/Trinket therefore has no secondary line at all — an asymmetry versus
    // Named Armor getting Protection Chance, but that's what "unaffected" specified.
    parts.push(`+${Math.round(EQUIPMENT_T3_SECONDARY_REDUCTION * 100)}% Resolve cut (2nd)`);
  }
  (item.enchants || []).forEach((ench) => {
    const names = { encounterWinRate: "Win Rate", mysteryBoxRate: "Box Rate", xpGain: "XP Gain", hvGain: "HV Gain" };
    parts.push(`Enchant: ${names[ench.type]}`);
  });
  return parts.join(" — ");
}

// Gear Card display — the Gear tab's owned-item template (queued spec): Primary line
// always shown; Secondary line only for T3/Named (Armor's Secondary is Protection
// Chance instead of a stat effect, per the Armor Protection Chance change); Enchant
// line(s) only when actually rolled — 0, 1, or 2 lines depending on item.enchants
// length (2 is only ever possible on Named). No domain labels anywhere. Lines are
// omitted entirely when not applicable, never shown blank.
function equipmentCardLines(item) {
  const lines = [];
  if (item.slot === "weapon") lines.push(`Primary: ${(item.bonus * 100).toFixed(1)}% Resolve Cost Reduction`);
  else if (item.slot === "trinket") lines.push(`Primary: +${(item.bonus * 100).toFixed(1)}% Tell Chance`);
  else lines.push(`Primary: +${DUNGEON_ARMOR_HEART_BONUS[item.tier]} Hearts`);

  if (item.slot === "armor" && (item.tier === "t3" || item.tier === "named")) {
    lines.push(`Secondary: ${Math.round(EQUIPMENT_ARMOR_PROTECTION_CHANCE[item.tier] * 100)}% Protection Chance`);
  } else if (item.slot !== "armor" && item.tier === "t3") {
    lines.push(`Secondary: +${Math.round(EQUIPMENT_T3_SECONDARY_REDUCTION * 100)}% Resolve Cost Reduction`);
  }

  const enchantNames = { encounterWinRate: "Encounter Win Rate", mysteryBoxRate: "Mystery Box Rate", xpGain: "XP Gain", hvGain: "HV Gain" };
  (item.enchants || []).forEach((ench) => lines.push(`Enchant: ${enchantNames[ench.type]}`));

  return lines;
}

// Boss pool access — which of a location's 7 bosses are eligible this run.
// Novice: bosses #1-4 (index 0-3). Adept: #1-6 (index 0-5). Elite: full 7.
// Both variety dials here (pool access + cue-line count below) are flavor only —
// actual difficulty is still opponent hearts (= room count) and the Tell Chance
// formula, unchanged. See dungeon-bosses-draft-v3.md.
const DUNGEON_BOSS_POOL_SIZE = { novice: 4, adept: 6, elite: 7 };

// Cue-line variety — how many of each move's 3 authored lines are in play this
// tier. Novice: 1 (no variation). Adept: 2. Elite: all 3. The opponent's actual
// move is still a uniform random pick regardless of tier; this only controls
// which sentence displays if that move happens to be revealed by the tell.
const DUNGEON_BOSS_CUE_COUNT = { novice: 1, adept: 2, elite: 3 };

// Display name for a boss — archetype bosses (#1-6, e.g. "Frost Wraith") get "the"
// prepended; the Elite-exclusive named boss (#7, e.g. "Ezkriel, the Lost Pharaoh")
// already carries its own title clause and is used as-is. See dungeon-bosses-draft-v3.md.
function dungeonBossDisplayName(boss) {
  return boss.isNamedBoss ? boss.name : `the ${boss.name}`;
}

// Capitalizes the first letter only — needed because dungeonBossDisplayName
// returns a lowercase "the" for archetype bosses (correct mid-sentence, e.g.
// "You face the Frost Wraith"), but every intro template below places the boss
// reference right after a sentence-ending period, where it needs a capital.
function dungeonCapitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

// One intro line per location (not per boss) — a location's atmosphere doesn't
// change run to run, only which boss shows up. Each function takes the boss's
// already-resolved display name (see dungeonBossDisplayName above, which handles
// the "the"-vs-no-article branching) so this file doesn't duplicate that logic.
// Fires once, on the Final Room's first round only. See final-room-intros-draft.md.
const DUNGEON_FINAL_ROOM_INTROS = {
  physical: (b) => `The wind falls silent as you step into a hollow carved from ice. ${b} is already waiting.`,
  mental: (b) => `The current stills as you enter a vast, glowing cavern. ${b} drifts into view.`,
  financial: (b) => `Torchlight flickers across crumbling stone as you enter the stronghold's heart. ${b} stirs from the shadows.`,
  relational: (b) => `The trees part to reveal a small clearing, silent and waiting. ${b} steps out to meet you.`,
  social: (b) => `The air reeks of territory long marked as another's. ${b} rises to defend it.`,
  faith: (b) => `Sand shifts and settles as you step into the ruin's final chamber. ${b} awakens before you.`,
};
function pickDungeonBoss(domainKey, tierKey) {
  const pool = DUNGEON_BOSSES[domainKey];
  const size = DUNGEON_BOSS_POOL_SIZE[tierKey];
  const eligible = pool.slice(0, size);
  return eligible[Math.floor(Math.random() * eligible.length)];
}

// Picks one cue line for the given move, restricted to this tier's allowed
// variety count (see DUNGEON_BOSS_CUE_COUNT).
function pickDungeonBossCue(boss, move, tierKey) {
  const lines = boss[move];
  const count = DUNGEON_BOSS_CUE_COUNT[tierKey];
  const eligible = lines.slice(0, count);
  return eligible[Math.floor(Math.random() * eligible.length)];
}

// Hidden per-answer cost multiplier — applied alongside tierMultiplier, after the
// floor (same "floor before multiplier" principle the tier multiplier already
// follows; see dungeon-spec.md Section 3). Never surfaced in the UI.
// v38 Dungeon rework: widened from {0.7, 1.0, 1.4} to make authored answer quality
// matter far more now that DUNGEON_ROOM_COST_FLOOR itself is higher (5->10) — a worst
// answer at Elite is now a genuinely costly mistake, not a mild inefficiency.
const DUNGEON_QUALITY_COST_MULT = { best: 0.4, ok: 1.3, worst: 3.0 };

// Fisher-Yates — used to randomize on-screen answer order so quality can never be
// inferred from position (otherwise "top answer is always best" would leak after
// a few runs, defeating the hidden-quality design).
function dungeonShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shared countdown formatter — hour-scale durations (Daily/Urgent Quest windows) show as
// "Xh Ym"; anything under an hour (Penalty challenge minimums) shows as MM:SS.
function formatCountdown(totalSeconds) {
  const clamped = Math.max(0, totalSeconds);
  if (clamped >= 3600) {
    const h = Math.floor(clamped / 3600);
    const m = Math.floor((clamped % 3600) / 60);
    return `${h}h ${m}m`;
  }
  const m = Math.floor(clamped / 60);
  const s = clamped % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

// Returns the timestamp (ms) of the next local midnight strictly after `fromMs`.
function getNextMidnight(fromMs) {
  const d = new Date(fromMs);
  d.setHours(24, 0, 0, 0); // JS correctly rolls this into tomorrow's midnight
  return d.getTime();
}

// Persistent typewriter: pulls one line at a time off an ever-growing queue, so multiple
// pushLog calls in the same tick queue up instead of clobbering each other.
function useTypedLog() {
  const [history, setHistory] = useState([]);
  const queueRef = useRef([]);
  const timerRef = useRef(null);

  const push = useCallback((lines) => {
    queueRef.current = [...queueRef.current, ...lines];
    if (!timerRef.current) tick();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function tick() {
    timerRef.current = setTimeout(() => {
      if (queueRef.current.length === 0) {
        timerRef.current = null;
        return;
      }
      const [next, ...rest] = queueRef.current;
      queueRef.current = rest;
      setHistory((h) => [...h, next]);
      tick();
    }, 550);
  }

  useEffect(() => () => timerRef.current && clearTimeout(timerRef.current), []);

  const clear = useCallback(() => {
    queueRef.current = [];
    if (timerRef.current) {
      clearTimeout(timerRef.current);
      timerRef.current = null;
    }
    setHistory([]);
  }, []);

  return { history, push, clear };
}
